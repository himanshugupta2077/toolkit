<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe6d6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CFA" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" type="image/svg+xml" href="/cfa/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/cfa/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/cfa/manifest.webmanifest" />
  <title>CFA</title>
  <style>
    :root {
      --bg: #efe6d6;
      --paper: #f7f1e6;
      --ink: #1b1712;
      --muted: #7a7166;
      --line: #d8cdb8;
      --ox: #8f2a2a;
      --ox-soft: rgba(143, 42, 42, 0.12);
      --olive: #3d5c45;
      --olive-soft: rgba(61, 92, 69, 0.14);
      --gold: #b0892e;
      --gold-soft: rgba(176, 137, 46, 0.18);
      --prep: #3d5c45;
      --rev: #b0892e;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(120% 70% at 50% -10%, rgba(143, 42, 42, 0.08), transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 16px calc(78px + var(--safe-b));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + var(--safe-t)) 0 12px;
      background: rgba(239, 230, 214, 0.94);
      backdrop-filter: blur(10px);
    }

    .back, .ghost {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font: inherit;
      font-size: 1.15rem;
      cursor: pointer;
      text-decoration: none;
    }
    .back:active, .ghost:active { transform: scale(0.96); }
    .wordmark {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .view { display: none; flex-direction: column; gap: 28px; }
    .view.on { display: flex; }

    .dates { display: flex; flex-direction: column; gap: 28px; padding: 8px 2px 4px; }
    .date-block { display: flex; flex-direction: column; gap: 8px; }
    .date-k {
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .date-v {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .date-br {
      color: var(--muted);
      font-weight: 650;
      font-size: 0.58em;
      letter-spacing: 0;
      margin-left: 0.4em;
      white-space: nowrap;
    }
    .date-sub {
      color: var(--muted);
      font-size: 0.95rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }
    .date-sub.warn { color: var(--ox); }
    .pace-out {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.92rem;
      line-height: 1.45;
      padding: 12px;
      border-radius: 12px;
      background: var(--olive-soft);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pace-out.bad {
      background: var(--ox-soft);
      color: var(--ox);
    }
    .date-v-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .icon-edit {
      appearance: none;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-edit:active { transform: scale(0.96); }
    .icon-edit svg { display: block; }

    .track { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; }
    .track-bar-wrap { position: relative; }
    .track-bar {
      display: flex;
      height: 12px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(27, 23, 18, 0.08);
    }
    .track-bar .prep { background: var(--prep); }
    .track-bar .rev { background: var(--rev); }
    .track-notch {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 2px;
      left: var(--rev-at, 50%);
      transform: translateX(-50%);
      background: var(--ink);
      border-radius: 2px;
      pointer-events: none;
    }
    .track-marks {
      position: relative;
      min-height: 1.25em;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 650;
    }
    .track-marks .start { position: absolute; left: 0; }
    .track-marks .end { position: absolute; right: 0; text-align: right; }
    .track-marks .mid {
      position: absolute;
      left: var(--rev-at, 50%);
      transform: translateX(-50%);
      color: var(--gold);
      white-space: nowrap;
    }
    .dot-prep, .dot-rev {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .dot-prep { background: var(--prep); }
    .dot-rev { background: var(--rev); }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }
    .sec-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .sec-h h2 {
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sec-h span { color: var(--muted); font-size: 0.78rem; font-family: system-ui, sans-serif; }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px 8px;
      font-size: 0.95rem;
    }

    .row {
      appearance: none;
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 4px;
      text-align: left;
      cursor: pointer;
      border-top: 1px solid rgba(216, 205, 184, 0.7);
    }
    .row:first-of-type { border-top: 0; }
    .ttl {
      font-size: 1rem;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ttl.done { text-decoration: line-through; color: var(--muted); }
    .sub {
      color: var(--muted);
      font-size: 0.72rem;
      font-family: system-ui, sans-serif;
      margin-top: 2px;
    }
    .pct {
      min-width: 52px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.92rem;
      font-family: system-ui, sans-serif;
    }
    .pct.done { color: var(--olive); }
    .star { color: var(--gold); margin-left: 4px; }

    .search {
      width: 100%;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .chip {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.on { color: var(--ink); background: #fff; border-color: var(--ink); }

    .day {
      appearance: none;
      width: 100%;
      border: 0;
      border-top: 1px solid rgba(216, 205, 184, 0.75);
      background: transparent;
      color: inherit;
      font: inherit;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 12px 4px;
      text-align: left;
      cursor: pointer;
    }
    .day:first-of-type { border-top: 0; }
    .day.today {
      background: rgba(143, 42, 42, 0.06);
      margin: 0 -8px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 12px;
    }
    .day.off .d-name { color: var(--muted); }
    .d-wd { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .d-num { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .d-name { font-size: 0.95rem; min-width: 0; }
    .d-alloc {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .d-alloc span { display: block; line-height: 1.25; }
    .ex-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ex-chip {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 11px;
      font: inherit;
      font-size: 0.82rem;
      font-family: system-ui, sans-serif;
      cursor: pointer;
    }
    .plan-line {
      font-size: 0.98rem;
      padding: 6px 0;
      border-top: 1px solid rgba(216, 205, 184, 0.7);
    }
    .plan-line:first-child { border-top: 0; }
    .d-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .d-tag.off { color: var(--ox); }
    .d-tag.rev { color: var(--gold); }

    .err { color: var(--ox); font-size: 0.82rem; min-height: 1.1em; }

    .btn {
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      border-radius: 12px;
      padding: 12px 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.soft { background: var(--paper); color: var(--ink); border-color: var(--line); }
    .btn.danger { background: var(--ox-soft); color: var(--ox); border-color: rgba(143, 42, 42, 0.3); }
    .btn:disabled { opacity: 0.4; }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 8px 12px calc(10px + var(--safe-b));
      background: rgba(239, 230, 214, 0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
    }
    .nav button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 0;
      cursor: pointer;
    }
    .nav button.on { color: var(--ink); }

    .sheet-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(27, 23, 18, 0.38);
      z-index: 20;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-bg.on { display: flex; }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: min(88dvh, 720px);
      overflow: auto;
      background: var(--bg);
      border-radius: 22px 22px 0 0;
      padding: 16px 16px calc(24px + var(--safe-b));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .grab {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: var(--line);
      margin: 0 auto 4px;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field-lab {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
    }
    .prog-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .prog-top .pct-now {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
    }
    input[type="range"].tube {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--olive) var(--p, 0%), rgba(27, 23, 18, 0.08) var(--p, 0%));
      outline: none;
    }
    input[type="range"].tube::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid #fffdf8;
      box-shadow: 0 1px 4px rgba(27, 23, 18, 0.2);
      cursor: pointer;
    }
    input[type="range"].tube::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid #fffdf8;
      box-shadow: 0 1px 4px rgba(27, 23, 18, 0.2);
      cursor: pointer;
    }
    .page-scale {
      display: flex;
      justify-content: space-between;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .page-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-pick {
      appearance: none;
      min-width: 38px;
      height: 36px;
      padding: 0 8px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .page-pick.on {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .warn-copy {
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .warn-copy ul {
      margin: 10px 0 0 1.15em;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .actions { display: flex; gap: 8px; }
    .actions .btn { flex: 1; }
    .list-tools { display: flex; gap: 8px; }
    .list-tools .search { flex: 1; }

    .sheet input, .sheet textarea {
      width: 100%;
      appearance: none;
      border: 1px solid var(--line);
      background: #fffdf8;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
    }
    .sheet input[type="date"] { min-height: 48px; }
    .sheet input[type="number"] { min-height: 48px; }
    .sheet textarea { min-height: 88px; resize: vertical; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="back" href="/" aria-label="Toolkit">←</a>
      <span class="wordmark">CFA</span>
      <span style="width:40px" aria-hidden="true"></span>
    </header>

    <section id="view-home" class="view on"></section>
    <section id="view-readings" class="view"></section>
    <section id="view-plan" class="view"></section>
  </div>

  <nav class="nav">
    <button type="button" data-tab="home" class="on">Home</button>
    <button type="button" data-tab="readings">Readings</button>
    <button type="button" data-tab="plan">Plan</button>
  </nav>

  <div class="sheet-bg" id="sheetBg" hidden>
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    const EXAM = "2026-11-17";
    let state = null;
    let tab = "home";
    let listFilter = "left";
    let listQ = "";
    let saveTimer = 0;

    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function parseISO(iso) {
      const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    }

    function fmtDay(iso, mode) {
      const d = parseISO(iso);
      if (!d) return iso || "";
      if (mode === "short") {
        return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      }
      if (mode === "tiny") {
        return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
      }
      return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    }

    function addDays(iso, n) {
      const d = parseISO(iso);
      d.setDate(d.getDate() + n);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function readings() {
      return state.readings || state.chapters || [];
    }

    function readingById(id) {
      return readings().find((r) => r.id === id);
    }

    function readingLabel(r) {
      return `Reading ${r.n}`;
    }

    function isDone(r) {
      const pages = Number(r.pages) || 0;
      const page = Number(r.page) || 0;
      return pages > 0 && page >= pages;
    }

    function pageRange(from, to) {
      if (from === to) return `p. ${from}`;
      return `p. ${from}–${to}`;
    }

    function pageStatus(r) {
      const pages = Number(r.pages) || 0;
      const page = Number(r.page) || 0;
      if (!pages) return "No pages";
      if (!page) return `0 of ${pages}`;
      if (page >= pages) return `All ${pages} pages`;
      return `Through page ${page} of ${pages}`;
    }

    function fmtNum(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return "0";
      return Number.isInteger(x) ? String(x) : String(x);
    }

    function roundPages(n) {
      if (!(n > 0)) return 0;
      return Math.floor(n + 0.5);
    }

    function isWeekendIso(iso) {
      const d = parseISO(iso);
      if (!d) return false;
      const w = d.getDay();
      return w === 0 || w === 6;
    }

    function paceOutlookFromInputs(pph, wd, we) {
      const remaining = Number(state.stats && state.stats.remainingPages) || 0;
      const days = (state.plan || []).filter((d) => d.kind === "prep");
      let hoursAvail = 0;
      let pagesAvail = 0;
      let left = remaining;
      let finishOn = null;
      for (const day of days) {
        const hours = isWeekendIso(day.date) ? we : wd;
        const cap = roundPages(pph * hours);
        hoursAvail += Number(hours) || 0;
        pagesAvail += cap;
        if (left > 0 && cap > 0) {
          left -= Math.min(left, cap);
          if (left <= 0) finishOn = day.date;
        }
      }
      const unscheduled = Math.max(0, left);
      const feasible = remaining === 0 || unscheduled === 0;
      let suggest = null;
      if (!feasible && hoursAvail > 0) {
        let step = Math.ceil((remaining / hoursAvail) * 2 - 1e-9) / 2;
        if (step < 0.5) step = 0.5;
        while (step <= 40) {
          let trialLeft = remaining;
          for (const day of days) {
            const hours = isWeekendIso(day.date) ? we : wd;
            const cap = roundPages(step * hours);
            if (cap <= 0) continue;
            trialLeft -= Math.min(trialLeft, cap);
            if (trialLeft <= 0) break;
          }
          if (trialLeft <= 0) {
            suggest = step;
            break;
          }
          step = Math.round((step + 0.5) * 10) / 10;
        }
      }
      return {
        remainingPages: remaining,
        hoursAvailable: hoursAvail,
        hoursNeeded: pph ? remaining / pph : 0,
        pagesAvailable: pagesAvail,
        unscheduledPages: unscheduled,
        finishOn,
        feasible,
        suggestPagesPerHour: suggest,
        weekdayPages: roundPages(pph * wd),
        weekendPages: roundPages(pph * we),
        revisionStart: revisionStartIso(),
      };
    }

    function paceStatusLine(s) {
      if ((s.remainingPages || 0) <= 0) return "Readings complete";
      if (s.feasible && s.finishOn) return `Finish by ${fmtDay(s.finishOn, "tiny")}`;
      const short = s.unscheduledPages || 0;
      return `Not feasible — ${short} pages short`;
    }

    function paceOutlookHtml(o) {
      if ((o.remainingPages || 0) <= 0) {
        return `<div id="paceOut" class="pace-out">All readings are done.</div>`;
      }
      if (o.feasible && o.finishOn) {
        return (
          `<div id="paceOut" class="pace-out">` +
          `<strong>Finish by ${esc(fmtDay(o.finishOn))}</strong>` +
          `<span>${o.remainingPages} pages left · ${o.weekdayPages} pages / weekday · ${o.weekendPages} / weekend</span>` +
          `</div>`
        );
      }
      const suggest = o.suggestPagesPerHour
        ? `<span>At these hours you need at least ${esc(fmtNum(o.suggestPagesPerHour))} pages per hour to finish before revision.</span>`
        : "";
      return (
        `<div id="paceOut" class="pace-out bad">` +
        `<strong>Not feasible.</strong>` +
        `<span>You cannot finish before revision` +
        (o.revisionStart ? ` (${esc(fmtDay(o.revisionStart, "tiny"))})` : "") +
        `. This pace covers ${o.pagesAvailable} of ${o.remainingPages} pages; ${o.unscheduledPages} would still be unread.</span>` +
        suggest +
        `</div>`
      );
    }

    function editIcon(attr) {
      return (
        `<button type="button" class="icon-edit" ${attr} aria-label="Edit">` +
        `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
        `<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>` +
        `</svg></button>`
      );
    }

    function planDay(iso) {
      return (state.plan || []).find((d) => d.date === iso) || null;
    }

    function planForReading(id) {
      const out = [];
      for (const day of state.plan || []) {
        for (const it of day.items || []) {
          if (it.id === id) {
            out.push({
              date: day.date,
              pagesFrom: it.pagesFrom,
              pagesTo: it.pagesTo,
              pages: it.pages,
            });
          }
        }
      }
      return out;
    }

    function revisionStartIso() {
      return state.revisionStart || (state.stats && state.stats.revisionStart) || "";
    }

    function revisionEndIso() {
      return (state.stats && state.stats.revisionEnd) || addDays(EXAM, -1);
    }

    function revisionWindowDays() {
      const s = state.stats || {};
      if (s.revisionDays != null) return s.revisionDays;
      const a = parseISO(revisionStartIso());
      const b = parseISO(revisionEndIso());
      if (!a || !b) return 0;
      return Math.max(0, Math.round((b - a) / 86400000) + 1);
    }

    function examDaysCopy(s) {
      if (s.daysToExam > 1) return `[${s.daysToExam} days left]`;
      if (s.daysToExam === 1) return `[1 day left]`;
      if (s.daysToExam === 0) return `[Exam today]`;
      return `[Exam passed]`;
    }

    function revisionDaysCopy(s) {
      if (s.daysToRevision > 1) return `[${s.daysToRevision} days to revision]`;
      if (s.daysToRevision === 1) return `[1 day to revision]`;
      if (s.daysToRevision === 0) return `[Revision starts today]`;
      return `[In revision]`;
    }

    function addOffDates(isos) {
      const have = new Set((state.offDays || []).map((o) => o.date));
      let added = false;
      for (const iso of isos) {
        if (!iso || iso >= EXAM || have.has(iso)) continue;
        have.add(iso);
        state.offDays.push({ date: iso, reason: "" });
        added = true;
      }
      if (added) persist();
    }

    function persistBody() {
      return {
        startedOn: state.startedOn,
        revisionStart: state.revisionStart,
        planVersion: state.planVersion,
        pagesPerHour: state.pagesPerHour,
        weekdayHours: state.weekdayHours,
        weekendHours: state.weekendHours,
        readings: readings(),
        offDays: state.offDays,
      };
    }

    async function load() {
      const r = await fetch("/api/cfa");
      if (!r.ok) throw new Error("load failed");
      state = await r.json();
      render();
    }

    function persist() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 180);
    }

    async function flush() {
      if (!state) return;
      const r = await fetch("/api/cfa", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(persistBody()),
      });
      if (!r.ok) return;
      const openId = $("sheet").dataset.reading;
      const openDay = $("sheet").dataset.day;
      const openSheetKind = $("sheet").dataset.sheet;
      state = await r.json();
      render();
      if (openId) openReading(openId);
      if (openDay) openDaySheet(openDay);
      if (openSheetKind === "rev") openRevSheet();
      if (openSheetKind === "pace") openPaceSheet();
      if (openSheetKind === "ex-one") openExcludeOne();
      if (openSheetKind === "ex-range") openExcludeRange();
    }

    function setPage(rd, value) {
      const pages = Number(rd.pages) || 0;
      const next = Math.max(0, Math.min(pages, Math.round(Number(value) || 0)));
      const today = state.stats.today;
      rd.page = next;
      rd.progress = pages ? Math.round((100 * next) / pages) : 0;
      rd.updatedOn = today;
      rd.completedOn = pages && next >= pages ? today : null;
      persist();
    }

    function setPagesCount(rd, value) {
      let pages = Math.round(Number(value) || 0);
      if (!Number.isFinite(pages)) pages = Number(rd.pages) || 1;
      pages = Math.max(1, Math.min(200, pages));
      const prev = Number(rd.page) || 0;
      rd.pages = pages;
      if (prev > pages) {
        setPage(rd, pages);
        return;
      }
      rd.progress = Math.round((100 * prev) / pages);
      if (prev >= pages) rd.completedOn = state.stats.today;
      else rd.completedOn = null;
      persist();
    }

    function setTab(name) {
      tab = name;
      document.querySelectorAll(".nav button").forEach((b) => {
        b.classList.toggle("on", b.dataset.tab === name);
      });
      render();
      window.scrollTo(0, 0);
    }

    function openSheet(html) {
      const bg = $("sheetBg");
      const el = $("sheet");
      el.innerHTML = `<div class="grab"></div>` + html;
      bg.hidden = false;
      bg.classList.add("on");
    }

    function closeSheet() {
      const bg = $("sheetBg");
      bg.classList.remove("on");
      bg.hidden = true;
      $("sheet").innerHTML = "";
      delete $("sheet").dataset.reading;
      delete $("sheet").dataset.day;
      delete $("sheet").dataset.sheet;
    }

    function readingRow(rd, extra) {
      const done = isDone(rd);
      const pages = Number(rd.pages) || 0;
      const page = Number(rd.page) || 0;
      return (
        `<button type="button" class="row" data-open="${esc(rd.id)}">` +
        `<span><div class="ttl${done ? " done" : ""}">${esc(readingLabel(rd))}</div>` +
        `<div class="sub">${esc(extra || `${pages} pages`)}</div>` +
        `</span>` +
        `<span class="pct${done ? " done" : ""}">${page}/${pages}` +
        (rd.bookmarked ? `<span class="star">★</span>` : "") +
        `</span></button>`
      );
    }

    function renderHome() {
      const s = state.stats;
      const today = s.today;
      const revStart = revisionStartIso();
      const revEnd = revisionEndIso();
      const day = planDay(today);
      const items = (day && day.items) || [];

      const span = Math.max(s.daysToExam, 1);
      const toRev = Math.max(s.daysToRevision, 0);
      const revDays = Math.max(0, Math.min(span, span - toRev));
      const prepPct = s.phase === "after" ? 0 : Math.max(0, (toRev / span) * 100);
      const revPct = s.phase === "after" ? 100 : Math.max(0, (revDays / span) * 100);

      let body = "";
      if (day && day.kind === "off") {
        body = `<div class="empty">Excluded</div>`;
      } else if (day && day.kind === "revision") {
        body = `<div class="empty">Revision</div>`;
      } else if (day && day.kind === "exam") {
        body = `<div class="empty">Exam</div>`;
      } else if (!items.length) {
        body = `<div class="empty">Nothing today</div>`;
      } else {
        body = items.map((it) => {
          const rd = readingById(it.id);
          return rd ? readingRow(rd, `${pageRange(it.pagesFrom, it.pagesTo)} · ${it.pages} pages`) : "";
        }).join("");
      }

      const todayMeta = day && day.kind === "prep"
        ? `${day.pages || 0} pages · ${fmtNum(day.hours || s.todayHours)} h`
        : (items.length || "");

      $("view-home").innerHTML =
        `<div class="dates">` +
        `<div class="date-block">` +
        `<div class="date-k">Exam date</div>` +
        `<div class="date-v">${esc(fmtDay(s.examDate))}<span class="date-br">${esc(examDaysCopy(s))}</span></div>` +
        `</div>` +
        `<div class="date-block">` +
        `<div class="date-k">Revision</div>` +
        `<div class="date-v-row">` +
        `<div class="date-v">${esc(fmtDay(revStart, "tiny"))} – ${esc(fmtDay(revEnd, "tiny"))}<span class="date-br">${esc(revisionDaysCopy(s))}</span></div>` +
        editIcon("data-edit-rev") +
        `</div>` +
        `</div>` +
        `<div class="date-block">` +
        `<div class="date-k">Study pace</div>` +
        `<div class="date-v-row">` +
        `<div class="date-v">${esc(fmtNum(s.pagesPerHour))} pages / hour</div>` +
        editIcon("data-edit-pace") +
        `</div>` +
        `<div class="date-sub">Weekdays ${esc(fmtNum(s.weekdayHours))} h · Weekends ${esc(fmtNum(s.weekendHours))} h</div>` +
        `<div class="date-sub${s.feasible || !(s.remainingPages > 0) ? "" : " warn"}">${esc(paceStatusLine(s))}</div>` +
        `</div>` +
        `</div>` +
        `<div class="track" style="--rev-at:${prepPct}%">` +
        `<div class="track-bar-wrap">` +
        `<div class="track-bar"><i class="prep" style="width:${prepPct}%"></i><i class="rev" style="width:${revPct}%"></i></div>` +
        `<b class="track-notch"></b>` +
        `</div>` +
        `<div class="track-marks">` +
        `<span class="start">Today</span>` +
        `<span class="mid">${esc(fmtDay(revStart, "tiny"))}</span>` +
        `<span class="end">${esc(fmtDay(s.examDate, "tiny"))}</span>` +
        `</div>` +
        `</div>` +
        `<div class="card">` +
        `<div class="sec-h"><h2>${esc(fmtDay(today))}</h2><span>${esc(String(todayMeta))}</span></div>` +
        body +
        `</div>`;
    }

    function renderPlan() {
      const s = state.stats;
      const revStart = revisionStartIso();
      const revEnd = revisionEndIso();
      const windowDays = revisionWindowDays();
      const excluded = (state.offDays || [])
        .filter((o) => o.date >= s.today && o.date < EXAM)
        .slice()
        .sort((a, b) => (a.date < b.date ? -1 : 1));
      const chips = excluded.length
        ? excluded.map((o) =>
            `<button type="button" class="ex-chip" data-unoff="${esc(o.date)}">${esc(fmtDay(o.date, "tiny"))} ×</button>`
          ).join("")
        : `<div class="empty">None</div>`;

      const rows = (state.plan || []).map((day) => {
        const d = parseISO(day.date);
        let tag = "Prep";
        let name = "";
        if (day.kind === "exam") {
          tag = "Exam";
          name = "Exam";
        } else if (day.kind === "off") {
          tag = "Excluded";
          name = "Excluded";
        } else if (day.kind === "revision") {
          tag = "Revision";
          name = "Revision";
        } else if (day.items && day.items.length) {
          name = day.items.map((it) => `Reading ${it.n} · ${pageRange(it.pagesFrom, it.pagesTo)}`).join("\n");
        } else {
          name = "—";
        }
        const lines = String(name).split("\n").map((line) => `<span>${esc(line)}</span>`).join("");
        return (
          `<button type="button" class="day${day.date === s.today ? " today" : ""}${day.kind === "off" ? " off" : ""}" data-day="${day.date}">` +
          `<span><div class="d-wd">${d.toLocaleDateString(undefined, { weekday: "short" })}</div>` +
          `<div class="d-num">${d.getDate()}</div></span>` +
          `<span class="d-name d-alloc">${lines}</span>` +
          `<span class="d-tag${day.kind === "off" ? " off" : day.kind === "revision" || day.kind === "exam" ? " rev" : ""}">${esc(tag)}</span>` +
          `</button>`
        );
      }).join("");

      $("view-plan").innerHTML =
        `<div class="card">` +
        `<div class="sec-h"><h2>Revision</h2>${editIcon("data-edit-rev")}</div>` +
        `<div class="date-v">${esc(fmtDay(revStart, "tiny"))} – ${esc(fmtDay(revEnd, "tiny"))}<span class="date-br">${esc(revisionDaysCopy(s))}</span></div>` +
        `<div class="date-sub">${windowDays} days</div>` +
        `</div>` +
        `<div class="card">` +
        `<div class="sec-h"><h2>Study pace</h2>${editIcon("data-edit-pace")}</div>` +
        `<div class="date-v">${esc(fmtNum(s.pagesPerHour))} pages / hour</div>` +
        `<div class="date-sub">Weekdays ${esc(fmtNum(s.weekdayHours))} h · Weekends ${esc(fmtNum(s.weekendHours))} h</div>` +
        `<div class="date-sub${s.feasible || !(s.remainingPages > 0) ? "" : " warn"}">${esc(paceStatusLine(s))}</div>` +
        `</div>` +
        `<div class="card">` +
        `<div class="sec-h"><h2>Excluded</h2></div>` +
        `<div class="ex-chips">${chips}</div>` +
        `<div class="actions" style="margin-top:12px">` +
        `<button type="button" class="btn soft" id="exAddOne">+ Date</button>` +
        `<button type="button" class="btn soft" id="exAddRange">+ Range</button>` +
        `</div>` +
        `</div>` +
        `<div class="card">${rows}</div>`;
    }

    function renderReadings() {
      const q = listQ.trim().toLowerCase();
      const books = state.books || [];
      const all = readings().slice().sort((a, b) => a.n - b.n);
      const chips = [
        ["left", "Left"],
        ["all", "All"],
        ["done", "Done"],
        ["star", "★"],
      ].map(([k, lab]) =>
        `<button type="button" class="chip${listFilter === k ? " on" : ""}" data-filter="${k}">${lab}</button>`
      ).join("");

      const cards = books.map((book) => {
        let items = all.filter((r) => r.n >= book.from && r.n <= book.to);
        if (listFilter === "left") items = items.filter((r) => !isDone(r));
        else if (listFilter === "done") items = items.filter((r) => isDone(r));
        else if (listFilter === "star") items = items.filter((r) => r.bookmarked);
        if (q) {
          items = items.filter((r) =>
            String(r.n).includes(q) ||
            String(r.title || "").toLowerCase().includes(q) ||
            `reading ${r.n}`.includes(q) ||
            String(book.title || "").toLowerCase().includes(q)
          );
        }
        if (!items.length) return "";
        return (
          `<div class="card">` +
          `<div class="sec-h"><h2>${esc(book.title)}</h2><span>Readings ${book.from}–${book.to}</span></div>` +
          items.map((r) => readingRow(r)).join("") +
          `</div>`
        );
      }).filter(Boolean).join("");

      $("view-readings").innerHTML =
        `<div class="list-tools">` +
        `<input class="search" id="listSearch" type="search" placeholder="Reading" value="${esc(listQ)}" />` +
        `</div>` +
        `<div class="chips">${chips}</div>` +
        (cards || `<div class="card"><div class="empty">None</div></div>`);

      const input = $("listSearch");
      if (input) {
        input.addEventListener("input", () => {
          listQ = input.value;
          const pos = input.selectionStart;
          renderReadings();
          const next = $("listSearch");
          if (next) {
            next.focus();
            next.setSelectionRange(pos, pos);
          }
        });
      }
    }

    function render() {
      if (!state) return;
      document.querySelectorAll(".view").forEach((el) => el.classList.remove("on"));
      const el = $(`view-${tab}`);
      if (el) el.classList.add("on");
      if (tab === "home") renderHome();
      if (tab === "plan") renderPlan();
      if (tab === "readings") renderReadings();
    }

    function openReading(id, mode) {
      const rd = readingById(id);
      if (!rd) return;
      if (mode === "reset") {
        openSheet(
          `<div class="sec-h"><h2>Reset reading ${rd.n}?</h2><span></span></div>` +
          `<div class="warn-copy">Are you sure you want to reset this reading? This will:` +
          `<ul>` +
          `<li>Set progress to page 0</li>` +
          `<li>Clear notes</li>` +
          `</ul></div>` +
          `<div class="actions">` +
          `<button type="button" class="btn soft" id="rdResetNo">No</button>` +
          `<button type="button" class="btn danger" id="rdResetYes">Yes, reset</button>` +
          `</div>`
        );
        $("sheet").dataset.reading = id;
        delete $("sheet").dataset.day;
        return;
      }
      const pages = Number(rd.pages) || 0;
      const page = Number(rd.page) || 0;
      const pct = pages ? Math.round((100 * page) / pages) : 0;
      const slots = planForReading(rd.id);
      const planHtml = slots.length
        ? slots.map((s) => `<div class="plan-line">${esc(fmtDay(s.date, "short"))} · ${esc(pageRange(s.pagesFrom, s.pagesTo))}</div>`).join("")
        : `<div class="empty">${isDone(rd) ? "Done" : "Not in prep window"}</div>`;
      const ticks = pages <= 1
        ? `<span>0</span><span>1</span>`
        : `<span>0</span><span>${pages}</span>`;
      const picks = Array.from({ length: pages + 1 }, (_, n) =>
        `<button type="button" class="page-pick${n === page ? " on" : ""}" data-page="${n}">${n === 0 ? "0" : n}</button>`
      ).join("");
      openSheet(
        `<div class="sec-h"><h2>Reading ${rd.n}</h2><span>Book ${rd.book}</span></div>` +
        `<div class="field">` +
        `<div class="field-lab">Pages in this reading</div>` +
        `<input id="rdPages" type="number" min="1" max="200" step="1" value="${pages}" />` +
        `</div>` +
        `<div class="field">` +
        `<div class="prog-top"><div class="field-lab">Done through page</div><span class="pct-now" id="rdPageLab">${esc(pageStatus(rd))}</span></div>` +
        `<div class="page-picks">${picks}</div>` +
        `<input id="rdPage" class="tube" type="range" min="0" max="${pages}" step="1" value="${page}" style="--p:${pct}%" />` +
        `<div class="page-scale">${ticks}</div>` +
        `</div>` +
        `<div class="field">` +
        `<div class="field-lab">Plan</div>` +
        `<div>${planHtml}</div>` +
        `</div>` +
        `<div class="field">` +
        `<div class="field-lab">Notes</div>` +
        `<textarea id="rdNotes" maxlength="4000">${esc(rd.notes)}</textarea>` +
        `</div>` +
        `<div class="actions">` +
        `<button type="button" class="btn soft" id="rdStar">${rd.bookmarked ? "Bookmarked" : "Bookmark"}</button>` +
        `<button type="button" class="btn danger" id="rdReset">Reset</button>` +
        `<button type="button" class="btn" id="rdDone"${isDone(rd) ? " disabled" : ""}>Completed</button>` +
        `</div>`
      );
      $("sheet").dataset.reading = id;
      delete $("sheet").dataset.day;
    }

    function openRevSheet() {
      const revStart = revisionStartIso();
      const maxRev = revisionEndIso();
      openSheet(
        `<div class="sec-h"><h2>Revision start</h2><span></span></div>` +
        `<input id="revStart" type="date" value="${esc(revStart)}" max="${esc(maxRev)}" />` +
        `<button type="button" class="btn" id="revSave">Save</button>`
      );
      $("sheet").dataset.sheet = "rev";
      delete $("sheet").dataset.reading;
      delete $("sheet").dataset.day;
    }

    function openPaceSheet() {
      const s = state.stats || {};
      openSheet(
        `<div class="sec-h"><h2>Study pace</h2><span></span></div>` +
        `<div class="field"><div class="field-lab">Pages per hour</div>` +
        `<input id="pacePph" type="number" min="0.5" max="40" step="0.5" value="${esc(fmtNum(s.pagesPerHour))}" /></div>` +
        `<div class="field"><div class="field-lab">Hours on weekdays</div>` +
        `<input id="paceWd" type="number" min="0" max="16" step="0.5" value="${esc(fmtNum(s.weekdayHours))}" /></div>` +
        `<div class="field"><div class="field-lab">Hours on weekends</div>` +
        `<input id="paceWe" type="number" min="0" max="16" step="0.5" value="${esc(fmtNum(s.weekendHours))}" /></div>` +
        `<div id="paceOut"></div>` +
        `<button type="button" class="btn" id="paceSave">Save</button>`
      );
      $("sheet").dataset.sheet = "pace";
      delete $("sheet").dataset.reading;
      delete $("sheet").dataset.day;
      refreshPacePreview();
    }

    function readPaceInputs() {
      const pph = Number($("pacePph") && $("pacePph").value);
      const wd = Number($("paceWd") && $("paceWd").value);
      const we = Number($("paceWe") && $("paceWe").value);
      return {
        pagesPerHour: Number.isFinite(pph) ? pph : 0,
        weekdayHours: Number.isFinite(wd) ? wd : 0,
        weekendHours: Number.isFinite(we) ? we : 0,
      };
    }

    function refreshPacePreview() {
      const box = $("paceOut");
      const btn = $("paceSave");
      if (!box) return;
      const inp = readPaceInputs();
      const o = paceOutlookFromInputs(inp.pagesPerHour, inp.weekdayHours, inp.weekendHours);
      const wrap = document.createElement("div");
      wrap.innerHTML = paceOutlookHtml(o);
      const node = wrap.firstElementChild;
      if (node) box.replaceWith(node);
      if (btn) {
        const blocking = (state.stats && state.stats.phase === "prep") && !o.feasible && o.remainingPages > 0;
        btn.disabled = blocking;
      }
    }

    function openExcludeOne() {
      const s = state.stats;
      const max = addDays(revisionStartIso() || s.revisionStart, -1);
      openSheet(
        `<div class="sec-h"><h2>Exclude date</h2><span></span></div>` +
        `<input id="exOne" type="date" value="${esc(s.today)}" min="${esc(s.today)}" max="${esc(max)}" />` +
        `<button type="button" class="btn" id="exOneSave">Add</button>`
      );
      $("sheet").dataset.sheet = "ex-one";
      delete $("sheet").dataset.reading;
      delete $("sheet").dataset.day;
    }

    function openExcludeRange() {
      const s = state.stats;
      const max = addDays(revisionStartIso() || s.revisionStart, -1);
      openSheet(
        `<div class="sec-h"><h2>Exclude range</h2><span></span></div>` +
        `<div class="field"><div class="field-lab">From</div><input id="exFrom" type="date" value="${esc(s.today)}" min="${esc(s.today)}" max="${esc(max)}" /></div>` +
        `<div class="field"><div class="field-lab">To</div><input id="exTo" type="date" value="${esc(s.today)}" min="${esc(s.today)}" max="${esc(max)}" /></div>` +
        `<button type="button" class="btn" id="exRangeSave">Add</button>`
      );
      $("sheet").dataset.sheet = "ex-range";
      delete $("sheet").dataset.reading;
      delete $("sheet").dataset.day;
    }

    function openDaySheet(iso) {
      const day = planDay(iso);
      const kind = day ? day.kind : "prep";
      const items = (day && day.items) || [];
      let extra = "";
      if (kind === "exam") {
        extra = `<div class="empty">Exam</div>`;
      } else if (kind === "revision") {
        extra = `<div class="empty">Revision</div>`;
      } else if (kind === "off") {
        extra =
          `<div class="empty">Excluded</div>` +
          `<button type="button" class="btn" id="dayInclude">Include this day</button>`;
      } else {
        extra =
          (items.length
            ? items.map((it) => `<div class="plan-line">Reading ${it.n} · ${pageRange(it.pagesFrom, it.pagesTo)}</div>`).join("")
            : `<div class="empty">Nothing</div>`) +
          `<button type="button" class="btn danger" id="dayExclude">Exclude this day</button>`;
      }
      openSheet(
        `<div class="sec-h"><h2>${esc(fmtDay(iso))}</h2><span></span></div>` + extra
      );
      $("sheet").dataset.day = iso;
      delete $("sheet").dataset.reading;
    }

    document.querySelector(".nav").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tab]");
      if (btn) setTab(btn.dataset.tab);
    });

    document.querySelector(".app").addEventListener("click", (e) => {
      const filter = e.target.closest("[data-filter]");
      if (filter) {
        listFilter = filter.getAttribute("data-filter") || "left";
        renderReadings();
        return;
      }
      const open = e.target.closest("[data-open]");
      if (open) {
        openReading(open.getAttribute("data-open"));
        return;
      }
      if (e.target.closest("[data-edit-rev]")) {
        openRevSheet();
        return;
      }
      if (e.target.closest("[data-edit-pace]")) {
        openPaceSheet();
        return;
      }
      const unoff = e.target.closest("[data-unoff]");
      if (unoff) {
        const iso = unoff.getAttribute("data-unoff");
        state.offDays = (state.offDays || []).filter((o) => o.date !== iso);
        persist();
        return;
      }
      if (e.target.id === "exAddOne") {
        openExcludeOne();
        return;
      }
      if (e.target.id === "exAddRange") {
        openExcludeRange();
        return;
      }
      const day = e.target.closest("[data-day]");
      if (day) {
        openDaySheet(day.getAttribute("data-day"));
      }
    });

    $("sheetBg").addEventListener("click", (e) => {
      if (e.target === $("sheetBg")) closeSheet();
    });

    $("sheet").addEventListener("click", (e) => {
      const id = $("sheet").dataset.reading;
      const day = $("sheet").dataset.day;
      if (id) {
        const rd = readingById(id);
        if (!rd) return;
        if (e.target.id === "rdStar") {
          rd.bookmarked = !rd.bookmarked;
          persist();
          return;
        }
        if (e.target.id === "rdReset") {
          openReading(id, "reset");
          return;
        }
        if (e.target.id === "rdResetNo") {
          openReading(id);
          return;
        }
        if (e.target.id === "rdResetYes") {
          rd.page = 0;
          rd.progress = 0;
          rd.date = null;
          rd.notes = "";
          rd.updatedOn = null;
          rd.completedOn = null;
          persist();
          return;
        }
        if (e.target.id === "rdDone") {
          setPage(rd, rd.pages);
          return;
        }
        const pick = e.target.closest("[data-page]");
        if (pick) {
          setPage(rd, pick.getAttribute("data-page"));
          return;
        }
      }
      if (e.target.id === "revSave") {
        const next = ($("revStart") && $("revStart").value) || "";
        if (!next || next >= EXAM) return;
        state.revisionStart = next;
        closeSheet();
        persist();
        return;
      }
      if (e.target.id === "paceSave") {
        const inp = readPaceInputs();
        const o = paceOutlookFromInputs(inp.pagesPerHour, inp.weekdayHours, inp.weekendHours);
        if ((state.stats && state.stats.phase === "prep") && !o.feasible && o.remainingPages > 0) {
          refreshPacePreview();
          return;
        }
        if (Number.isFinite(inp.pagesPerHour)) state.pagesPerHour = inp.pagesPerHour;
        if (Number.isFinite(inp.weekdayHours)) state.weekdayHours = inp.weekdayHours;
        if (Number.isFinite(inp.weekendHours)) state.weekendHours = inp.weekendHours;
        closeSheet();
        persist();
        return;
      }
      if (e.target.id === "exOneSave") {
        const iso = ($("exOne") && $("exOne").value) || "";
        closeSheet();
        addOffDates([iso]);
        return;
      }
      if (e.target.id === "exRangeSave") {
        const from = ($("exFrom") && $("exFrom").value) || "";
        const to = ($("exTo") && $("exTo").value) || "";
        if (!from || !to) return;
        const start = from < to ? from : to;
        const end = from < to ? to : from;
        const dates = [];
        for (let iso = start; iso <= end; iso = addDays(iso, 1)) dates.push(iso);
        closeSheet();
        addOffDates(dates);
        return;
      }
      if (day) {
        if (e.target.id === "dayExclude") {
          closeSheet();
          addOffDates([day]);
          return;
        }
        if (e.target.id === "dayInclude") {
          state.offDays = (state.offDays || []).filter((o) => o.date !== day);
          closeSheet();
          persist();
        }
      }
    });

    $("sheet").addEventListener("change", (e) => {
      const id = $("sheet").dataset.reading;
      if (id) {
        const rd = readingById(id);
        if (!rd) return;
        if (e.target.id === "rdNotes") rd.notes = e.target.value;
        if (e.target.id === "rdPage") {
          setPage(rd, e.target.value);
          return;
        }
        if (e.target.id === "rdPages") {
          setPagesCount(rd, e.target.value);
          return;
        }
        persist();
        return;
      }
      if (e.target.id === "revStart") {
        const next = e.target.value;
        if (!next || next >= EXAM) return;
        state.revisionStart = next;
        persist();
      }
    });

    $("sheet").addEventListener("input", (e) => {
      if ($("sheet").dataset.sheet === "pace") {
        refreshPacePreview();
        return;
      }
      const id = $("sheet").dataset.reading;
      if (!id) return;
      const rd = readingById(id);
      if (!rd) return;
      if (e.target.id === "rdNotes") rd.notes = e.target.value;
      if (e.target.id === "rdPage") {
        const pages = Number(rd.pages) || 0;
        const next = Math.max(0, Math.min(pages, Math.round(Number(e.target.value) || 0)));
        const pct = pages ? Math.round((100 * next) / pages) : 0;
        e.target.style.setProperty("--p", pct + "%");
        const lab = $("rdPageLab");
        if (lab) lab.textContent = pageStatus({ pages, page: next });
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/cfa/sw.js", { scope: "/cfa/" }).catch(() => {});
    }

    load().catch(() => {
      $("view-home").innerHTML = `<div class="empty">Could not load</div>`;
    });
  </script>
</body>
</html>

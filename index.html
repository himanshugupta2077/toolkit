<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Toolkit</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #141b24;
      --surface2: #1c2633;
      --border: #2a3648;
      --text: #e8eef6;
      --muted: #7f8fa6;
      --accent: #3d8bfd;
      --accent-dim: #2563b8;
      --danger: #f07178;
      --ok: #7fd962;
      --warning: #e6b450;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --glow: rgba(61, 139, 253, 0.35);
      --glow-rec: rgba(240, 113, 120, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 18%, rgba(61, 139, 253, 0.08), transparent 55%),
        radial-gradient(ellipse 60% 40% at 50% 70%, rgba(240, 113, 120, 0.04), transparent 50%);
      z-index: 0;
    }

    header, main { position: relative; z-index: 1; }

    header {
      padding: 18px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 42px;
    }

    .header-actions:empty { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px 3px var(--glow);
      animation: live-glow 2.4s ease-in-out infinite;
    }

    body.is-recording .brand-dot {
      background: var(--danger);
      box-shadow: 0 0 14px 4px var(--glow-rec);
      animation: live-glow-rec 1.2s ease-in-out infinite;
    }

    body.is-paused .brand-dot {
      background: var(--warning);
      box-shadow: 0 0 10px 2px rgba(230, 180, 80, 0.4);
      animation: none;
    }

    @keyframes live-glow {
      0%, 100% { box-shadow: 0 0 8px 2px rgba(61, 139, 253, 0.25); opacity: 0.85; }
      50% { box-shadow: 0 0 16px 5px rgba(61, 139, 253, 0.5); opacity: 1; }
    }

    @keyframes live-glow-rec {
      0%, 100% { box-shadow: 0 0 8px 2px rgba(240, 113, 120, 0.3); }
      50% { box-shadow: 0 0 18px 6px rgba(240, 113, 120, 0.55); }
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .icon-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .icon-btn:active { transform: scale(0.96); }
    .icon-btn.hidden { display: none; }

    .icon-btn.danger {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.35);
      background: rgba(240, 113, 120, 0.08);
    }

    .icon-btn.mic {
      color: var(--ok);
      border-color: rgba(127, 217, 98, 0.4);
      background: rgba(127, 217, 98, 0.1);
      font-size: 1.2rem;
    }

    .icon-btn.mic:active {
      background: rgba(127, 217, 98, 0.2);
    }

    .icon-btn.add {
      color: var(--accent);
      border-color: rgba(61, 139, 253, 0.45);
      background: rgba(61, 139, 253, 0.12);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1;
    }

    .icon-btn.add:active {
      background: rgba(61, 139, 253, 0.22);
    }

    .icon-btn.camera {
      color: var(--accent);
      border-color: rgba(61, 139, 253, 0.4);
      background: rgba(61, 139, 253, 0.1);
      font-size: 1.15rem;
    }

    .icon-btn.camera:active {
      background: rgba(61, 139, 253, 0.2);
    }

    .icon-btn.camera.recording {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.45);
      background: rgba(240, 113, 120, 0.12);
    }

    main {
      flex: 1;
      padding: 4px 18px calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .view { display: none; flex-direction: column; gap: 14px; flex: 1; }
    .view.active { display: flex; }

    .queue-banner {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 12px 12px 14px;
      gap: 10px;
      align-items: flex-start;
    }
    .queue-banner.show { display: flex; }
    .queue-banner.kind-halt {
      border-color: rgba(240, 113, 120, 0.55);
      background: rgba(240, 113, 120, 0.1);
    }
    .queue-banner.kind-rate_limit {
      border-color: rgba(230, 180, 80, 0.5);
      background: rgba(230, 180, 80, 0.1);
    }
    .queue-banner.kind-batch_finished {
      border-color: rgba(127, 217, 98, 0.45);
      background: rgba(127, 217, 98, 0.08);
    }
    .queue-banner-main {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .queue-banner-kicker {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .queue-banner-title {
      font-size: 0.95rem;
      font-weight: 650;
    }
    .queue-banner-msg {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .queue-banner-ack {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 1rem;
    }
    .queue-enable {
      appearance: none;
      border: 1px solid rgba(61, 139, 253, 0.45);
      background: rgba(61, 139, 253, 0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 650;
      cursor: pointer;
      align-self: center;
    }
    .queue-enable.hidden { display: none; }
    .queue-enable.on {
      border-color: rgba(127, 217, 98, 0.4);
      background: rgba(127, 217, 98, 0.1);
      color: var(--muted);
      font-weight: 500;
    }

    .queue-toast {
      display: none;
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      z-index: 90;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 14px;
      padding: 12px 14px;
      background: #1a2330;
      border: 1px solid rgba(240, 113, 120, 0.55);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      gap: 2px;
    }
    .queue-toast.show { display: flex; flex-direction: column; }
    .queue-toast.kind-rate_limit { border-color: rgba(230, 180, 80, 0.55); }
    .queue-toast.kind-batch_finished { border-color: rgba(127, 217, 98, 0.5); }
    .queue-toast-kicker {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .queue-toast-title { font-weight: 700; font-size: 0.95rem; }
    .queue-toast-msg { font-size: 0.82rem; color: var(--muted); white-space: pre-wrap; }

    /* Home — app launcher (symbol tiles only) */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 28px;
      padding: 0 8px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }

    .app-tile {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 22px;
      aspect-ratio: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      cursor: pointer;
      color: inherit;
      font: inherit;
      width: 100%;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
    }

    .app-tile:hover { border-color: var(--accent); background: var(--surface2); }
    .app-tile:active { transform: scale(0.97); }

    .app-tile[data-app="finance"]:hover {
      border-color: rgba(127, 217, 98, 0.55);
    }

    .app-tile[data-app="ai"]:hover {
      border-color: rgba(167, 139, 250, 0.55);
    }

    .app-tile[data-app="heart"]:hover {
      border-color: rgba(244, 114, 182, 0.55);
    }

    .app-tile[data-app="cfa"]:hover {
      border-color: rgba(176, 137, 46, 0.55);
    }

    .app-tile[data-app="food"]:hover {
      border-color: rgba(226, 168, 74, 0.55);
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      flex-shrink: 0;
      background: linear-gradient(145deg, rgba(61, 139, 253, 0.28), rgba(61, 139, 253, 0.08));
      border: 1px solid rgba(61, 139, 253, 0.35);
      box-shadow: 0 0 28px rgba(61, 139, 253, 0.16);
    }

    .app-icon.finance {
      background: linear-gradient(145deg, rgba(127, 217, 98, 0.3), rgba(127, 217, 98, 0.08));
      border-color: rgba(127, 217, 98, 0.4);
      box-shadow: 0 0 28px rgba(127, 217, 98, 0.16);
    }

    .app-icon.ai {
      background: linear-gradient(145deg, rgba(167, 139, 250, 0.32), rgba(167, 139, 250, 0.08));
      border-color: rgba(167, 139, 250, 0.42);
      box-shadow: 0 0 28px rgba(167, 139, 250, 0.16);
    }

    .app-icon.heart {
      background: linear-gradient(145deg, rgba(244, 114, 182, 0.34), rgba(244, 114, 182, 0.08));
      border-color: rgba(244, 114, 182, 0.45);
      box-shadow: 0 0 28px rgba(244, 114, 182, 0.18);
      color: #fb7185;
      -webkit-text-fill-color: #fb7185;
    }

    .app-icon.cfa {
      background: linear-gradient(145deg, rgba(176, 137, 46, 0.34), rgba(143, 42, 42, 0.1));
      border-color: rgba(176, 137, 46, 0.45);
      box-shadow: 0 0 28px rgba(176, 137, 46, 0.16);
      color: #e8d5a3;
      -webkit-text-fill-color: #e8d5a3;
    }

    .app-icon.food {
      background: linear-gradient(145deg, rgba(226, 168, 74, 0.36), rgba(196, 92, 62, 0.1));
      border-color: rgba(226, 168, 74, 0.45);
      box-shadow: 0 0 28px rgba(226, 168, 74, 0.16);
      color: #f3d39a;
      -webkit-text-fill-color: #f3d39a;
    }

    /* Heart module — locked countdown + unlock */
    #view-heart {
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      gap: 18px;
      position: relative;
    }

    .heart-locked,
    .heart-unlocked {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .heart-locked.hidden,
    .heart-unlocked.hidden {
      display: none;
    }

    .heart-pulse-btn.hidden,
    .heart-countdown.hidden {
      display: none;
    }

    .heart-pulse-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      font-size: 4.2rem;
      color: #fb7185;
      -webkit-text-fill-color: #fb7185;
      filter: drop-shadow(0 0 22px rgba(251, 113, 133, 0.55));
      animation: heart-pulse 1.6s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .heart-pulse-btn:active {
      transform: scale(0.94);
      animation-play-state: paused;
    }

    @keyframes heart-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(251, 113, 133, 0.4)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 28px rgba(251, 113, 133, 0.65)); }
    }

    .heart-lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(244, 114, 182, 0.95);
      background: rgba(244, 114, 182, 0.1);
      border: 1px solid rgba(244, 114, 182, 0.28);
    }

    .heart-countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 360px;
    }

    .heart-cd-cell {
      appearance: none;
      border: 1px solid rgba(244, 114, 182, 0.22);
      background: var(--surface);
      border-radius: 14px;
      padding: 12px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }

    .heart-cd-cell:active {
      transform: scale(0.96);
      background: var(--surface2);
    }

    .heart-cd-num {
      font-size: 1.45rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: #f9a8d4;
      min-height: 1.5em;
    }

    .heart-cd-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .heart-date-line {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .heart-date-line strong {
      color: #f9a8d4;
      font-weight: 600;
    }

    /* Heart browser — unlocked catalog UI (mobile-first) */
    #view-heart.browser-mode {
      align-items: stretch;
      padding-top: 0;
      gap: 0;
    }

    .heart-unlocked {
      align-items: stretch;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    .hb {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    .hb-level {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .hb-level.hidden { display: none; }

    .hb-stats {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .hb-stats-count {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: #f9a8d4;
    }

    .hb-stats-label {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .hb-search-wrap {
      position: relative;
    }

    .hb-search {
      width: 100%;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px 12px 40px;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .hb-search:focus {
      border-color: rgba(244, 114, 182, 0.45);
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.12);
    }

    .hb-search::placeholder { color: var(--muted); }

    .hb-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .hb-cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 8px;
    }

    .hb-cat {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 16px;
      padding: 14px 14px 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .hb-cat:active {
      transform: scale(0.985);
      background: var(--surface2);
    }

    .hb-cat-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      background: rgba(244, 114, 182, 0.1);
      border: 1px solid rgba(244, 114, 182, 0.22);
    }

    .hb-cat-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hb-cat-name {
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.015em;
      text-transform: capitalize;
    }

    .hb-cat-sub {
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hb-cat-count {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.95rem;
      color: #f9a8d4;
      flex-shrink: 0;
      min-width: 1.6em;
      text-align: right;
    }

    .hb-cat-chev {
      color: var(--muted);
      font-size: 1.1rem;
      flex-shrink: 0;
      opacity: 0.65;
    }

    .hb-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hb-tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 4px;
      margin: 0 -2px;
      padding-left: 2px;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .hb-tags::-webkit-scrollbar { display: none; }

    .hb-tag {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      scroll-snap-align: start;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
    }

    .hb-tag.active {
      color: #fce7f3;
      border-color: rgba(244, 114, 182, 0.5);
      background: rgba(244, 114, 182, 0.18);
    }

    .hb-tag:active { transform: scale(0.97); }

    .hb-filter-meta {
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      padding: 0 2px;
    }

    .hb-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-bottom: 12px;
    }

    .hb-card {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      padding: 0;
      display: flex;
      flex-direction: column;
      text-align: left;
      color: inherit;
      font: inherit;
      cursor: pointer;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .hb-card:active {
      transform: scale(0.98);
      border-color: rgba(244, 114, 182, 0.4);
    }

    .hb-card-media {
      position: relative;
      aspect-ratio: 1;
      background: #0a0e14;
      overflow: hidden;
    }

    .hb-card-media img,
    .hb-card-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0e14;
    }

    .hb-card-ph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 1.4rem;
      opacity: 0.55;
    }

    .hb-card-badges {
      position: absolute;
      top: 7px;
      right: 7px;
      display: flex;
      gap: 4px;
    }

    .hb-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(8, 12, 18, 0.72);
      color: #f3f4f6;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .hb-card-body {
      padding: 9px 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 52px;
    }

    .hb-card-title {
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hb-card-sub {
      color: var(--muted);
      font-size: 0.68rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hb-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 36px 16px;
      line-height: 1.45;
    }

    .hb-detail {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 20px;
    }

    .hb-detail-hero {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0a0e14;
      aspect-ratio: 4 / 5;
      max-height: 48vh;
    }

    .hb-detail-hero img,
    .hb-detail-hero video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hb-detail-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .hb-detail-summary {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .hb-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .hb-chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(244, 114, 182, 0.28);
      background: rgba(244, 114, 182, 0.1);
      color: #fbcfe8;
    }

    .hb-chip.muted {
      border-color: var(--border);
      background: var(--surface);
      color: var(--muted);
    }

    .hb-meta-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hb-meta-row {
      display: flex;
      gap: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .hb-meta-k {
      color: var(--muted);
      flex-shrink: 0;
      min-width: 72px;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-top: 1px;
    }

    .hb-meta-v {
      min-width: 0;
      word-break: break-word;
    }

    .hb-view-media {
      appearance: none;
      width: 100%;
      border: 1px solid rgba(244, 114, 182, 0.45);
      background: linear-gradient(145deg, rgba(244, 114, 182, 0.22), rgba(244, 114, 182, 0.1));
      color: #fce7f3;
      border-radius: 14px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 650;
      font-size: 0.95rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hb-view-media:active { transform: scale(0.985); }

    /* Fullscreen media viewer */
    .hb-media-viewer {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #05070a;
      display: flex;
      flex-direction: column;
      color: #f3f4f6;
    }

    .hb-media-viewer.hidden { display: none; }

    .hb-media-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px calc(8px + env(safe-area-inset-top, 0px));
      padding-top: max(12px, env(safe-area-inset-top, 0px));
      flex-shrink: 0;
    }

    .hb-media-close,
    .hb-media-nav {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #f3f4f6;
      border-radius: 12px;
      width: 42px;
      height: 42px;
      font-size: 1.15rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .hb-media-close:active,
    .hb-media-nav:active { background: rgba(255, 255, 255, 0.12); }

    .hb-media-nav:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .hb-media-counter {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      color: rgba(243, 244, 246, 0.7);
      font-weight: 600;
    }

    .hb-media-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px 16px;
      position: relative;
    }

    .hb-media-stage img,
    .hb-media-stage video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      background: #000;
    }

    .hb-media-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 8px 16px calc(16px + var(--safe-bottom));
      flex-shrink: 0;
    }

    .heart-pass-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(16px + var(--safe-bottom));
      background: rgba(5, 8, 12, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .heart-pass-overlay.hidden { display: none; }

    .heart-pass-sheet {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 20px;
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    .heart-pass-title {
      font-size: 1.05rem;
      font-weight: 650;
    }

    .heart-pass-hint {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: -4px;
    }

    .heart-pass-input {
      width: 100%;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .heart-pass-input:focus {
      border-color: rgba(244, 114, 182, 0.55);
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.15);
    }

    .heart-pass-err {
      color: var(--danger);
      font-size: 0.82rem;
      min-height: 1.2em;
    }

    .heart-pass-actions {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }

    .heart-pass-actions .btn {
      flex: 1;
    }

    .btn-heart {
      appearance: none;
      border: 1px solid rgba(244, 114, 182, 0.45);
      background: rgba(244, 114, 182, 0.16);
      color: #fbcfe8;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-heart:active { transform: scale(0.98); }

    .btn-ghost {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost:active { transform: scale(0.98); }

    /* AI usage log */
    .ai-cost {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .ai-cost-value {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .ai-cost-meta {
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .ai-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ai-row.fail {
      border-color: rgba(240, 113, 120, 0.35);
    }

    .ai-row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .ai-row-title {
      font-size: 0.92rem;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-row-cost {
      font-size: 0.88rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      color: var(--ok);
      flex-shrink: 0;
    }

    .ai-row.fail .ai-row-cost { color: var(--danger); }

    .ai-row-sub {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .ai-row-sub span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-meta,
    .app-chevron {
      display: none;
    }

    /* Finance form — compact; do not flex-grow (avoids Add button stretch) */
    .finance-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 0 0 auto;
      width: 100%;
    }

    #view-finance {
      justify-content: flex-start;
    }

    #view-finance.form-mode .finance-dash { display: none; }
    #view-finance.form-mode .finance-form-panel { display: flex; }
    #view-finance.form-mode .finance-tx-panel { display: none; }
    #view-finance.form-mode .finance-receipt-panel { display: none; }
    #view-finance.form-mode .finance-voice-panel { display: none; }
    #view-finance.tx-mode .finance-dash { display: none; }
    #view-finance.tx-mode .finance-form-panel { display: none; }
    #view-finance.tx-mode .finance-tx-panel { display: flex; }
    #view-finance.tx-mode .finance-receipt-panel { display: none; }
    #view-finance.tx-mode .finance-voice-panel { display: none; }
    #view-finance.receipt-mode .finance-dash { display: none; }
    #view-finance.receipt-mode .finance-form-panel { display: none; }
    #view-finance.receipt-mode .finance-tx-panel { display: none; }
    #view-finance.receipt-mode .finance-receipt-panel { display: flex; }
    #view-finance.receipt-mode .finance-voice-panel { display: none; }
    #view-finance.voice-mode .finance-dash { display: none; }
    #view-finance.voice-mode .finance-form-panel { display: none; }
    #view-finance.voice-mode .finance-tx-panel { display: none; }
    #view-finance.voice-mode .finance-receipt-panel { display: none; }
    #view-finance.voice-mode .finance-voice-panel { display: flex; }
    #view-finance:not(.form-mode) .finance-form-panel { display: none; }
    #view-finance:not(.tx-mode) .finance-tx-panel { display: none; }
    #view-finance:not(.receipt-mode) .finance-receipt-panel { display: none; }
    #view-finance:not(.voice-mode) .finance-voice-panel { display: none; }

    .finance-receipt-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      flex: 0 0 auto;
    }

    .fr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fr-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .fr-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fr-thumb .fr-rm {
      appearance: none;
      position: absolute;
      top: 5px;
      right: 5px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.95rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .fr-add {
      appearance: none;
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px dashed var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 1.8rem;
      font-weight: 300;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .fr-add:active {
      background: var(--surface2);
      color: var(--text);
    }

    .fr-add.cam {
      font-size: 1.35rem;
    }

    .fr-note-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .fr-note-row textarea.field {
      flex: 1;
      min-height: 88px;
      resize: vertical;
      line-height: 1.35;
    }

    .fr-note-side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .fr-note-side .icon-btn {
      width: 46px;
      height: 46px;
    }

    .fr-voice-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px 2px rgba(127, 217, 98, 0.45);
      margin: 0 auto;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .fr-voice-dot.on { opacity: 1; }

    .fr-status {
      min-height: 1.3em;
      font-size: 0.9rem;
      text-align: center;
      color: var(--muted);
    }

    .fr-status.ok { color: var(--ok); }
    .fr-status.err { color: var(--danger); }
    .fr-status.warn { color: var(--warning); }

    .fr-send {
      width: 100%;
      height: 52px;
      min-height: 52px;
      font-size: 1.05rem;
    }

    .finance-dash {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    #financeDashBody {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .finance-form-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .finance-tx-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .fd-tx-btn {
      appearance: none;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .fd-tx-btn:hover {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .fd-tx-btn:active { transform: scale(0.99); }

    .fd-tx-btn strong {
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .fd-tx-btn .fd-tx-chevron {
      color: var(--muted);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .ftx-nav {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
    }

    .ftx-nav-btn {
      appearance: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .ftx-nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .ftx-nav-btn:active:not(:disabled) { transform: scale(0.96); }
    .ftx-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .ftx-nav-center {
      text-align: center;
      min-width: 0;
      padding: 0 4px;
    }

    .ftx-nav-label {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .ftx-nav-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .ftx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .ftx-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ftx-card:hover { border-color: rgba(61, 139, 253, 0.45); }

    .ftx-card.ftx-new {
      border-color: rgba(127, 217, 98, 0.55);
      box-shadow: 0 0 0 1px rgba(127, 217, 98, 0.22),
        0 8px 24px rgba(127, 217, 98, 0.12);
    }

    .ftx-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .ftx-amount {
      font-size: 1.18rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .ftx-amount.income { color: var(--ok); }
    .ftx-amount.expense { color: var(--text); }
    .ftx-amount.transfer { color: var(--accent); }
    .ftx-amount.refund { color: var(--ok); }
    .ftx-amount.other { color: var(--muted); }

    .ftx-top-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
      max-width: 62%;
    }

    .ftx-type {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 9px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ftx-type.expense { color: var(--danger); border-color: rgba(240, 113, 120, 0.3); background: rgba(240, 113, 120, 0.08); }
    .ftx-type.income { color: var(--ok); border-color: rgba(127, 217, 98, 0.3); background: rgba(127, 217, 98, 0.1); }
    .ftx-type.transfer { color: var(--accent); border-color: rgba(61, 139, 253, 0.3); background: rgba(61, 139, 253, 0.1); }
    .ftx-type.refund { color: var(--ok); border-color: rgba(127, 217, 98, 0.3); background: rgba(127, 217, 98, 0.1); }
    .ftx-type.investment { color: var(--warning); border-color: rgba(230, 180, 80, 0.35); background: rgba(230, 180, 80, 0.1); }
    .ftx-type.adjustment { color: var(--muted); }

    .ftx-budget {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ok);
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(127, 217, 98, 0.3);
      background: rgba(127, 217, 98, 0.08);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ftx-category {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
      min-width: 0;
      word-break: break-word;
    }

    .ftx-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      color: var(--muted);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .ftx-meta .sep {
      opacity: 0.45;
    }

    .ftx-route {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      font-weight: 550;
      line-height: 1.3;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .ftx-route .from { color: var(--ok); min-width: 0; word-break: break-word; }
    .ftx-route .arrow { color: var(--muted); flex-shrink: 0; }
    .ftx-route .to { color: var(--accent); min-width: 0; word-break: break-word; }

    .ftx-bottom {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: -2px;
    }

    .ftx-notes {
      flex: 1;
      min-width: 0;
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      padding-top: 8px;
    }

    .ftx-notes:empty {
      display: none;
    }

    .ftx-icon-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .ftx-icon-btn {
      appearance: none;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .ftx-icon-btn svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    .ftx-icon-btn.edit:hover {
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
      border-color: rgba(61, 139, 253, 0.25);
    }

    .ftx-icon-btn.delete:hover {
      color: var(--danger);
      background: rgba(240, 113, 120, 0.12);
      border-color: rgba(240, 113, 120, 0.25);
    }

    .ftx-icon-btn:active { transform: scale(0.94); }
    .ftx-icon-btn:disabled { opacity: 0.4; cursor: default; }

    .fin-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .fin-delete {
      width: 100%;
      height: 48px;
      min-height: 48px;
      font-size: 0.98rem;
    }

    .fin-datetime {
      display: none;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px;
    }

    #view-finance.edit-mode .fin-datetime {
      display: grid;
    }

    input[type="date"].field,
    input[type="time"].field {
      min-height: 48px;
      color-scheme: dark;
    }

    .fd-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fd-hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fd-month {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .fd-days {
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .fd-pace {
      align-self: flex-start;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
    }

    .fd-pace.ok {
      color: var(--ok);
      border-color: rgba(127, 217, 98, 0.35);
      background: rgba(127, 217, 98, 0.1);
    }

    .fd-pace.warn {
      color: var(--warning);
      border-color: rgba(230, 180, 80, 0.4);
      background: rgba(230, 180, 80, 0.1);
    }

    .fd-pace.danger {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.4);
      background: rgba(240, 113, 120, 0.1);
    }

    .fd-big-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .fd-metric {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 12px 10px;
      min-width: 0;
    }

    .fd-metric.wide {
      grid-column: 1 / -1;
    }

    .fd-metric .lbl {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .fd-metric .val {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .fd-metric .val.accent { color: var(--ok); }
    .fd-metric .val.warn { color: var(--warning); }
    .fd-metric .val.danger { color: var(--danger); }
    .fd-metric .val.soft { color: var(--accent); }

    .fd-sub {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fd-budget-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .fd-budget-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .fd-budget-head .lbl {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .fd-budget-head .val {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .fd-budget-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .fd-budget-split .piece {
      min-width: 0;
    }

    .fd-budget-split .piece .lbl {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .fd-budget-split .piece .val {
      font-size: 0.98rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .fd-progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(42, 54, 72, 0.85);
      overflow: hidden;
      position: relative;
    }

    .fd-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3d8bfd, #5ba3ff);
      min-width: 0;
      transition: width 0.35s ease;
    }

    .fd-progress-fill.warn {
      background: linear-gradient(90deg, #c9a03a, #e6b450);
    }

    .fd-progress-fill.danger {
      background: linear-gradient(90deg, #d45a62, #f07178);
    }

    .fd-progress-fill.ok {
      background: linear-gradient(90deg, #5fbf4a, #7fd962);
    }

    .fd-progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fd-chart {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fd-chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .fd-chart-title {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .fd-chart-seg {
      display: inline-flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      flex-shrink: 0;
      gap: 0;
    }

    .fd-chart-seg button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.2;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .fd-chart-seg button.active {
      background: rgba(61, 139, 253, 0.22);
      color: var(--text);
    }

    .fd-chart-seg button:active { transform: scale(0.98); }

    .finance-voice-panel {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .fv-recorder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 28px 8px 12px;
    }

    .fv-recorder .timer {
      font-size: 2.4rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .fv-recorder .status-line {
      min-height: 1.3em;
      font-size: 0.92rem;
      text-align: center;
      color: var(--muted);
    }

    .fv-recorder .status-line.ok { color: var(--ok); }
    .fv-recorder .status-line.err { color: var(--danger); }
    .fv-recorder .status-line.warn { color: var(--warning); }

    .fv-recorder .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-top: 4px;
    }

    .fv-recorder .action-row .btn {
      flex: 1;
      min-height: 48px;
    }

    .fv-recorder .progress-bar {
      width: 100%;
      max-width: 320px;
      height: 4px;
      border-radius: 999px;
      background: var(--surface2);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .fv-recorder .progress-bar.visible { opacity: 1; }

    .fv-recorder .progress-bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    .fd-bars {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .fd-bar-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .fd-bar-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .fd-bar-name {
      font-size: 0.86rem;
      font-weight: 550;
      line-height: 1.25;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fd-bar-amt {
      font-size: 0.86rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text);
    }

    .fd-bar-amt.credit {
      color: var(--ok);
    }

    .fd-bar-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(42, 54, 72, 0.75);
      overflow: hidden;
    }

    .fd-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(61, 139, 253, 0.75), #3d8bfd);
      min-width: 3px;
    }

    .fd-bar-fill.credit {
      background: linear-gradient(90deg, rgba(127, 217, 98, 0.55), #7fd962);
    }

    .fd-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 0;
      overflow: hidden;
    }

    .fd-card-title {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 16px 6px;
    }

    .fd-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid rgba(42, 54, 72, 0.55);
      font-variant-numeric: tabular-nums;
    }

    .fd-row:first-of-type { border-top: none; }

    .fd-row .k {
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 500;
      min-width: 0;
    }

    .fd-row .v {
      font-size: 0.98rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .fd-row.total .k,
    .fd-row.total .v {
      font-weight: 700;
    }

    .fd-row.total .v { color: var(--warning); }
    .fd-row.hl .v { color: var(--ok); font-size: 1.15rem; }
    .fd-row.hl-soft .v { color: var(--accent); font-size: 1.1rem; }

    .fd-forecast-wrap {
      overflow-x: auto;
      padding: 4px 10px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .fd-forecast {
      width: 100%;
      min-width: 300px;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
    }
    .fd-forecast th {
      text-align: right;
      color: var(--muted);
      font-weight: 650;
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 6px 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .fd-forecast th:first-child,
    .fd-forecast td:first-child {
      text-align: left;
    }
    .fd-forecast td {
      padding: 7px 6px;
      border-bottom: 1px solid rgba(42, 54, 72, 0.55);
      white-space: nowrap;
    }
    .fd-forecast tr.total td {
      font-weight: 700;
      border-bottom: none;
    }
    .fd-forecast .loan { font-weight: 650; color: var(--warning); }
    .fd-hint {
      padding: 0 16px 12px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .fd-status {
      min-height: 1.2em;
      font-size: 0.85rem;
      text-align: center;
      color: var(--muted);
    }

    .fd-status.ok { color: var(--ok); }
    .fd-status.err { color: var(--danger); }

    .fd-empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.92rem;
    }

    .fin-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .fin-field label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      padding-left: 2px;
    }

    .amount-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .amount-wrap .rupee {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-weight: 650;
      font-size: 1.15rem;
      pointer-events: none;
    }

    .amount-wrap .field {
      padding-left: 36px;
      font-size: 1.35rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .fin-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* From → To transfer card */
    .fin-route {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .fin-route .fin-field label {
      color: var(--ok);
      opacity: 0.9;
    }

    .fin-route .fin-field:last-child label {
      color: var(--accent);
    }

    .fin-route .field {
      background: var(--surface2);
      font-size: 0.92rem;
    }

    .fin-route-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 46px;
      margin-bottom: 1px;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 700;
      user-select: none;
      flex-shrink: 0;
    }

    /* Full-width budget toggle */
    .fin-budget-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    .fin-budget-row:active {
      background: var(--surface2);
    }

    .fin-budget-row .fin-budget-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .fin-budget-row .fin-budget-text strong {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .fin-budget-row .fin-budget-text span {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .fin-budget-row .switch {
      width: 50px;
      height: 30px;
    }

    .fin-budget-row .switch .slider::before {
      width: 22px;
      height: 22px;
    }

    .fin-budget-row .switch input:checked + .slider {
      background: rgba(127, 217, 98, 0.28);
      border-color: var(--ok);
    }

    .fin-budget-row .switch input:checked + .slider::before {
      transform: translateX(20px);
      background: var(--ok);
    }

    .fin-status {
      min-height: 1.3em;
      font-size: 0.9rem;
      text-align: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .fin-status.ok { color: var(--ok); }
    .fin-status.err { color: var(--danger); }

    .fin-send {
      width: 100%;
      margin-top: 2px;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      flex: 0 0 auto;
      font-size: 1.05rem;
    }

    .app-meta { flex: 1; min-width: 0; }

    .app-meta strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .app-chevron {
      color: var(--muted);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .section-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 2px 0;
    }

    .options-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .open-notes-btn {
      appearance: none;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .open-notes-btn:hover { border-color: var(--accent); background: var(--surface2); }
    .open-notes-btn:active { transform: scale(0.99); }

    .open-notes-btn .on-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .open-notes-btn .on-text { flex: 1; min-width: 0; }
    .open-notes-btn .on-text strong {
      display: block;
      font-size: 0.98rem;
      font-weight: 650;
      margin-bottom: 2px;
    }
    .open-notes-btn .on-text span {
      color: var(--muted);
      font-size: 0.82rem;
    }
    .open-notes-btn .on-chevron {
      color: var(--muted);
      font-size: 1.15rem;
    }

    .field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font: inherit;
      padding: 12px 14px;
    }

    .field:focus {
      outline: 2px solid rgba(61, 139, 253, 0.4);
      border-color: var(--accent);
    }

    .field::placeholder { color: var(--muted); }

    select.field {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 3px), calc(100% - 10px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 32px;
      background-color: var(--surface);
    }

    .toggle-mini {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      user-select: none;
      padding: 2px 2px;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .switch .slider {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .switch .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: var(--text);
      border-radius: 50%;
      transition: 0.15s ease;
    }

    .switch input:checked + .slider {
      background: rgba(61, 139, 253, 0.35);
      border-color: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
      background: var(--accent);
    }

    /* Recorder stage */
    .recorder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 8px 18px;
      text-align: center;
      min-height: 260px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 3rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-shadow: 0 0 40px rgba(61, 139, 253, 0.15);
    }

    body.is-recording .timer {
      text-shadow: 0 0 40px rgba(240, 113, 120, 0.25);
    }

    .status-line {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.3em;
    }

    .status-line.ok { color: var(--ok); }
    .status-line.warn { color: var(--warning); }
    .status-line.err { color: var(--danger); }

    .rec-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
    }

    .rec-glow {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61, 139, 253, 0.18), transparent 68%);
      filter: blur(2px);
      opacity: 0.7;
      transition: opacity 0.2s ease, background 0.2s ease;
      animation: ambient 3s ease-in-out infinite;
    }

    body.is-recording .rec-glow {
      background: radial-gradient(circle, rgba(240, 113, 120, 0.28), transparent 68%);
      opacity: 1;
      animation: ambient-rec 1.4s ease-in-out infinite;
    }

    body.is-paused .rec-glow {
      background: radial-gradient(circle, rgba(230, 180, 80, 0.22), transparent 68%);
      animation: none;
      opacity: 0.85;
    }

    @keyframes ambient {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    @keyframes ambient-rec {
      0%, 100% { transform: scale(0.98); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .rec-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface2);
      color: var(--danger);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 1;
    }

    .rec-btn:active { transform: scale(0.96); }
    .rec-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .rec-btn .dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 16px rgba(240, 113, 120, 0.45);
      transition: border-radius 0.15s ease, width 0.15s ease, height 0.15s ease;
    }

    .rec-btn.recording {
      border-color: var(--danger);
      box-shadow: 0 0 0 6px rgba(240, 113, 120, 0.12);
    }

    .rec-btn.recording .dot {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }

    .rec-btn.paused {
      border-color: var(--warning);
    }

    .level {
      width: min(220px, 65vw);
      height: 5px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
    }

    .level > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #6eb0ff);
      border-radius: inherit;
      transition: width 0.08s linear;
      box-shadow: 0 0 8px rgba(61, 139, 253, 0.4);
    }

    body.is-recording .level > i {
      background: linear-gradient(90deg, var(--danger), #ff9aa0);
      box-shadow: 0 0 8px rgba(240, 113, 120, 0.4);
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 340px;
      justify-content: center;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      flex: 1;
      min-width: 90px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 20px rgba(61, 139, 253, 0.25);
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-dim); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-soft {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(240, 113, 120, 0.12);
      color: var(--danger);
      border: 1px solid rgba(240, 113, 120, 0.3);
    }

    .drafts-pill {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      background: rgba(61, 139, 253, 0.08);
      border: 1px solid rgba(61, 139, 253, 0.22);
      border-radius: 999px;
      padding: 6px 14px;
    }

    .drafts-pill.visible { display: inline-flex; }

    .drafts-pill strong {
      color: var(--accent);
      font-weight: 650;
    }

    .progress-bar {
      width: 100%;
      max-width: 340px;
      height: 6px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.visible { display: block; }

    .progress-bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
      box-shadow: 0 0 10px rgba(61, 139, 253, 0.5);
    }

    /* Notes list */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .note-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      flex: 1;
      min-width: 0;
    }

    .note-item:hover { border-color: var(--accent); }

    .note-item .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 6px;
    }

    .note-item .preview {
      font-size: 0.92rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }

    .note-del {
      appearance: none;
      width: 48px;
      flex-shrink: 0;
      border: 1px solid rgba(240, 113, 120, 0.28);
      background: rgba(240, 113, 120, 0.08);
      color: var(--danger);
      border-radius: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      padding: 0;
    }

    .note-del:hover {
      background: rgba(240, 113, 120, 0.18);
      border-color: rgba(240, 113, 120, 0.5);
    }

    .note-del:active { transform: scale(0.96); }
    .note-del:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 12px;
    }

    .transcript {
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 650;
    }

    .title-edit {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title-edit-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .title-edit-row .field {
      flex: 1;
      min-width: 0;
    }

    .title-edit-row .btn {
      flex: 0 0 auto;
      min-width: 72px;
      padding-left: 14px;
      padding-right: 14px;
    }

    .title-save-status {
      min-height: 1.1em;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .title-save-status.ok { color: var(--ok); }
    .title-save-status.err { color: var(--danger); }

    .muted { color: var(--muted); font-size: 0.88rem; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-row .btn { flex: 1; min-width: 120px; }

    .settings-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label.block-label {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-row strong {
      font-size: 0.92rem;
      font-weight: 600;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    audio { width: 100%; }
  </style>
</head>
<body>
  <div id="queueToast" class="queue-toast" hidden>
    <span class="queue-toast-kicker" id="queueToastKicker">Queue</span>
    <span class="queue-toast-title" id="queueToastTitle"></span>
    <span class="queue-toast-msg" id="queueToastMsg"></span>
  </div>
  <header>
    <div class="brand">
      <button type="button" class="icon-btn hidden" id="backBtn" title="Back" aria-label="Back">←</button>
      <span class="brand-dot" id="brandDot" aria-hidden="true"></span>
      <h1 id="headerTitle">Toolkit</h1>
    </div>
    <div class="header-actions" id="headerActions">
      <button
        type="button"
        class="icon-btn add hidden"
        id="financeAddBtn"
        title="Add ledger entry"
        aria-label="Add ledger entry"
      >+</button>
      <button
        type="button"
        class="icon-btn camera hidden"
        id="financeCamBtn"
        title="Receipt photo"
        aria-label="Receipt photo"
      >📷</button>
      <button
        type="button"
        class="icon-btn mic hidden"
        id="financeMicBtn"
        title="Voice entry"
        aria-label="Voice entry"
      >🎙</button>
    </div>
  </header>

  <main>
    <!-- HOME — app launcher (default) -->
    <section id="view-home" class="view active">
      <div id="queueBanner" class="queue-banner" hidden>
        <button type="button" class="queue-banner-main" id="queueBannerMain">
          <span class="queue-banner-kicker" id="queueBannerKicker">Queue</span>
          <span class="queue-banner-title" id="queueBannerTitle"></span>
          <span class="queue-banner-msg" id="queueBannerMsg"></span>
        </button>
        <button type="button" class="queue-banner-ack" id="queueBannerAck" aria-label="Dismiss">✕</button>
      </div>
      <div class="app-grid">
        <button type="button" class="app-tile" id="openAudioNotes" data-app="audio-notes" title="Audio Notes" aria-label="Audio Notes">
          <span class="app-icon" aria-hidden="true">🎙</span>
        </button>
        <button type="button" class="app-tile" id="openFinance" data-app="finance" title="Finance" aria-label="Finance">
          <span class="app-icon finance" aria-hidden="true">₹</span>
        </button>
        <button type="button" class="app-tile" id="openAi" data-app="ai" title="AI" aria-label="AI">
          <span class="app-icon ai" aria-hidden="true">🤖</span>
        </button>
        <button type="button" class="app-tile" id="openHeart" data-app="heart" title="Heart" aria-label="Heart">
          <span class="app-icon heart" aria-hidden="true">❤️</span>
        </button>
        <button type="button" class="app-tile" id="openCfa" data-app="cfa" title="CFA" aria-label="CFA">
          <span class="app-icon cfa" aria-hidden="true">📖</span>
        </button>
        <button type="button" class="app-tile" id="openFood" data-app="food" title="Food" aria-label="Food">
          <span class="app-icon food" aria-hidden="true">🍛</span>
        </button>
      </div>
    </section>

    <!-- HEART (locked until 11 Sep 2026; early unlock via secret sequence + passcode) -->
    <section id="view-heart" class="view">
      <div id="heartLocked" class="heart-locked">
        <button
          type="button"
          class="heart-pulse-btn"
          id="heartPulse"
          data-seq="heart"
          title="Heart"
          aria-label="Heart"
        >❤️</button>
        <div class="heart-countdown" id="heartCountdown" role="timer" aria-live="polite" aria-atomic="true">
          <button type="button" class="heart-cd-cell" data-seq="days" aria-label="Days remaining">
            <span class="heart-cd-num" id="heartDays">—</span>
            <span class="heart-cd-label">Days</span>
          </button>
          <button type="button" class="heart-cd-cell" data-seq="hours" aria-label="Hours remaining">
            <span class="heart-cd-num" id="heartHours">—</span>
            <span class="heart-cd-label">Hours</span>
          </button>
          <button type="button" class="heart-cd-cell" data-seq="minutes" aria-label="Minutes remaining">
            <span class="heart-cd-num" id="heartMinutes">—</span>
            <span class="heart-cd-label">Mins</span>
          </button>
          <button type="button" class="heart-cd-cell" data-seq="seconds" aria-label="Seconds remaining">
            <span class="heart-cd-num" id="heartSeconds">—</span>
            <span class="heart-cd-label">Secs</span>
          </button>
        </div>
      </div>

      <div id="heartUnlocked" class="heart-unlocked hidden">
        <div id="heartBrowser" class="hb">
          <!-- Categories -->
          <div id="hbLevelCats" class="hb-level">
            <div class="hb-stats">
              <div>
                <div class="hb-stats-count" id="hbStatsCount">—</div>
                <div class="hb-stats-label" id="hbStatsLabel">saved posts</div>
              </div>
            </div>
            <div class="hb-search-wrap">
              <span class="hb-search-icon" aria-hidden="true">⌕</span>
              <input
                type="search"
                class="hb-search"
                id="hbSearch"
                placeholder="Search titles, tags, places…"
                enterkeyhint="search"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
            </div>
            <div id="hbCatList" class="hb-cat-list" role="list"></div>
          </div>

          <!-- Posts in a category -->
          <div id="hbLevelPosts" class="hb-level hidden">
            <div class="hb-toolbar">
              <div id="hbTags" class="hb-tags" role="tablist" aria-label="Tags"></div>
              <div class="hb-filter-meta" id="hbFilterMeta"></div>
            </div>
            <div id="hbPostGrid" class="hb-grid" role="list"></div>
          </div>

          <!-- Post detail -->
          <div id="hbLevelDetail" class="hb-level hidden">
            <div id="hbDetail" class="hb-detail"></div>
          </div>
        </div>

        <!-- Fullscreen media -->
        <div id="hbMediaViewer" class="hb-media-viewer hidden" role="dialog" aria-modal="true" aria-label="Media viewer">
          <div class="hb-media-top">
            <button type="button" class="hb-media-close" id="hbMediaClose" aria-label="Close">✕</button>
            <div class="hb-media-counter" id="hbMediaCounter">1 / 1</div>
            <div style="width:42px" aria-hidden="true"></div>
          </div>
          <div class="hb-media-stage" id="hbMediaStage"></div>
          <div class="hb-media-bottom">
            <button type="button" class="hb-media-nav" id="hbMediaPrev" aria-label="Previous">‹</button>
            <button type="button" class="hb-media-nav" id="hbMediaNext" aria-label="Next">›</button>
          </div>
        </div>
      </div>

      <div id="heartPassOverlay" class="heart-pass-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="heartPassTitle">
        <div class="heart-pass-sheet">
          <div class="heart-pass-title" id="heartPassTitle">Enter passcode</div>
          <p class="heart-pass-hint">Early access</p>
          <input
            type="password"
            class="heart-pass-input"
            id="heartPassInput"
            inputmode="numeric"
            autocomplete="off"
            enterkeyhint="done"
            maxlength="24"
            placeholder="••••••"
            aria-label="Passcode"
          />
          <div class="heart-pass-err" id="heartPassErr" aria-live="polite"></div>
          <div class="heart-pass-actions">
            <button type="button" class="btn-ghost" id="heartPassCancel">Cancel</button>
            <button type="button" class="btn-heart" id="heartPassSubmit">Unlock</button>
          </div>
        </div>
      </div>
    </section>

    <!-- AI USAGE -->
    <section id="view-ai" class="view">
      <div class="ai-cost" id="aiCostBar">
        <div class="ai-cost-value" id="aiCostTotal">$0.00</div>
        <div class="ai-cost-meta" id="aiCostMeta">0 calls</div>
      </div>
      <div class="ai-list" id="aiCallList"></div>
    </section>

    <!-- FINANCE TRACKER -->
    <section id="view-finance" class="view">
      <div class="finance-dash" id="financeDash">
        <div class="fd-status" id="fdStatus" aria-live="polite"></div>
        <div id="financeDashBody">
          <div class="fd-empty">Loading…</div>
        </div>
      </div>

          <div class="ftx-nav-center">

          </div>
          <button type="button" class="ftx-nav-btn" id="financeTxNext" aria-label="Next month">›</button>

      <div class="finance-receipt-panel" id="financeReceiptPanel">

          id="frFileInput"
          accept="image/*"

          hidden
        />

        <input
          type="file"
          id="frCameraInput"
          accept="image/*"
          capture="environment"
          hidden
        />

              <input class="field" id="finTime" name="time" type="time" />

    <!-- AUDIO NOTES APP -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toolkit" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Toolkit</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #141b24;
      --surface2: #1c2633;
      --border: #2a3648;
      --text: #e8eef6;
      --muted: #7f8fa6;
      --accent: #3d8bfd;
      --accent-dim: #2563b8;
      --danger: #f07178;
      --ok: #7fd962;
      --warning: #e6b450;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --glow: rgba(61, 139, 253, 0.35);
      --glow-rec: rgba(240, 113, 120, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 18%, rgba(61, 139, 253, 0.08), transparent 55%),
        radial-gradient(ellipse 60% 40% at 50% 70%, rgba(240, 113, 120, 0.04), transparent 50%);
      z-index: 0;
    }

    header, main { position: relative; z-index: 1; }

    header {
      padding: 18px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 42px;
    }

    .header-actions:empty { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px 3px var(--glow);
      animation: live-glow 2.4s ease-in-out infinite;
    }

    body.is-recording .brand-dot {
      background: var(--danger);
      box-shadow: 0 0 14px 4px var(--glow-rec);
      animation: live-glow-rec 1.2s ease-in-out infinite;
    }

    body.is-paused .brand-dot {
      background: var(--warning);
      box-shadow: 0 0 10px 2px rgba(230, 180, 80, 0.4);
      animation: none;
    }

    @keyframes live-glow {
      0%, 100% { box-shadow: 0 0 8px 2px rgba(61, 139, 253, 0.25); opacity: 0.85; }
      50% { box-shadow: 0 0 16px 5px rgba(61, 139, 253, 0.5); opacity: 1; }
    }

    @keyframes live-glow-rec {
      0%, 100% { box-shadow: 0 0 8px 2px rgba(240, 113, 120, 0.3); }
      50% { box-shadow: 0 0 18px 6px rgba(240, 113, 120, 0.55); }
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .icon-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .icon-btn:active { transform: scale(0.96); }
    .icon-btn.hidden { display: none; }

    #detailSettingsBtn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #detailSettingsBtn.is-on {
      color: var(--accent);
      border-color: rgba(61, 139, 253, 0.5);
      background: rgba(61, 139, 253, 0.12);
    }

    .icon-btn.danger {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.35);
      background: rgba(240, 113, 120, 0.08);
    }

    .icon-btn.mic {
      color: var(--ok);
      border-color: rgba(127, 217, 98, 0.4);
      background: rgba(127, 217, 98, 0.1);
      font-size: 1.2rem;
    }

    .icon-btn.mic:active {
      background: rgba(127, 217, 98, 0.2);
    }

    .icon-btn.add {
      color: var(--accent);
      border-color: rgba(61, 139, 253, 0.45);
      background: rgba(61, 139, 253, 0.12);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1;
    }

    .icon-btn.add:active {
      background: rgba(61, 139, 253, 0.22);
    }

    .icon-btn.camera {
      color: var(--accent);
      border-color: rgba(61, 139, 253, 0.4);
      background: rgba(61, 139, 253, 0.1);
      font-size: 1.15rem;
    }

    .icon-btn.camera:active {
      background: rgba(61, 139, 253, 0.2);
    }

    .icon-btn.camera.recording {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.45);
      background: rgba(240, 113, 120, 0.12);
    }

    main {
      flex: 1;
      padding: 4px 18px calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .view { display: none; flex-direction: column; gap: 14px; flex: 1; }
    .view.active { display: flex; }

    .queue-banner {
      display: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 12px 12px 14px;
      gap: 10px;
      align-items: flex-start;
    }
    .queue-banner.show { display: flex; }
    .queue-banner.kind-halt {
      border-color: rgba(240, 113, 120, 0.55);
      background: rgba(240, 113, 120, 0.1);
    }
    .queue-banner.kind-rate_limit {
      border-color: rgba(230, 180, 80, 0.5);
      background: rgba(230, 180, 80, 0.1);
    }
    .queue-banner.kind-batch_finished {
      border-color: rgba(127, 217, 98, 0.45);
      background: rgba(127, 217, 98, 0.08);
    }
    .queue-banner-main {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .queue-banner-kicker {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .queue-banner-title {
      font-size: 0.95rem;
      font-weight: 650;
    }
    .queue-banner-msg {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: pre-wrap;
      line-height: 1.35;
    }
    .queue-banner-ack {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 1rem;
    }
    .queue-enable {
      appearance: none;
      border: 1px solid rgba(61, 139, 253, 0.45);
      background: rgba(61, 139, 253, 0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 650;
      cursor: pointer;
      align-self: center;
    }
    .queue-enable.hidden { display: none; }
    .queue-enable.on {
      border-color: rgba(127, 217, 98, 0.4);
      background: rgba(127, 217, 98, 0.1);
      color: var(--muted);
      font-weight: 500;
    }

    .queue-toast {
      display: none;
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      z-index: 90;
      max-width: 480px;
      margin: 0 auto;
      border-radius: 14px;
      padding: 12px 14px;
      background: #1a2330;
      border: 1px solid rgba(240, 113, 120, 0.55);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      gap: 2px;
    }
    .queue-toast.show { display: flex; flex-direction: column; }
    .queue-toast.kind-rate_limit { border-color: rgba(230, 180, 80, 0.55); }
    .queue-toast.kind-batch_finished { border-color: rgba(127, 217, 98, 0.5); }
    .queue-toast-kicker {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }
    .queue-toast-title { font-weight: 700; font-size: 0.95rem; }
    .queue-toast-msg { font-size: 0.82rem; color: var(--muted); white-space: pre-wrap; }

    /* Home — app launcher (symbol tiles only) */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 28px;
      padding: 0 8px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }

    .app-tile {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 22px;
      aspect-ratio: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-decoration: none;
      width: 100%;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
    }

    .app-tile:hover { border-color: var(--accent); background: var(--surface2); }
    .app-tile:active { transform: scale(0.97); }

    .app-tile[data-app="finance"]:hover {
      border-color: rgba(127, 217, 98, 0.55);
    }

    .app-tile[data-app="ai"]:hover {
      border-color: rgba(167, 139, 250, 0.55);
    }

    .app-tile[data-app="heart"]:hover {
      border-color: rgba(244, 114, 182, 0.55);
    }

    .app-tile[data-app="cfa"]:hover {
      border-color: rgba(176, 137, 46, 0.55);
    }

    .app-tile[data-app="food"]:hover {
      border-color: rgba(226, 168, 74, 0.55);
    }

    .app-tile[data-app="pact"]:hover {
      border-color: rgba(196, 92, 38, 0.55);
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      flex-shrink: 0;
      background: linear-gradient(145deg, rgba(61, 139, 253, 0.28), rgba(61, 139, 253, 0.08));
      border: 1px solid rgba(61, 139, 253, 0.35);
      box-shadow: 0 0 28px rgba(61, 139, 253, 0.16);
    }

    .app-icon.finance {
      background: linear-gradient(145deg, rgba(127, 217, 98, 0.3), rgba(127, 217, 98, 0.08));
      border-color: rgba(127, 217, 98, 0.4);
      box-shadow: 0 0 28px rgba(127, 217, 98, 0.16);
    }

    .app-icon.ai {
      background: linear-gradient(145deg, rgba(167, 139, 250, 0.32), rgba(167, 139, 250, 0.08));
      border-color: rgba(167, 139, 250, 0.42);
      box-shadow: 0 0 28px rgba(167, 139, 250, 0.16);
    }

    .app-icon.heart {
      background: linear-gradient(145deg, rgba(244, 114, 182, 0.34), rgba(244, 114, 182, 0.08));
      border-color: rgba(244, 114, 182, 0.45);
      box-shadow: 0 0 28px rgba(244, 114, 182, 0.18);
      color: #fb7185;
      -webkit-text-fill-color: #fb7185;
    }

    .app-icon.cfa {
      background: linear-gradient(145deg, rgba(176, 137, 46, 0.34), rgba(143, 42, 42, 0.1));
      border-color: rgba(176, 137, 46, 0.45);
      box-shadow: 0 0 28px rgba(176, 137, 46, 0.16);
      color: #e8d5a3;
      -webkit-text-fill-color: #e8d5a3;
    }

    .app-icon.food {
      background: linear-gradient(145deg, rgba(226, 168, 74, 0.36), rgba(196, 92, 62, 0.1));
      border-color: rgba(226, 168, 74, 0.45);
      box-shadow: 0 0 28px rgba(226, 168, 74, 0.16);
      color: #f3d39a;
      -webkit-text-fill-color: #f3d39a;
    }

    .app-icon.pact {
      background: linear-gradient(145deg, rgba(196, 92, 38, 0.36), rgba(196, 92, 38, 0.08));
      border-color: rgba(196, 92, 38, 0.45);
      box-shadow: 0 0 28px rgba(196, 92, 38, 0.16);
      color: #f4efe6;
      -webkit-text-fill-color: #f4efe6;
    }

    .app-meta,
    .app-chevron {
      display: none;
    }

    /* Finance form — compact; do not flex-grow (avoids Add button stretch) */
    .finance-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 0 0 auto;
      width: 100%;
    }

    #view-finance {
      justify-content: flex-start;
    }

    #view-finance.form-mode .finance-dash { display: none; }
    #view-finance.form-mode .finance-form-panel { display: flex; }
    #view-finance.form-mode .finance-tx-panel { display: none; }
    #view-finance.form-mode .finance-receipt-panel { display: none; }
    #view-finance.form-mode .finance-voice-panel { display: none; }
    #view-finance.tx-mode .finance-dash { display: none; }
    #view-finance.tx-mode .finance-form-panel { display: none; }
    #view-finance.tx-mode .finance-tx-panel { display: flex; }
    #view-finance.tx-mode .finance-receipt-panel { display: none; }
    #view-finance.tx-mode .finance-voice-panel { display: none; }
    #view-finance.receipt-mode .finance-dash { display: none; }
    #view-finance.receipt-mode .finance-form-panel { display: none; }
    #view-finance.receipt-mode .finance-tx-panel { display: none; }
    #view-finance.receipt-mode .finance-receipt-panel { display: flex; }
    #view-finance.receipt-mode .finance-voice-panel { display: none; }
    #view-finance.voice-mode .finance-dash { display: none; }
    #view-finance.voice-mode .finance-form-panel { display: none; }
    #view-finance.voice-mode .finance-tx-panel { display: none; }
    #view-finance.voice-mode .finance-receipt-panel { display: none; }
    #view-finance.voice-mode .finance-voice-panel { display: flex; }
    #view-finance:not(.form-mode) .finance-form-panel { display: none; }
    #view-finance:not(.tx-mode) .finance-tx-panel { display: none; }
    #view-finance:not(.receipt-mode) .finance-receipt-panel { display: none; }
    #view-finance:not(.voice-mode) .finance-voice-panel { display: none; }

    .finance-receipt-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      flex: 0 0 auto;
    }

    .fr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fr-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .fr-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fr-thumb .fr-rm {
      appearance: none;
      position: absolute;
      top: 5px;
      right: 5px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.95rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .fr-add {
      appearance: none;
      aspect-ratio: 1;
      border-radius: 14px;
      border: 1px dashed var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 1.8rem;
      font-weight: 300;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .fr-add:active {
      background: var(--surface2);
      color: var(--text);
    }

    .fr-add.cam {
      font-size: 1.35rem;
    }

    .fr-note-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .fr-note-row textarea.field {
      flex: 1;
      min-height: 88px;
      resize: vertical;
      line-height: 1.35;
    }

    .fr-note-side {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .fr-note-side .icon-btn {
      width: 46px;
      height: 46px;
    }

    .fr-voice-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px 2px rgba(127, 217, 98, 0.45);
      margin: 0 auto;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .fr-voice-dot.on { opacity: 1; }

    .fr-status {
      min-height: 1.3em;
      font-size: 0.9rem;
      text-align: center;
      color: var(--muted);
    }

    .fr-status.ok { color: var(--ok); }
    .fr-status.err { color: var(--danger); }
    .fr-status.warn { color: var(--warning); }

    .fr-send {
      width: 100%;
      height: 52px;
      min-height: 52px;
      font-size: 1.05rem;
    }

    .finance-dash {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    #financeDashBody {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .finance-form-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .finance-tx-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .fd-tx-btn {
      appearance: none;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .fd-tx-btn:hover {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .fd-tx-btn:active { transform: scale(0.99); }

    .fd-tx-btn strong {
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .fd-tx-btn .fd-tx-chevron {
      color: var(--muted);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .ftx-nav {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
    }

    .ftx-nav-btn {
      appearance: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .ftx-nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .ftx-nav-btn:active:not(:disabled) { transform: scale(0.96); }
    .ftx-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .ftx-nav-center {
      text-align: center;
      min-width: 0;
      padding: 0 4px;
    }

    .ftx-nav-label {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .ftx-nav-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .ftx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .ftx-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ftx-card:hover { border-color: rgba(61, 139, 253, 0.45); }

    .ftx-card.ftx-new {
      border-color: rgba(127, 217, 98, 0.55);
      box-shadow: 0 0 0 1px rgba(127, 217, 98, 0.22),
        0 8px 24px rgba(127, 217, 98, 0.12);
    }

    .ftx-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .ftx-amount {
      font-size: 1.18rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .ftx-amount.income { color: var(--ok); }
    .ftx-amount.expense { color: var(--text); }
    .ftx-amount.transfer { color: var(--accent); }
    .ftx-amount.refund { color: var(--ok); }
    .ftx-amount.other { color: var(--muted); }

    .ftx-top-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
      max-width: 62%;
    }

    .ftx-type {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 9px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ftx-type.expense { color: var(--danger); border-color: rgba(240, 113, 120, 0.3); background: rgba(240, 113, 120, 0.08); }
    .ftx-type.income { color: var(--ok); border-color: rgba(127, 217, 98, 0.3); background: rgba(127, 217, 98, 0.1); }
    .ftx-type.transfer { color: var(--accent); border-color: rgba(61, 139, 253, 0.3); background: rgba(61, 139, 253, 0.1); }
    .ftx-type.refund { color: var(--ok); border-color: rgba(127, 217, 98, 0.3); background: rgba(127, 217, 98, 0.1); }
    .ftx-type.investment { color: var(--warning); border-color: rgba(230, 180, 80, 0.35); background: rgba(230, 180, 80, 0.1); }
    .ftx-type.adjustment { color: var(--muted); }

    .ftx-budget {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ok);
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(127, 217, 98, 0.3);
      background: rgba(127, 217, 98, 0.08);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ftx-category {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
      min-width: 0;
      word-break: break-word;
    }

    .ftx-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      color: var(--muted);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .ftx-meta .sep {
      opacity: 0.45;
    }

    .ftx-route {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      font-weight: 550;
      line-height: 1.3;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .ftx-route .from { color: var(--ok); min-width: 0; word-break: break-word; }
    .ftx-route .arrow { color: var(--muted); flex-shrink: 0; }
    .ftx-route .to { color: var(--accent); min-width: 0; word-break: break-word; }

    .ftx-bottom {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: -2px;
    }

    .ftx-notes {
      flex: 1;
      min-width: 0;
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      padding-top: 8px;
    }

    .ftx-notes:empty {
      display: none;
    }

    .ftx-icon-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .ftx-icon-btn {
      appearance: none;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .ftx-icon-btn svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    .ftx-icon-btn.edit:hover {
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
      border-color: rgba(61, 139, 253, 0.25);
    }

    .ftx-icon-btn.delete:hover {
      color: var(--danger);
      background: rgba(240, 113, 120, 0.12);
      border-color: rgba(240, 113, 120, 0.25);
    }

    .ftx-icon-btn:active { transform: scale(0.94); }
    .ftx-icon-btn:disabled { opacity: 0.4; cursor: default; }

    .fin-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .fin-delete {
      width: 100%;
      height: 48px;
      min-height: 48px;
      font-size: 0.98rem;
    }

    .fin-datetime {
      display: none;
      grid-template-columns: 1.2fr 1fr;
      gap: 10px;
    }

    #view-finance.edit-mode .fin-datetime {
      display: grid;
    }

    input[type="date"].field,
    input[type="time"].field {
      min-height: 48px;
      color-scheme: dark;
    }

    .fd-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fd-hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fd-month {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .fd-days {
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .fd-pace {
      align-self: flex-start;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
    }

    .fd-pace.ok {
      color: var(--ok);
      border-color: rgba(127, 217, 98, 0.35);
      background: rgba(127, 217, 98, 0.1);
    }

    .fd-pace.warn {
      color: var(--warning);
      border-color: rgba(230, 180, 80, 0.4);
      background: rgba(230, 180, 80, 0.1);
    }

    .fd-pace.danger {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.4);
      background: rgba(240, 113, 120, 0.1);
    }

    .fd-big-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .fd-metric {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 12px 10px;
      min-width: 0;
    }

    .fd-metric.wide {
      grid-column: 1 / -1;
    }

    .fd-metric .lbl {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .fd-metric .val {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .fd-metric .val.accent { color: var(--ok); }
    .fd-metric .val.warn { color: var(--warning); }
    .fd-metric .val.danger { color: var(--danger); }
    .fd-metric .val.soft { color: var(--accent); }

    .fd-sub {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fd-budget-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .fd-budget-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .fd-budget-head .lbl {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .fd-budget-head .val {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .fd-budget-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .fd-budget-split .piece {
      min-width: 0;
    }

    .fd-budget-split .piece .lbl {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .fd-budget-split .piece .val {
      font-size: 0.98rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .fd-progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(42, 54, 72, 0.85);
      overflow: hidden;
      position: relative;
    }

    .fd-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3d8bfd, #5ba3ff);
      min-width: 0;
      transition: width 0.35s ease;
    }

    .fd-progress-fill.warn {
      background: linear-gradient(90deg, #c9a03a, #e6b450);
    }

    .fd-progress-fill.danger {
      background: linear-gradient(90deg, #d45a62, #f07178);
    }

    .fd-progress-fill.ok {
      background: linear-gradient(90deg, #5fbf4a, #7fd962);
    }

    .fd-progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .fd-chart {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fd-chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .fd-chart-title {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .fd-chart-seg {
      display: inline-flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      flex-shrink: 0;
      gap: 0;
    }

    .fd-chart-seg button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.2;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .fd-chart-seg button.active {
      background: rgba(61, 139, 253, 0.22);
      color: var(--text);
    }

    .fd-chart-seg button:active { transform: scale(0.98); }

    .finance-voice-panel {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .fv-recorder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 28px 8px 12px;
    }

    .fv-recorder .timer {
      font-size: 2.4rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .fv-recorder .status-line {
      min-height: 1.3em;
      font-size: 0.92rem;
      text-align: center;
      color: var(--muted);
    }

    .fv-recorder .status-line.ok { color: var(--ok); }
    .fv-recorder .status-line.err { color: var(--danger); }
    .fv-recorder .status-line.warn { color: var(--warning); }

    .fv-recorder .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-top: 4px;
    }

    .fv-recorder .action-row .btn {
      flex: 1;
      min-height: 48px;
    }

    .fv-recorder .progress-bar {
      width: 100%;
      max-width: 320px;
      height: 4px;
      border-radius: 999px;
      background: var(--surface2);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .fv-recorder .progress-bar.visible { opacity: 1; }

    .fv-recorder .progress-bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    .fd-bars {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .fd-bar-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .fd-bar-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .fd-bar-name {
      font-size: 0.86rem;
      font-weight: 550;
      line-height: 1.25;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fd-bar-amt {
      font-size: 0.86rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text);
    }

    .fd-bar-amt.credit {
      color: var(--ok);
    }

    .fd-bar-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(42, 54, 72, 0.75);
      overflow: hidden;
    }

    .fd-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(61, 139, 253, 0.75), #3d8bfd);
      min-width: 3px;
    }

    .fd-bar-fill.credit {
      background: linear-gradient(90deg, rgba(127, 217, 98, 0.55), #7fd962);
    }

    .fd-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 0;
      overflow: hidden;
    }

    .fd-card-title {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 16px 6px;
    }

    .fd-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid rgba(42, 54, 72, 0.55);
      font-variant-numeric: tabular-nums;
    }

    .fd-row:first-of-type { border-top: none; }

    .fd-row .k {
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 500;
      min-width: 0;
    }

    .fd-row .v {
      font-size: 0.98rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .fd-row.total .k,
    .fd-row.total .v {
      font-weight: 700;
    }

    .fd-row.total .v { color: var(--warning); }
    .fd-row.hl .v { color: var(--ok); font-size: 1.15rem; }
    .fd-row.hl-soft .v { color: var(--accent); font-size: 1.1rem; }

    .fd-forecast-wrap {
      overflow-x: auto;
      padding: 4px 10px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .fd-forecast {
      width: 100%;
      min-width: 300px;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
    }
    .fd-forecast th {
      text-align: right;
      color: var(--muted);
      font-weight: 650;
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 6px 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .fd-forecast th:first-child,
    .fd-forecast td:first-child {
      text-align: left;
    }
    .fd-forecast td {
      padding: 7px 6px;
      border-bottom: 1px solid rgba(42, 54, 72, 0.55);
      white-space: nowrap;
    }
    .fd-forecast tr.total td {
      font-weight: 700;
      border-bottom: none;
    }
    .fd-forecast .loan { font-weight: 650; color: var(--warning); }
    .fd-hint {
      padding: 0 16px 12px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .fd-status {
      min-height: 1.2em;
      font-size: 0.85rem;
      text-align: center;
      color: var(--muted);
    }

    .fd-status.ok { color: var(--ok); }
    .fd-status.err { color: var(--danger); }

    .fd-empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.92rem;
    }

    .fin-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .fin-field label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      padding-left: 2px;
    }

    .amount-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .amount-wrap .rupee {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-weight: 650;
      font-size: 1.15rem;
      pointer-events: none;
    }

    .amount-wrap .field {
      padding-left: 36px;
      font-size: 1.35rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .fin-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* From → To transfer card */
    .fin-route {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .fin-route .fin-field label {
      color: var(--ok);
      opacity: 0.9;
    }

    .fin-route .fin-field:last-child label {
      color: var(--accent);
    }

    .fin-route .field {
      background: var(--surface2);
      font-size: 0.92rem;
    }

    .fin-route-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 46px;
      margin-bottom: 1px;
      color: var(--muted);
      font-size: 1.15rem;
      font-weight: 700;
      user-select: none;
      flex-shrink: 0;
    }

    /* Full-width budget toggle */
    .fin-budget-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    .fin-budget-row:active {
      background: var(--surface2);
    }

    .fin-budget-row .fin-budget-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .fin-budget-row .fin-budget-text strong {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .fin-budget-row .fin-budget-text span {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .fin-budget-row .switch {
      width: 50px;
      height: 30px;
    }

    .fin-budget-row .switch .slider::before {
      width: 22px;
      height: 22px;
    }

    .fin-budget-row .switch input:checked + .slider {
      background: rgba(127, 217, 98, 0.28);
      border-color: var(--ok);
    }

    .fin-budget-row .switch input:checked + .slider::before {
      transform: translateX(20px);
      background: var(--ok);
    }

    .fin-status {
      min-height: 1.3em;
      font-size: 0.9rem;
      text-align: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .fin-status.ok { color: var(--ok); }
    .fin-status.err { color: var(--danger); }

    .fin-send {
      width: 100%;
      margin-top: 2px;
      height: 52px;
      min-height: 52px;
      max-height: 52px;
      flex: 0 0 auto;
      font-size: 1.05rem;
    }

    .app-meta { flex: 1; min-width: 0; }

    .app-meta strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .app-chevron {
      color: var(--muted);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .section-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 2px 0;
    }

    .options-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stt-seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .stt-opt {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 650;
      font-size: 0.92rem;
      padding: 10px 8px;
      border-radius: 9px;
      cursor: pointer;
    }

    .stt-opt.is-on {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--border);
    }

    .stt-opt:disabled {

      cursor: not-allowed;
    }

    .field[hidden],
    label[hidden],
    #detailModelWrap[hidden] {

    .open-notes-btn {

      width: 100%;

      border-radius: var(--radius);

      color: inherit;
      font: inherit;
      text-align: left;

    .open-notes-btn:hover { border-color: var(--accent); background: var(--surface2); }

    .open-notes-btn .on-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .open-notes-btn .on-text { flex: 1; min-width: 0; }

      display: block;
      font-size: 0.98rem;
      font-weight: 650;
    }
    .open-notes-btn .on-chevron {
      color: var(--muted);
      font-size: 1.15rem;
    }

    .field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font: inherit;
      padding: 12px 14px;
    }

    .field:focus {
      outline: 2px solid rgba(61, 139, 253, 0.4);
      border-color: var(--accent);
    }

    .field::placeholder { color: var(--muted); }

    select.field {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 3px), calc(100% - 10px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 32px;
      background-color: var(--surface);
    }

    .switch {
      position: relative;
      width: 46px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .switch .slider {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .switch .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: var(--text);
      border-radius: 50%;
      transition: 0.15s ease;
    }

    .switch input:checked + .slider {
      background: rgba(61, 139, 253, 0.35);
      border-color: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
      background: var(--accent);
    }

    /* Recorder stage */
    .recorder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 8px 18px;
      text-align: center;
      min-height: 260px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 3rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-shadow: 0 0 40px rgba(61, 139, 253, 0.15);
    }

    body.is-recording .timer {
      text-shadow: 0 0 40px rgba(240, 113, 120, 0.25);
    }

    .status-line {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.3em;
    }

    .status-line.ok { color: var(--ok); }
    .status-line.warn { color: var(--warning); }
    .status-line.err { color: var(--danger); }

    .rec-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
    }

    .rec-glow {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61, 139, 253, 0.18), transparent 68%);
      filter: blur(2px);
      opacity: 0.7;
      transition: opacity 0.2s ease, background 0.2s ease;
      animation: ambient 3s ease-in-out infinite;
    }

    body.is-recording .rec-glow {
      background: radial-gradient(circle, rgba(240, 113, 120, 0.28), transparent 68%);
      opacity: 1;
      animation: ambient-rec 1.4s ease-in-out infinite;
    }

    body.is-paused .rec-glow {
      background: radial-gradient(circle, rgba(230, 180, 80, 0.22), transparent 68%);
      animation: none;
      opacity: 0.85;
    }

    @keyframes ambient {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    @keyframes ambient-rec {
      0%, 100% { transform: scale(0.98); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .rec-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface2);
      color: var(--danger);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 1;
    }

    .rec-btn:active { transform: scale(0.96); }
    .rec-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .rec-btn .dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;

      box-shadow: 0 0 16px rgba(240, 113, 120, 0.45);

    }

    .rec-btn.recording {
      border-color: var(--danger);
      box-shadow: 0 0 0 6px rgba(240, 113, 120, 0.12);
    }

    .rec-btn.recording .dot {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }

    .rec-btn.paused {
      border-color: var(--warning);
    }

    .level {
      width: min(220px, 65vw);

      background: var(--surface2);

    .level > i {
      display: block;

      width: 0%;

      box-shadow: 0 0 8px rgba(61, 139, 253, 0.4);
    }

    body.is-recording .level > i {
      background: linear-gradient(90deg, var(--danger), #ff9aa0);
      box-shadow: 0 0 8px rgba(240, 113, 120, 0.4);
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 340px;
      justify-content: center;
    }

    .rec-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 340px;
    }

    .rec-split .btn {
      min-width: 0;
      width: 100%;
    }

    .rec-translate {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 46px;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      text-align: left;
      color: inherit;
      font: inherit;
    }

    .rec-translate strong {
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.25;
    }

    .rec-translate .switch {
      width: 42px;
      height: 26px;
    }

    .rec-translate .switch .slider::before {
      width: 18px;
      height: 18px;
    }

    .rec-translate .switch input:checked + .slider::before {
      transform: translateX(16px);
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      flex: 1;
      min-width: 90px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 20px rgba(61, 139, 253, 0.25);
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-dim); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-soft {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(240, 113, 120, 0.12);
      color: var(--danger);
      border: 1px solid rgba(240, 113, 120, 0.3);
    }

    .drafts-pill {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;

      border: 1px solid rgba(61, 139, 253, 0.22);
      border-radius: 999px;
      padding: 6px 14px;
    }

    .drafts-pill.visible { display: inline-flex; }

    .drafts-pill strong {
      color: var(--accent);
      font-weight: 650;
    }

    .progress-bar {
      width: 100%;
      max-width: 340px;
      height: 6px;
      background: var(--surface2);
      border-radius: 999px;

    }

    .progress-bar.visible { display: block; }

    .progress-bar > i {
      display: block;
      height: 100%;

      box-shadow: 0 0 10px rgba(61, 139, 253, 0.5);

    /* Notes list */
    .notes-list {
      display: flex;

    }

    .note-row {

    .note-item {

      text-align: left;

    .note-item .headline {
      font-size: 0.95rem;
      font-weight: 650;
      line-height: 1.35;

      flex-shrink: 0;
      gap: 2px;
      padding-right: 2px;

    .note-icon {

      height: 40px;
      flex-shrink: 0;
      border: 1px solid transparent;

      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;

    .note-icon svg {
      width: 17px;

      stroke-linejoin: round;

    .note-icon:hover {
      color: var(--text);

    .note-icon:active { transform: scale(0.96); }

    .note-copy.is-copied {

    .note-del {

    .note-del:hover {

    }

    .note-nav {

      flex-direction: column;
      gap: 8px;
    }

    .note-nav[hidden] { display: none !important; }

    .note-nav-pos {
      color: var(--muted);

      font-variant-numeric: tabular-nums;
      text-align: center;
      min-width: 3.2em;

    .note-nav-btns {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;

    .note-nav-btns .btn {

    .note-actions {

    .player {

      align-items: center;

      place-items: center;
      flex-shrink: 0;

      height: 18px;
      fill: currentColor;
    }

    .player-main {
      flex: 1;
      min-width: 0;
    }

    .player-seek {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: var(--surface2);
      outline: none;
      margin: 0;
    }

    .player-seek::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: transparent;
    }

    .player-seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--accent);
      border: 0;
      box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.22);

      height: 16px;
      border-radius: 50%;

    #detailAudio { display: none; }

</head>

  <script>
    /* ------------------------------------------------------------------ */
    /* Views                                                                */
    /* ------------------------------------------------------------------ */
    const views = {
      home: document.getElementById("view-home"),
      record: document.getElementById("view-record"),
      list: document.getElementById("view-list"),
      detail: document.getElementById("view-detail"),
      finance: document.getElementById("view-finance"),
    };

    /** Where back goes from list/detail */
    let listBackTarget = "record";
    /** After a new recording, Back on the transcript returns to /voice */
    let detailFromRecord = false;
    let currentNoteId = null;
    const TRASH_ICON =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';
    const COPY_ICON =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const PLAY_ICON =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    const PAUSE_ICON =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
    let notesCache = [];
    let playerKnown = 0;
    let playerSeeking = false;
    let playerGen = 0;
    /** Finance: dashboard (default) vs manual add/edit form vs month tx list */
    let financeFormOpen = false;
    let financeTxOpen = false;
    let financeReceiptOpen = false;
    let financeVoiceOpen = false;
    /** null = add mode; number = ledger sheet row being edited */
    let financeEditingRow = null;
    /** Return to tx list after closing form (edit flow) */
    let financeFormFromTx = false;
    /** Month shown in transactions list (null = current month) */
    let financeTxYear = null;
    let financeTxMonth = null;
    /** After AI/receipt save: highlight this Ledger row in the tx list */
    let financeHighlightRow = null;
    /** Cached txs for edit without extra fetch */
    let financeTxCache = [];
    /** Shared options from /api/finance/options (set in initFinance) */
    let financeOpts = null;
    /** Last dashboard payload (for chart Budget/Full switch) */
    let financeDashData = null;
    /** Category chart mode: budget | full */
    let financeChartMode =
      localStorage.getItem("fin_chart_mode") === "full" ? "full" : "budget";
    /** Receipt camera: selected image files + optional voice blob */
    let frImages = []; // { id, file, url }
    let frVoiceBlob = null;
    let frVoiceExt = "webm";
    let frRecording = false;
    let frMediaRecorder = null;
    let frMediaStream = null;
    let frRecordChunks = [];
    const FR_MAX_IMAGES = 8;

    /** Finance voice panel recorder state (isolated from Audio Notes) */
    let fvState = "idle"; // idle | recording | ready | sending
    let fvStream = null;
    let fvRecorder = null;
    let fvChunks = [];
    let fvBlob = null;
    let fvMime = "audio/webm";
    let fvStartedAt = 0;
    let fvElapsed = 0;
    let fvTimerInterval = 0;

    function financeHeaderTitle() {
      if (financeVoiceOpen) return "Voice";
      if (financeReceiptOpen) return "Receipt";
      if (financeFormOpen) {
        return financeEditingRow ? "Edit entry" : "Add entry";
      }
      if (financeTxOpen) return "Transactions";
      return "Finance";
    }

    function financeOnDashboard() {
      return (
        !financeFormOpen &&
        !financeTxOpen &&
        !financeReceiptOpen &&
        !financeVoiceOpen
      );
    }

    function syncFinanceChrome() {
      const fin = document.getElementById("view-finance");
      if (fin) {
        fin.classList.toggle("form-mode", financeFormOpen);
        fin.classList.toggle("edit-mode", financeFormOpen && !!financeEditingRow);
        fin.classList.toggle(
          "tx-mode",
          financeTxOpen &&
            !financeFormOpen &&
            !financeReceiptOpen &&
            !financeVoiceOpen
        );
        fin.classList.toggle("receipt-mode", financeReceiptOpen);
        fin.classList.toggle("voice-mode", financeVoiceOpen);
      }
      const onFinance =
        views.finance && views.finance.classList.contains("active");
      const onDash = onFinance && financeOnDashboard();
      const addBtn = document.getElementById("financeAddBtn");
      if (addBtn) {
        // + only on dashboard
        addBtn.classList.toggle("hidden", !onDash);
      }
      const camBtn = document.getElementById("financeCamBtn");
      if (camBtn) {
        // camera only on dashboard (with mic)
        camBtn.classList.toggle("hidden", !onDash);
      }
      const micBtn = document.getElementById("financeMicBtn");
      if (micBtn) {
        micBtn.classList.toggle("hidden", !onDash);
      }
      const delBtn = document.getElementById("finDelete");
      if (delBtn) {
        delBtn.classList.toggle("hidden", !financeFormOpen || !financeEditingRow);
      }
      const sendBtn = document.getElementById("finSend");
      if (sendBtn) {
        sendBtn.textContent = financeEditingRow ? "Save" : "Add";
      }
      if (onFinance) {
        document.getElementById("headerTitle").textContent = financeHeaderTitle();
      }
    }

    function setFinanceFormOpen(open, opts = {}) {
      financeFormOpen = !!open;
      if (financeFormOpen) {
        financeEditingRow =
          opts.editRow != null && opts.editRow !== ""
            ? Number(opts.editRow)
            : null;
        financeFormFromTx = !!opts.fromTx;
        // Keep tx list state when editing from list; clear only for fresh Add
        if (!financeFormFromTx) financeTxOpen = false;
        financeReceiptOpen = false;
        if (financeVoiceOpen) {
          resetFinanceVoice();
          financeVoiceOpen = false;
        }
        stopFrRecording(false);
      } else {
        financeEditingRow = null;
        financeFormFromTx = false;
      }
      syncFinanceChrome();
      if (financeFormOpen) {
        setTimeout(() => {
          const el = document.getElementById("finAmount");
          if (el) el.focus();
        }, 80);
      }
    }

    function setFinanceTxOpen(open) {
      financeTxOpen = !!open;
      if (financeTxOpen) {
        financeFormOpen = false;
        financeReceiptOpen = false;
        if (financeVoiceOpen) {
          resetFinanceVoice();
          financeVoiceOpen = false;
        }
        financeEditingRow = null;
        financeFormFromTx = false;
        stopFrRecording(false);
        if (financeTxYear == null || financeTxMonth == null) {
          const now = new Date();
          financeTxYear = now.getFullYear();
          financeTxMonth = now.getMonth() + 1;
        }
      }
      syncFinanceChrome();
      if (financeTxOpen) {
        loadFinanceTransactions();
      }
    }

    function setFrStatus(msg, kind) {
      const el = document.getElementById("frStatus");
      if (!el) return;
      el.textContent = msg || "";
      el.classList.remove("ok", "err", "warn");
      if (kind) el.classList.add(kind);
    }

    function revokeFrUrls() {
      for (const item of frImages) {
        if (item && item.url) {
          try {
            URL.revokeObjectURL(item.url);
          } catch (_) {}
        }
      }
    }

    function resetReceiptPanel() {
      stopFrRecording(false);
      revokeFrUrls();
      frImages = [];
      frVoiceBlob = null;
      frVoiceExt = "webm";
      const note = document.getElementById("frNote");
      if (note) note.value = "";
      const input = document.getElementById("frFileInput");
      if (input) input.value = "";
      const camIn = document.getElementById("frCameraInput");
      if (camIn) camIn.value = "";
      updateFrVoiceDot();
      renderFrGrid();
      setFrStatus("");
    }

    function setFinanceReceiptOpen(open) {
      financeReceiptOpen = !!open;
      if (financeReceiptOpen) {
        financeFormOpen = false;
        financeTxOpen = false;
        if (financeVoiceOpen) {
          resetFinanceVoice();
          financeVoiceOpen = false;
        }
        financeEditingRow = null;
        financeFormFromTx = false;
        renderFrGrid();
      } else {
        stopFrRecording(false);
      }
      syncFinanceChrome();
    }

    function setFvStatus(msg, kind) {
      const el = document.getElementById("fvStatus");
      if (!el) return;
      el.textContent = msg || "";
      el.className = "status-line" + (kind ? " " + kind : "");
    }

    function setFvProgress(visible, pct) {
      const bar = document.getElementById("fvProgress");
      const fill = document.getElementById("fvProgressBar");
      if (bar) bar.classList.toggle("visible", !!visible);
      if (fill && pct != null) fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
    }

    function updateFvButtons() {
      const rec = document.getElementById("fvRecBtn");
      const send = document.getElementById("fvSend");
      const discard = document.getElementById("fvDiscard");
      const busy = fvState === "sending";
      const hasLive = fvState === "recording";
      const hasBlob = !!(fvBlob && fvBlob.size > 0);
      if (rec) {
        rec.disabled = busy;
        rec.classList.toggle("recording", hasLive);
        rec.setAttribute(
          "aria-label",
          hasLive ? "Stop recording" : "Start recording"
        );
      }
      if (send) send.disabled = busy || !(hasLive || hasBlob);
      if (discard) discard.disabled = busy || !(hasLive || hasBlob);
      document.body.classList.toggle(
        "is-recording",
        financeVoiceOpen && hasLive
      );
    }

    function stopFvTracks() {
      if (fvStream) {
        fvStream.getTracks().forEach((t) => t.stop());
        fvStream = null;
      }
    }

    function clearFvTimer() {
      if (fvTimerInterval) {
        clearInterval(fvTimerInterval);
        fvTimerInterval = 0;
      }
    }

    function resetFinanceVoice() {
      clearFvTimer();
      try {
        if (fvRecorder && fvRecorder.state !== "inactive") fvRecorder.stop();
      } catch (_) {}
      fvRecorder = null;
      stopFvTracks();
      fvChunks = [];
      fvBlob = null;
      fvMime = "audio/webm";
      fvStartedAt = 0;
      fvElapsed = 0;
      fvState = "idle";
      const timer = document.getElementById("fvTimer");
      if (timer) timer.textContent = "00:00";
      setFvStatus("");
      setFvProgress(false, 0);
      updateFvButtons();
    }

    function setFinanceVoiceOpen(open) {
      financeVoiceOpen = !!open;
      if (financeVoiceOpen) {
        financeFormOpen = false;
        financeTxOpen = false;
        financeReceiptOpen = false;
        financeEditingRow = null;
        financeFormFromTx = false;
        stopFrRecording(false);
        resetFinanceVoice();
      } else {
        resetFinanceVoice();
      }
      syncFinanceChrome();
    }

    function openThisMonthTransactions(highlightRow) {
      const now = new Date();
      financeTxYear = now.getFullYear();
      financeTxMonth = now.getMonth() + 1;
      financeHighlightRow =
        highlightRow != null && Number.isFinite(Number(highlightRow))
          ? Number(highlightRow)
          : null;
      setFinanceTxOpen(true);
    }

    async function startFinanceVoice() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setFvStatus("Mic not available.", "err");
        return;
      }
      if (!window.isSecureContext) {
        setFvStatus("Needs HTTPS for mic.", "err");
        return;
      }
      try {
        fvStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
          },
        });
      } catch (e) {
        setFvStatus("Mic denied: " + (e.message || e), "err");
        return;
      }
      const mime = typeof pickMimeType === "function" ? pickMimeType() : "";
      fvMime = mime || "audio/webm";
      fvChunks = [];
      fvBlob = null;
      const options = { audioBitsPerSecond: 128000 };
      if (mime) options.mimeType = mime;
      try {
        fvRecorder = new MediaRecorder(fvStream, options);
      } catch (_) {
        try {
          fvRecorder = new MediaRecorder(
            fvStream,
            mime ? { mimeType: mime } : {}
          );
        } catch (__) {
          fvRecorder = new MediaRecorder(fvStream);
        }
      }
      fvRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) fvChunks.push(ev.data);
      };
      fvRecorder.start(1000);
      fvState = "recording";
      fvStartedAt = Date.now();
      fvElapsed = 0;
      clearFvTimer();
      const timerEl = document.getElementById("fvTimer");
      fvTimerInterval = setInterval(() => {
        const live = fvState === "recording" ? Date.now() - fvStartedAt : 0;
        if (timerEl) {
          timerEl.textContent =
            typeof formatTime === "function"
              ? formatTime(fvElapsed + live)
              : "00:00";
        }
      }, 200);
      setFvStatus("Recording…");
      updateFvButtons();
    }

    function stopFinanceVoice() {
      return new Promise((resolve) => {
        clearFvTimer();
        if (!fvRecorder || fvRecorder.state === "inactive") {
          if (fvBlob && fvBlob.size > 0) fvState = "ready";
          else fvState = "idle";
          updateFvButtons();
          resolve(fvBlob);
          return;
        }
        if (fvState === "recording") {
          fvElapsed += Date.now() - fvStartedAt;
        }
        const mr = fvRecorder;
        const finish = () => {
          fvBlob = new Blob(fvChunks, { type: mr.mimeType || fvMime });
          fvMime = fvBlob.type || fvMime;
          stopFvTracks();
          fvRecorder = null;
          fvState = fvBlob && fvBlob.size > 0 ? "ready" : "idle";
          const timerEl = document.getElementById("fvTimer");
          if (timerEl && typeof formatTime === "function") {
            timerEl.textContent = formatTime(fvElapsed);
          }
          setFvStatus(fvState === "ready" ? "Ready to send" : "");
          updateFvButtons();
          resolve(fvBlob);
        };
        mr.addEventListener("stop", finish, { once: true });
        try {
          if (mr.state === "recording" || mr.state === "paused") {
            try {
              if (mr.state === "recording") mr.requestData();
            } catch (_) {}
            mr.stop();
          } else {
            finish();
          }
        } catch (_) {
          finish();
        }
      });
    }

    async function sendFinanceVoice() {
      if (fvState === "sending") return;
      if (fvState === "recording") {
        await stopFinanceVoice();
      }
      if (!fvBlob || !fvBlob.size) {
        setFvStatus("Nothing to send.", "err");
        return;
      }
      fvState = "sending";
      updateFvButtons();
      setFvStatus("Transcribing + ledger…", "warn");
      setFvProgress(true, 8);

      const settings =
        typeof getSettings === "function"
          ? getSettings()
          : { model: "medium", translate: false, stt: resolvedStt() };
      const form = new FormData();
      const ext =
        typeof extForMime === "function" ? extForMime(fvMime) : "webm";
      form.append("audio", fvBlob, `finance-voice.${ext}`);
      form.append("title", "");
      form.append("model", settings.model || "medium");
      form.append("translate", settings.translate ? "true" : "false");
      form.append("stt", settings.stt || "local");
      form.append("update_ledger", "true");
      form.append(
        "client_id",
        localStorage.getItem("client_id") ||
          (localStorage.client_id = crypto.randomUUID())
      );

      try {
        const note = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/notes");
          xhr.responseType = "json";
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) {
              setFvProgress(
                true,
                Math.max(8, Math.round((ev.loaded / ev.total) * 70))
              );
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
            else {
              const detail =
                (xhr.response &&
                  (xhr.response.detail || xhr.response.message)) ||
                xhr.statusText;
              reject(
                new Error(
                  typeof detail === "string" ? detail : "Upload failed"
                )
              );
            }
          };
          xhr.onerror = () => reject(new Error("Network error"));
          xhr.send(form);
        });

        setFvProgress(true, 100);
        const fin = note && note.finance;
        if (fin && fin.ok && Array.isArray(fin.entries) && fin.entries.length) {
          const e0 = fin.entries[0];
          const sheetRow =
            e0.sheet && e0.sheet.ok ? Number(e0.sheet.row) : null;
          const msg =
            "AI · " +
            formatRupee(e0.amount) +
            " · " +
            (e0.category || "") +
            (sheetRow ? " · row " + sheetRow : "");
          const dashBody = document.getElementById("financeDashBody");
          if (dashBody) delete dashBody.dataset.loaded;
          setFinanceVoiceOpen(false);
          openThisMonthTransactions(sheetRow);
          setFinStatus(msg, "ok");
        } else {
          setFvStatus(
            "Ledger: " + ((fin && fin.error) || "no entry"),
            "err"
          );
          fvState = "ready";
          updateFvButtons();
          setFvProgress(false, 0);
        }
      } catch (e) {
        setFvStatus("Failed: " + (e.message || e), "err");
        fvState = "ready";
        updateFvButtons();
        setFvProgress(false, 0);
      }
    }

    function updateFrVoiceDot() {
      const dot = document.getElementById("frVoiceDot");
      const mic = document.getElementById("frMicBtn");
      if (dot) {
        dot.classList.toggle("on", !!frVoiceBlob && !frRecording);

    function renderFrGrid() {
      const grid = document.getElementById("frGrid");
      if (!grid) return;
      const parts = frImages.map((item) => {
        return (
          `<div class="fr-thumb" data-id="${item.id}">` +
          `<img src="${item.url}" alt="" />` +
          `<button type="button" class="fr-rm" data-rm="${item.id}" aria-label="Remove">×</button>` +
          `</div>`
        );
      });
      if (frImages.length < FR_MAX_IMAGES) {
        // Library/files first (primary), then camera
        parts.push(
          `<button type="button" class="fr-add" id="frAddBtn" aria-label="Upload photo">+</button>`
        );
        parts.push(
          `<button type="button" class="fr-add cam" id="frCamAddBtn" aria-label="Take photo">📷</button>`
        );

    function addFrFiles(fileList) {
      const files = Array.from(fileList || []).filter(
        (f) => f && f.type && f.type.startsWith("image/")
      );
      for (const file of files) {
        if (frImages.length >= FR_MAX_IMAGES) break;
        const id =
          (crypto.randomUUID && crypto.randomUUID()) ||
          String(Date.now()) + Math.random().toString(16).slice(2);
        frImages.push({
          id,
          file,
          url: URL.createObjectURL(file),
        });
      }
      renderFrGrid();
    }

    function removeFrImage(id) {
      const idx = frImages.findIndex((x) => x.id === id);
      if (idx < 0) return;
      try {
        URL.revokeObjectURL(frImages[idx].url);
      } catch (_) {}
      frImages.splice(idx, 1);
      renderFrGrid();
    }

    function stopFrRecording(keepBlob) {
      if (frMediaRecorder && frMediaRecorder.state !== "inactive") {
        try {
          frMediaRecorder.stop();
        } catch (_) {}
      }
      if (frMediaStream) {
        try {
          frMediaStream.getTracks().forEach((t) => t.stop());
        } catch (_) {}
      }
      frMediaRecorder = null;
      frMediaStream = null;
      frRecordChunks = [];
      frRecording = false;
      if (!keepBlob) {
        // leave existing frVoiceBlob unless explicitly clearing
      }
      updateFrVoiceDot();
    }

    async function toggleFrVoiceNote() {
      if (frRecording) {
        // stop → blob kept via onstop
        if (frMediaRecorder && frMediaRecorder.state !== "inactive") {
          frMediaRecorder.stop();
        }
        return;
      }
      // New recording replaces previous voice note
      frVoiceBlob = null;
      updateFrVoiceDot();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        frMediaStream = stream;
        frRecordChunks = [];
        let mime = "";
        if (window.MediaRecorder) {
          if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
            mime = "audio/webm;codecs=opus";
            frVoiceExt = "webm";
          } else if (MediaRecorder.isTypeSupported("audio/webm")) {
            mime = "audio/webm";
            frVoiceExt = "webm";
          } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
            mime = "audio/mp4";
            frVoiceExt = "m4a";
          }
        }
        const rec = mime
          ? new MediaRecorder(stream, { mimeType: mime })
          : new MediaRecorder(stream);
        frMediaRecorder = rec;
        rec.ondataavailable = (ev) => {
          if (ev.data && ev.data.size) frRecordChunks.push(ev.data);
        };
        rec.onstop = () => {
          const type = rec.mimeType || mime || "audio/webm";
          if (frRecordChunks.length) {
            frVoiceBlob = new Blob(frRecordChunks, { type });
          }
          if (frMediaStream) {
            try {
              frMediaStream.getTracks().forEach((t) => t.stop());
            } catch (_) {}
          }
          frMediaStream = null;
          frMediaRecorder = null;
          frRecordChunks = [];
          frRecording = false;
          updateFrVoiceDot();
          if (frVoiceBlob) setFrStatus("Voice note ready", "ok");
        };
        rec.start();
        frRecording = true;
        updateFrVoiceDot();
        setFrStatus("Listening…", "warn");
      } catch (e) {
        setFrStatus(e.message || "Mic blocked", "err");
        stopFrRecording(false);
      }
    }

    async function submitReceipt() {
      if (frRecording) {
        setFrStatus("Stop voice note first", "err");
        return;
      }
      if (!frImages.length) {
        setFrStatus("Add a photo", "err");
        return;
      }
      const note = (document.getElementById("frNote")?.value || "").trim();
      const btn = document.getElementById("frSend");
      if (btn) btn.disabled = true;
      setFrStatus("Updating…", "warn");

      const form = new FormData();
      for (const item of frImages) {
        form.append("images", item.file, item.file.name || "photo.jpg");
      }
      form.append("note", note);
      form.append("save", "true");
      if (frVoiceBlob) {
        form.append("audio", frVoiceBlob, `voice.${frVoiceExt}`);
        const settings = typeof getSettings === "function" ? getSettings() : null;
        if (settings) {
          form.append("model", settings.model || "medium");
          form.append("translate", settings.translate ? "true" : "false");
          form.append("stt", settings.stt || "local");
        }
      }

      try {
        const r = await fetch("/api/finance/receipt", {
          method: "POST",
          body: form,
        });
        let data = null;
        try {
          data = await r.json();
        } catch (_) {
          data = null;
        }
        if (!r.ok) {
          const detail =
            (data && (data.detail || data.error || data.message)) ||
            `HTTP ${r.status}`;
          throw new Error(
            typeof detail === "string" ? detail : JSON.stringify(detail)
          );
        }
        if (data && data.ok && Array.isArray(data.entries) && data.entries.length) {
          const e0 = data.entries[0];
          const sheetRow =
            e0.sheet && e0.sheet.ok ? Number(e0.sheet.row) : null;
          const msg =
            formatRupee(e0.amount) +
            " · " +
            (e0.category || "") +
            (e0.notes ? " · " + String(e0.notes).slice(0, 48) : "") +
            (sheetRow ? " · row " + sheetRow : "");
          resetReceiptPanel();
          setFinanceReceiptOpen(false);
          // Open this month's transactions so the new Ledger row is visible
          openThisMonthTransactions(sheetRow);
          setFinStatus(msg, "ok");
          setFrStatus("");
        } else {
          setFrStatus((data && data.error) || "No entry", "err");
        }
      } catch (e) {
        setFrStatus(e.message || "Failed", "err");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function shiftFinanceTxMonth(delta) {
      let y = financeTxYear;
      let m = financeTxMonth;
      if (y == null || m == null) {
        const now = new Date();
        y = now.getFullYear();
        m = now.getMonth() + 1;
      }
      m += delta;
      while (m < 1) {
        m += 12;
        y -= 1;
      }
      while (m > 12) {
        m -= 12;
        y += 1;
      }
      // Soft bounds
      if (y < 2000 || y > 2100) return;
      financeTxYear = y;
      financeTxMonth = m;
      loadFinanceTransactions();
    }

    function normalizePath(path) {
      const p = String(path || "/").split("?")[0].split("#")[0];
      if (p.length > 1 && p.endsWith("/")) return p.replace(/\/+$/, "");
      return p || "/";
    }

    function parseVoiceRoute(path) {
      const p = normalizePath(path || location.pathname);
      if (p === "/voice") return { name: "record", id: null };
      if (p === "/voice/notes") return { name: "list", id: null };
      const m = p.match(/^\/voice\/notes\/([^/]+)$/);
      if (m) return { name: "detail", id: decodeURIComponent(m[1]) };
      if (p.startsWith("/voice/")) return { name: "record", id: null };
      return null;
    }

    function voicePathFor(name, noteId) {
      if (name === "list") return "/voice/notes";
      if (name === "detail") {
        const id = noteId || currentNoteId;
        return id ? "/voice/notes/" + encodeURIComponent(id) : "/voice/notes";
      }
      return "/voice/";
    }

    function isStandaloneVoice() {
      try {
        if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) {
          return true;
        }
        if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) {
          return true;
        }
      } catch (_) {}
      return !!(window.navigator && window.navigator.standalone);
    }

    function ensureVoiceServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      if (!parseVoiceRoute()) return;
      navigator.serviceWorker
        .register("/voice/sw.js", { scope: "/voice/" })
        .catch(() => {});
    }

    function syncVoiceUrl(name, { replace } = {}) {
      if (name !== "record" && name !== "list" && name !== "detail") return;
      const next = voicePathFor(name, currentNoteId);
      if (normalizePath(location.pathname) === normalizePath(next)) {
        try {
          history.replaceState(
            { view: name, noteId: currentNoteId || null },
            "",
            next
          );
        } catch (_) {}
        return;
      }
      const state = { view: name, noteId: currentNoteId || null };
      if (replace) history.replaceState(state, "", next);
      else history.pushState(state, "", next);
    }

      if (!d || !d.ok) {
        body.innerHTML =
          `<div class="fd-empty">${escapeHtml((d && d.error) || "Unavailable")}</div>`;
        return;
      }

      const remCls = moneyClass(d.budget_remaining);
      const freeCls = moneyClass(d.free_to_allocate);
      const nextCls = moneyClass(d.est_free_next_month);
      const paceLvl = d.pace_level || "ok";
      const usedPct = Number(d.budget_used_pct) || 0;
      const usedBar = Math.min(100, Math.max(0, usedPct * 100));
      let barCls = "ok";
      if (paceLvl === "danger") barCls = "danger";
      else if (paceLvl === "warn") barCls = "warn";
      else if (usedPct >= 0.85) barCls = "warn";

      body.innerHTML =
        `<div class="fd-hero">` +
          `<div class="fd-hero-top">` +
            `<div class="fd-month">${escapeHtml(d.month || "")}</div>` +
            `<div class="fd-days">${Number(d.days_left)} days left</div>` +
          `</div>` +
          `<div class="fd-pace ${escapeHtml(paceLvl)}">${escapeHtml(d.pace || "")}</div>` +

          `<div class="fd-budget-block">` +
            `<div class="fd-budget-head">` +
              `<span class="lbl">Monthly budget</span>` +
              `<span class="val">${formatRupee(d.budget)}</span>` +
            `</div>` +
            `<div class="fd-budget-split">` +
              `<div class="piece">` +
                `<span class="lbl">Spent</span>` +
                `<div class="val">${formatRupee(d.budget_spent)}</div>` +
              `</div>` +
              `<div class="piece">` +
                `<span class="lbl">Left</span>` +
                `<div class="val ${remCls}">${formatRupee(d.budget_remaining)}</div>` +
              `</div>` +
            `</div>` +
            `<div class="fd-progress" role="progressbar" aria-valuenow="${Math.round(usedBar)}" aria-valuemin="0" aria-valuemax="100">` +
              `<div class="fd-progress-fill ${barCls}" style="width:${usedBar.toFixed(1)}%"></div>` +
            `</div>` +
            `<div class="fd-progress-meta">` +
              `<span>${formatPct(d.budget_used_pct)} used · ${formatPct(d.month_elapsed_pct)} month</span>` +
              `<span>Safe ${formatRupee(d.safe_per_day)}/day</span>` +
            `</div>` +
          `</div>` +
        `</div>` +

        renderTxShortcutBtn() +

        renderCategoryChart(d) +

        `<div class="fd-card">` +
          `<div class="fd-card-title">Credit cards</div>` +
          (Array.isArray(d.credit_cards) && d.credit_cards.length
            ? d.credit_cards
            : [
                { name: "HDFC Credit Card", due: d.hdfc_cc },
                { name: "ICICI Credit Card", due: d.icici_cc },
              ]
          ).map(function (c) {
            return (
              '<div class="fd-row"><span class="k">' +
              escapeHtml(ACC_LABELS[c.name] || c.name) +
              '</span><span class="v">' +
              formatRupee(c.due) +
              "</span></div>"
            );
          }).join("") +
          `<div class="fd-row total"><span class="k">Total due</span><span class="v">${formatRupee(d.cc_total)}</span></div>` +
        `</div>` +

        `<div class="fd-card">` +
          `<div class="fd-card-title">Free to allocate</div>` +
          `<div class="fd-row"><span class="k">Liquid</span><span class="v">${formatRupee(d.liquid)}</span></div>` +
          `<div class="fd-row"><span class="k">Budget reserved</span><span class="v">${formatRupee(d.budget_reserved)}</span></div>` +
          `<div class="fd-row"><span class="k">Committed</span><span class="v">${formatRupee(d.committed_cash)}</span></div>` +
          `<div class="fd-row hl"><span class="k">Free</span><span class="v ${freeCls}">${formatRupee(d.free_to_allocate)}</span></div>` +
          `<div class="fd-hint">Committed = CC due + remaining EMI this month + one-time (30d). Rent/family already in the budget cap are not added again.</div>` +
        `</div>` +

        `<div class="fd-card">` +
          `<div class="fd-card-title">Next month</div>` +
          `<div class="fd-row hl-soft"><span class="k">Est. free</span><span class="v ${nextCls}">${formatRupee(d.est_free_next_month)}</span></div>` +
        `</div>` +

        renderPlannedExpensesCard(d.planned);
    }

    function renderPlannedExpensesCard(p) {
      if (!p || !p.available) {
        return (
          `<div class="fd-card">` +
            `<div class="fd-card-title">Planned expenses</div>` +
            `<div class="fd-empty" style="padding:12px 4px">No planning sheet yet</div>` +
          `</div>`
        );
      }
      const rows = Array.isArray(p.forecast_6m) ? p.forecast_6m : [];
      let forecastHtml = "";
      if (rows.length) {
        const body = rows.map((row) => (
          `<tr>` +
            `<td>${escapeHtml(row.label || "")}</td>` +
            `<td class="loan">${formatRupee(row.loan_emi)}</td>` +
            `<td>${formatRupee(row.lifestyle)}</td>` +
            `<td>${formatRupee(row.total)}</td>` +
          `</tr>`
        )).join("");
        const totLoan = rows.reduce((s, r) => s + (Number(r.loan_emi) || 0), 0);
        const totLife = rows.reduce((s, r) => s + (Number(r.lifestyle) || 0), 0);
        const totAll = rows.reduce((s, r) => s + (Number(r.total) || 0), 0);
        forecastHtml =
          `<div class="fd-card-title">Next 6 months</div>` +
          `<div class="fd-forecast-wrap"><table class="fd-forecast">` +
            `<thead><tr><th>Month</th><th>Loan / EMI</th><th>Lifestyle</th><th>Total</th></tr></thead>` +
            `<tbody>${body}` +
              `<tr class="total"><td>6-month total</td><td class="loan">${formatRupee(totLoan)}</td><td>${formatRupee(totLife)}</td><td>${formatRupee(totAll)}</td></tr>` +
            `</tbody></table></div>` +
          `<div class="fd-hint">Loan / EMI is must-pay. Lifestyle is everyday recurring you can cut.</div>`;
      }
      return (
        `<div class="fd-card">` +
          `<div class="fd-card-title">Planned expenses</div>` +
          `<div class="fd-row hl"><span class="k">This month due</span><span class="v">${formatRupee(p.this_month_recurring_total ?? p.monthly_fixed_cost)}</span></div>` +
          `<div class="fd-row"><span class="k">Loan / EMI</span><span class="v">${formatRupee(p.this_month_loan_emi)}</span></div>` +
          `<div class="fd-row"><span class="k">Lifestyle</span><span class="v">${formatRupee(p.this_month_lifestyle)}</span></div>` +
          `<div class="fd-row"><span class="k">Active recurring</span><span class="v">${Number(p.monthly_recurring_count) || 0}</span></div>` +
          `<div class="fd-row total"><span class="k">Upcoming one-time 30d</span><span class="v">${formatRupee(p.upcoming_30_days)}</span></div>` +
          `<div class="fd-row"><span class="k">Upcoming one-time 90d</span><span class="v">${formatRupee(p.upcoming_90_days)}</span></div>` +
        `</div>` +
        (forecastHtml ? `<div class="fd-card">${forecastHtml}</div>` : "")
      );
    }

    async function loadFinanceDashboard() {
      const body = document.getElementById("financeDashBody");
      if (body && !body.dataset.loaded) {
        body.innerHTML = `<div class="fd-empty">Loading…</div>`;
      }
      try {
        const r = await fetch("/api/finance/dashboard");
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          const detail = d.detail || d.error || "Failed to load";
          throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
        }
        renderFinanceDashboard(d);
        if (body) body.dataset.loaded = "1";
      } catch (e) {
        if (body) {
          body.innerHTML = `<div class="fd-empty">${escapeHtml(e.message || "Failed")}</div>`;
        }
      }
    }

    function formatRupeeExact(n) {
      const num = Number(n);
      if (!Number.isFinite(num)) return "₹—";
      const hasPaise = Math.abs(num % 1) > 1e-9;
      return (
        "₹" +
        num.toLocaleString("en-IN", {
          minimumFractionDigits: hasPaise ? 2 : 0,
          maximumFractionDigits: 2,
        })
      );
    }

    function formatTxDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      });
    }

    function accShort(name) {
      if (!name) return "—";
      return ACC_LABELS[name] || name;
    }

    function typeCssKey(type) {
      const t = String(type || "").toLowerCase();
      if (t === "expense") return "expense";
      if (t === "income") return "income";
      if (t === "transfer") return "transfer";
      if (t === "refund") return "refund";
      if (t === "investment") return "investment";
      if (t === "adjustment") return "adjustment";
      if (t === "credit card payment") return "transfer";
      return "other";
    }

    function amountCssKey(type) {
      const k = typeCssKey(type);
      if (k === "income" || k === "refund") return "income";
      if (k === "transfer" || k === "investment") return "transfer";
      if (k === "expense") return "expense";
      return "other";
    }

    function renderFinanceTransactions(d) {
      const list = document.getElementById("financeTxList");
      const countEl = document.getElementById("financeTxCount");
      const labelEl = document.getElementById("financeTxMonthLabel");
      const nextBtn = document.getElementById("financeTxNext");
      if (!list) return;

      if (!d || !d.ok) {
        financeTxCache = [];
        if (countEl) countEl.textContent = "";
        if (labelEl) labelEl.textContent = "—";
        list.innerHTML =
          `<div class="fd-empty">${escapeHtml((d && d.error) || "Unavailable")}</div>`;
        return;
      }

      if (d.year != null) financeTxYear = Number(d.year);
      if (d.month != null) financeTxMonth = Number(d.month);
      if (labelEl) labelEl.textContent = d.month_label || "—";

      const txs = Array.isArray(d.transactions) ? d.transactions : [];
      financeTxCache = txs;
      if (countEl) {
        countEl.textContent =
          txs.length + (txs.length === 1 ? " entry" : " entries");
      }

      // Soft-limit next month to ~1 year ahead of current
      if (nextBtn) {
        const now = new Date();
        const curY = now.getFullYear();
        const curM = now.getMonth() + 1;
        const limitY = curY + 1;
        const tooFar =
          financeTxYear > limitY ||
          (financeTxYear === limitY && financeTxMonth > curM);
        nextBtn.disabled = !!tooFar;
      }

      if (!txs.length) {
        list.innerHTML = `<div class="fd-empty">No transactions</div>`;
        return;
      }

      list.innerHTML = txs
        .map((tx) => {
          const typeKey = typeCssKey(tx.type);
          const amtKey = amountCssKey(tx.type);
          const dateStr = formatTxDate(tx.date);
          const timeStr = tx.time ? String(tx.time) : "";
          const dayStr = tx.day ? String(tx.day) : "";
          const notes = (tx.notes || "").trim();
          const budgetOn = !!tx.include_in_budget;
          const from = accShort(tx.from_account);
          const to = accShort(tx.to_account);
          const cat = (tx.category || "").trim() || "—";
          const row = Number(tx.row);

          let metaBits = [];
          if (dateStr) metaBits.push(escapeHtml(dateStr));
          if (timeStr) metaBits.push(escapeHtml(timeStr));
          if (dayStr) metaBits.push(escapeHtml(dayStr));
          const metaHtml = metaBits.join(`<span class="sep">·</span>`);

          const budgetBadge = budgetOn
            ? `<span class="ftx-budget">Budget</span>`
            : "";

          // Pencil + trash icons (inline SVG)
          const editIcon =
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
            `<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>` +
            `</svg>`;
          const delIcon =
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
            `<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>` +
            `</svg>`;

          return (
            `<article class="ftx-card" data-row="${row}">` +
              `<div class="ftx-top">` +
                `<div class="ftx-amount ${amtKey}">${formatRupeeExact(tx.amount)}</div>` +
                `<div class="ftx-top-right">` +
                  budgetBadge +
                  `<span class="ftx-type ${typeKey}">${escapeHtml(tx.type || "—")}</span>` +
                `</div>` +
              `</div>` +
              `<div class="ftx-category">${escapeHtml(cat)}</div>` +
              (metaHtml ? `<div class="ftx-meta">${metaHtml}</div>` : "") +
              `<div class="ftx-route">` +
                `<span class="from">${escapeHtml(from)}</span>` +
                `<span class="arrow" aria-hidden="true">→</span>` +
                `<span class="to">${escapeHtml(to)}</span>` +
              `</div>` +
              `<div class="ftx-bottom">` +
                (notes
                  ? `<div class="ftx-notes">${escapeHtml(notes)}</div>`
                  : `<div class="ftx-notes" aria-hidden="true"></div>`) +
                `<div class="ftx-icon-actions">` +
                  `<button type="button" class="ftx-icon-btn edit" data-action="edit" data-row="${row}" aria-label="Edit" title="Edit">${editIcon}</button>` +
                  `<button type="button" class="ftx-icon-btn delete" data-action="delete" data-row="${row}" aria-label="Delete" title="Delete">${delIcon}</button>` +
                `</div>` +
              `</div>` +
            `</article>`
          );
        })
        .join("");
    }

    async function loadFinanceTransactions() {
      const list = document.getElementById("financeTxList");
      const countEl = document.getElementById("financeTxCount");
      if (list) {
        list.innerHTML = `<div class="fd-empty">Loading…</div>`;
      }
      if (countEl) countEl.textContent = "";
      try {
        let y = financeTxYear;
        let m = financeTxMonth;
        if (y == null || m == null) {
          const now = new Date();
          y = now.getFullYear();
          m = now.getMonth() + 1;
          financeTxYear = y;
          financeTxMonth = m;
        }
        const r = await fetch(
          "/api/finance/transactions?year=" +
            encodeURIComponent(y) +
            "&month=" +
            encodeURIComponent(m)
        );
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          const detail = d.detail || d.error || "Failed to load";
          throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
        }
        renderFinanceTransactions(d);
        // Scroll/highlight row just saved (receipt AI, etc.)
        if (financeHighlightRow != null && list) {
          const want = String(financeHighlightRow);
          const card = list.querySelector(
            '.ftx-card[data-row="' + want + '"]'
          );
          if (card) {
            card.classList.add("ftx-new");
            try {
              card.scrollIntoView({ behavior: "smooth", block: "center" });
            } catch (_) {
              card.scrollIntoView();
            }
            setTimeout(() => {
              try {
                card.classList.remove("ftx-new");
              } catch (_) {}
            }, 4000);
          }
          financeHighlightRow = null;
        }
      } catch (e) {
        financeTxCache = [];
        financeHighlightRow = null;
        if (countEl) countEl.textContent = "";
        if (list) {
          list.innerHTML = `<div class="fd-empty">${escapeHtml(e.message || "Failed")}</div>`;
        }
      }
    }

    function collectFinanceFormPayload({ forEdit } = {}) {
      const amount = document.getElementById("finAmount").value;
      const category = document.getElementById("finCategory").value;
      const fromAccount = document.getElementById("finFrom").value;
      const toAccount = document.getElementById("finTo").value;
      if (!amount || Number(amount) <= 0) {
        setFinStatus("Enter amount", "err");
        document.getElementById("finAmount").focus();
        return null;
      }
      if (!category) {
        setFinStatus("Pick category", "err");
        document.getElementById("finCategory").focus();
        return null;
      }
      if (!fromAccount || !toAccount) {
        setFinStatus("Pick From and To accounts", "err");
        return null;
      }
      if (fromAccount === toAccount) {
        setFinStatus("From and To must differ", "err");
        return null;
      }

      const payload = {
        amount: Number(amount),
        type: document.getElementById("finType").value,
        category,
        from_account: fromAccount,
        to_account: toAccount,
        include_in_budget: document.getElementById("finBudget").checked,
        notes: document.getElementById("finNotes").value.trim(),
      };

      if (forEdit) {
        const dateVal = document.getElementById("finDate").value;
        const timeVal = document.getElementById("finTime").value;
        if (!dateVal) {
          setFinStatus("Date required", "err");
          return null;
        }
        payload.date = dateVal;
        payload.time = timeVal || "";
      } else {
        payload.source = "manual";
      }
      return payload;
    }

    async function initFinance() {
      let opts = FIN_DEFAULTS;
      try {
        const r = await fetch("/api/finance/options");
        if (r.ok) opts = await r.json();
      } catch {
        /* offline defaults */
      }
      financeOpts = opts;

      const types = opts.types || FIN_DEFAULTS.types;
      const cats = opts.categories || FIN_DEFAULTS.categories;
      const accounts = opts.accounts || FIN_DEFAULTS.accounts;
      const d = opts.defaults || FIN_DEFAULTS.defaults;

      fillSelect(document.getElementById("finType"), types, d.type || "Expense");
      const catEl = document.getElementById("finCategory");
      catEl.innerHTML = '<option value="">—</option>';
      for (const c of cats) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        catEl.appendChild(opt);
      }
      fillSelect(
        document.getElementById("finFrom"),
        accounts,
        d.from_account || "HDFC Savings",
        ACC_LABELS
      );
      fillSelect(
        document.getElementById("finTo"),
        accounts,
        d.to_account || "Expense",
        ACC_LABELS
      );
      document.getElementById("finBudget").checked = d.include_in_budget !== false;
      applyTypeDefaults(opts, { touchBudget: true });
      resetFinanceForm(opts);

      document.getElementById("finType").addEventListener("change", () => {
        // When editing, don't clobber accounts/budget on type change unless user wants defaults
        if (!financeEditingRow) {
          applyTypeDefaults(opts, { touchBudget: true });
        }
      });

      document.getElementById("financeTxList").addEventListener("click", (ev) => {
        const btn = ev.target.closest(".ftx-icon-btn");
        if (!btn) return;
        const row = btn.getAttribute("data-row");
        const action = btn.getAttribute("data-action");
        if (action === "edit") openFinanceEdit(row);
        else if (action === "delete") deleteFinanceRow(row, { fromForm: false });
      });

      document.getElementById("finDelete").addEventListener("click", async () => {
        if (!financeEditingRow) return;
        await deleteFinanceRow(financeEditingRow, { fromForm: true });
      });

      document.getElementById("financeForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const editing = !!financeEditingRow;
        const payload = collectFinanceFormPayload({ forEdit: editing });
        if (!payload) return;

        const btn = document.getElementById("finSend");
        const del = document.getElementById("finDelete");
        btn.disabled = true;
        if (del) del.disabled = true;
        setFinStatus(editing ? "Saving…" : "Sending…");
        try {
          let r;
          if (editing) {
            r = await fetch("/api/finance/transactions/" + financeEditingRow, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          } else {
            r = await fetch("/api/finance/entries", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          }
          const body = await r.json().catch(() => ({}));
          if (!r.ok) {
            const detail = body.detail || body.error || "Failed";
            throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
          }

          let okMsg;
          if (editing) {
            okMsg =
              "Updated · " +
              formatRupee(payload.amount) +
              " · row " +
              (body.row || financeEditingRow);
            // If date moved to another month, stay on that month
            if (payload.date) {
              const parts = String(payload.date).split("-");
              if (parts.length >= 2) {
                financeTxYear = Number(parts[0]);
                financeTxMonth = Number(parts[1]);
              }
            }
            resetFinanceForm(opts);
            setFinanceFormOpen(false);
            financeTxOpen = true;
            syncFinanceChrome();
            setFinStatus(okMsg, "ok");
            await loadFinanceTransactions();
            const dashBody = document.getElementById("financeDashBody");
            if (dashBody) delete dashBody.dataset.loaded;
          } else {
            if (body.status === "saved" && body.sheet && body.sheet.ok) {
              okMsg =
                "Saved · " + formatRupee(body.amount) + " · Ledger row " + body.sheet.row;
            } else if (body.sheet && !body.sheet.ok) {
              const why = body.sheet.error || "sheet write failed";
              throw new Error(
                "Logged on laptop · sheet not updated — " + String(why).slice(0, 100)
              );
            } else {
              okMsg = "Saved · " + formatRupee(body.amount);
            }
            resetFinanceForm(opts);
            setFinanceFormOpen(false);
            setFinStatus(okMsg, "ok");
            await loadFinanceDashboard();
          }
        } catch (e) {
          setFinStatus(e.message || "Failed", "err");
        } finally {
          btn.disabled = false;
          if (del) del.disabled = false;
        }
      });
    }

    initFinance();
  </script>

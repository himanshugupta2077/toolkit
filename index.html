        <div class="timer" id="timer">00:00</div>
        <div class="status-line" id="recStatus"></div>
        <div class="level" aria-hidden="true"><i id="levelBar"></i></div>

        <div class="rec-wrap">
          <div class="rec-glow" aria-hidden="true"></div>
          <button type="button" class="rec-btn" id="recBtn" aria-label="Start recording">
            <span class="dot"></span>
          </button>
        </div>

        <div class="drafts-pill" id="draftsPill">
          <strong id="draftsCount">0</strong> draft<span id="draftsPlural">s</span>
        </div>

        <div class="action-row" id="actionRow">
          <button type="button" class="btn btn-soft" id="pauseBtn" disabled>Pause</button>
          <button type="button" class="btn btn-soft" id="draftBtn" disabled>Save draft</button>
          <button type="button" class="btn btn-primary" id="sendBtn" disabled>Send</button>
        </div>
        <label class="fin-budget-row" id="translateRow" title="Translate to English">
          <span class="fin-budget-text">
            <strong>Translate to English</strong>
          </span>
          <span class="switch">
            <input type="checkbox" id="translateToggle" />
            <span class="slider"></span>
          </span>

        <div class="action-row">
          <button type="button" class="btn btn-ghost" id="discardBtn" disabled>Discard</button>
        </div>
        <div class="progress-bar" id="uploadProgress">

        </div>

      <div class="section-label">Options</div>
      <div class="options-block">
        <input class="field" id="noteTitle" type="text" placeholder="Title (optional)" maxlength="120" autocomplete="off" />
        <select class="field" id="modelSelect" aria-label="Whisper model"></select>
      </div>

      <div class="section-label">Notes</div>
      <button type="button" class="open-notes-btn" id="openNotesBtn">
        <span class="on-icon" aria-hidden="true">☰</span>
        <span class="on-text">
          <strong>Open notes</strong>
          <span>Browse saved transcripts</span>
        </span>
        <span class="on-chevron" aria-hidden="true">›</span>
      </button>
    </section>

    <!-- NOTES LIST -->
    <section id="view-list" class="view">
      <div class="toolbar">
        <button type="button" class="btn btn-ghost" id="refreshList" style="flex:0; min-width:auto">Refresh</button>
      </div>
      <div class="notes-list" id="notesList">
        <div class="empty">Loading…</div>
      </div>
    </section>

    <!-- NOTE DETAIL -->
    <section id="view-detail" class="view">
      <div class="card">
        <div class="title-edit">
          <label class="block-label" for="detailTitleInput">Title</label>
          <div class="title-edit-row">
            <input
              class="field"
              id="detailTitleInput"
              type="text"
              maxlength="120"
              autocomplete="off"
              placeholder="Add a title"
            />
            <button type="button" class="btn btn-soft" id="saveTitleBtn">Save</button>
          </div>
          <div class="title-save-status" id="titleSaveStatus" aria-live="polite"></div>
        </div>
        <audio id="detailAudio" controls preload="metadata"></audio>
      </div>
      <div class="card settings-card">
        <div>
          <label class="block-label" for="detailModelSelect">Model</label>
          <select class="field" id="detailModelSelect"></select>
        </div>
        <div class="toggle-row">
          <strong>Translate to English</strong>
          <label class="switch">
            <input type="checkbox" id="detailTranslateToggle" />
            <span class="slider"></span>
          </label>
        </div>
        <button type="button" class="btn btn-primary" id="retranscribeBtn" style="width:100%">
          Re-transcribe
        </button>
      </div>
      <div class="transcript" id="detailTranscript"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="copyTranscript">Copy</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-danger" id="deleteNoteBtn">Delete</button>
      </div>
    </section>
  </main>

  <script>
    /* ------------------------------------------------------------------ */
    /* Views                                                                */
    /* ------------------------------------------------------------------ */
    const views = {
      home: document.getElementById("view-home"),
      record: document.getElementById("view-record"),
      list: document.getElementById("view-list"),
      detail: document.getElementById("view-detail"),
      finance: document.getElementById("view-finance"),
      ai: document.getElementById("view-ai"),
      heart: document.getElementById("view-heart"),
    };

    /* ------------------------------------------------------------------ */
    /* Heart module — countdown lock + secret sequence + passcode          */
    /* Must live above any showView() call (early leaveHeartView is safe). */
    /* Unlock sequence: heart → days → minutes → heart                     */
    /* Passcode: 110926                                                    */
    /* After 2026-09-11 local midnight, opens freely.                      */
    /* ------------------------------------------------------------------ */
    const HEART_UNLOCK_AT = new Date(2026, 8, 11, 0, 0, 0, 0); // 11 Sep 2026
    const HEART_PASSCODE = "110926";
    const HEART_SEQ = ["heart", "days", "minutes", "heart"];
    const HEART_SEQ_TIMEOUT_MS = 4000;
    const HEART_LS_KEY = "heart_unlocked_v1";
    const heartModuleReady = true;

    const HEART_CAT_META = {
      fashion: { icon: "◇", label: "Fashion" },
      relationships: { icon: "♡", label: "Relationships" },
      travel: { icon: "◎", label: "Travel" },
      art: { icon: "✧", label: "Art" },
      entertainment: { icon: "◈", label: "Entertainment" },
      food: { icon: "◉", label: "Food" },
      home: { icon: "⌂", label: "Home" },
      shopping: { icon: "▢", label: "Shopping" },
      health: { icon: "✚", label: "Health" },
      events: { icon: "✦", label: "Events" },
      pets: { icon: "🐾", label: "Pets" },
      other: { icon: "·", label: "Other" },
    };

    let heartTimer = 0;
    let heartSeq = [];
    let heartSeqTimer = 0;
    let heartHandlersBound = false;

    /* Browser state (unlocked) */
    let hbCatalog = null;
    let hbLoading = false;
    let hbLevel = "cats"; // cats | posts | detail | media
    let hbCategory = null;
    let hbTag = null; // null = all
    let hbSearch = "";
    let hbPostId = null;
    let hbMediaIndex = 0;
    let hbSearchTimer = 0;
    let hbBrowserBound = false;

    function heartIsDateUnlocked() {
      return Date.now() >= HEART_UNLOCK_AT.getTime();
    }

    function heartIsSessionUnlocked() {
      try {
        return localStorage.getItem(HEART_LS_KEY) === "1";
      } catch (_) {
        return false;
      }
    }

    function heartIsOpen() {
      return heartIsDateUnlocked() || heartIsSessionUnlocked();
    }

    function setHeartUnlockedPersist(on) {
      try {
        if (on) localStorage.setItem(HEART_LS_KEY, "1");
        else localStorage.removeItem(HEART_LS_KEY);
      } catch (_) { /* ignore */ }
    }

    function heartPad2(n) {
      return String(Math.max(0, n)).padStart(2, "0");
    }

    function updateHeartCountdown() {
      const daysEl = document.getElementById("heartDays");
      const hoursEl = document.getElementById("heartHours");
      const minsEl = document.getElementById("heartMinutes");
      const secsEl = document.getElementById("heartSeconds");
      if (!daysEl || !hoursEl || !minsEl || !secsEl) return;

      const ms = HEART_UNLOCK_AT.getTime() - Date.now();
      if (ms <= 0) {
        daysEl.textContent = "0";
        hoursEl.textContent = "00";
        minsEl.textContent = "00";
        secsEl.textContent = "00";
        if (!heartIsSessionUnlocked()) setHeartUnlockedPersist(true);
        renderHeartState();
        return;
      }

      const totalSec = Math.floor(ms / 1000);
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      daysEl.textContent = String(days);
      hoursEl.textContent = heartPad2(hours);
      minsEl.textContent = heartPad2(mins);
      secsEl.textContent = heartPad2(secs);
    }

    function renderHeartState() {
      const locked = document.getElementById("heartLocked");
      const unlocked = document.getElementById("heartUnlocked");
      const view = document.getElementById("view-heart");
      if (!locked || !unlocked) return;
      const open = heartIsOpen();
      locked.classList.toggle("hidden", open);
      unlocked.classList.toggle("hidden", !open);
      if (view) view.classList.toggle("browser-mode", open);
      if (open) {
        stopHeartCountdown();
        closeHeartPasscode();
        ensureHeartBrowser();
      }
      syncHeartHeader();
    }

    function startHeartCountdown() {
      stopHeartCountdown();
      updateHeartCountdown();
      heartTimer = window.setInterval(updateHeartCountdown, 1000);
    }

    function stopHeartCountdown() {
      if (heartTimer) {
        clearInterval(heartTimer);
        heartTimer = 0;
      }
    }

    function resetHeartSeq() {
      heartSeq = [];
      if (heartSeqTimer) {
        clearTimeout(heartSeqTimer);
        heartSeqTimer = 0;
      }
    }

    function bumpHeartSeqTimeout() {
      if (heartSeqTimer) clearTimeout(heartSeqTimer);
      heartSeqTimer = window.setTimeout(resetHeartSeq, HEART_SEQ_TIMEOUT_MS);
    }

    function onHeartSeqTap(key) {
      if (heartIsOpen()) return;
      heartSeq.push(key);
      bumpHeartSeqTimeout();

      for (let i = 0; i < heartSeq.length; i++) {
        if (heartSeq[i] !== HEART_SEQ[i]) {
          heartSeq = key === HEART_SEQ[0] ? [key] : [];
          if (heartSeq.length) bumpHeartSeqTimeout();
          else resetHeartSeq();
          return;
        }
      }

      if (heartSeq.length === HEART_SEQ.length) {
        resetHeartSeq();
        openHeartPasscode();
      }
    }

    function openHeartPasscode() {
      const overlay = document.getElementById("heartPassOverlay");
      const input = document.getElementById("heartPassInput");
      const err = document.getElementById("heartPassErr");
      if (!overlay) return;
      overlay.classList.remove("hidden");
      if (err) err.textContent = "";
      if (input) {
        input.value = "";
        setTimeout(() => input.focus(), 60);
      }
    }

    function closeHeartPasscode() {
      const overlay = document.getElementById("heartPassOverlay");
      const input = document.getElementById("heartPassInput");
      const err = document.getElementById("heartPassErr");
      if (overlay) overlay.classList.add("hidden");
      if (input) input.value = "";
      if (err) err.textContent = "";
    }

    function submitHeartPasscode() {
      const input = document.getElementById("heartPassInput");
      const err = document.getElementById("heartPassErr");
      const val = (input && input.value ? input.value : "").trim();
      if (val === HEART_PASSCODE) {
        setHeartUnlockedPersist(true);
        closeHeartPasscode();
        renderHeartState();
        return;
      }
      if (err) err.textContent = "Wrong passcode";
      if (input) {
        input.value = "";
        input.focus();
      }
    }

    function enterHeartView() {
      renderHeartState();
      if (!heartIsOpen()) startHeartCountdown();
      bindHeartHandlers();
    }

    function leaveHeartView() {
      stopHeartCountdown();
      resetHeartSeq();
      closeHeartPasscode();
      closeHbMedia();
      // Keep catalog in memory; reset nav to categories next open
      hbLevel = "cats";
      hbCategory = null;
      hbTag = null;
      hbPostId = null;
      const search = document.getElementById("hbSearch");
      if (search && !hbSearch) search.value = "";
      const view = document.getElementById("view-heart");
      if (view) view.classList.remove("browser-mode");
    }

    function bindHeartHandlers() {
      if (heartHandlersBound) return;
      heartHandlersBound = true;

      const pulse = document.getElementById("heartPulse");
      if (pulse) {
        pulse.addEventListener("click", (e) => {
          e.preventDefault();
          onHeartSeqTap("heart");
        });
      }

      document.querySelectorAll("#heartCountdown .heart-cd-cell").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          const key = el.getAttribute("data-seq");
          if (key) onHeartSeqTap(key);
        });
      });

      const cancel = document.getElementById("heartPassCancel");
      const submit = document.getElementById("heartPassSubmit");
      const input = document.getElementById("heartPassInput");
      const overlay = document.getElementById("heartPassOverlay");

      if (cancel) cancel.addEventListener("click", closeHeartPasscode);
      if (submit) submit.addEventListener("click", submitHeartPasscode);
      if (input) {
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            submitHeartPasscode();
          } else if (e.key === "Escape") {
            e.preventDefault();
            closeHeartPasscode();
          }
        });
      }
      if (overlay) {
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) closeHeartPasscode();
        });
      }
    }

    /* ---------- Heart browser (catalog / media) ---------- */

    function hbCatLabel(id) {
      const m = HEART_CAT_META[id];
      if (m) return m.label;
      return (id || "Other").replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function hbCatIcon(id) {
      const m = HEART_CAT_META[id];
      return m ? m.icon : "·";
    }

    function hbMediaUrl(postId, filename) {
      return (
        "/api/heart/media/" +
        encodeURIComponent(postId) +
        "/" +
        encodeURIComponent(filename)
      );
    }

    function hbIsVideoFile(f) {
      if (!f) return false;
      const t = (f.type || "").toLowerCase();
      const n = (f.name || "").toLowerCase();
      return t.startsWith("video/") || /\.(mp4|webm|mov)$/.test(n);
    }

    function hbIsImageFile(f) {
      if (!f) return false;
      const t = (f.type || "").toLowerCase();
      const n = (f.name || "").toLowerCase();
      return t.startsWith("image/") || /\.(jpe?g|png|webp|gif)$/.test(n);
    }

    function syncHeartHeader() {
      const titleEl = document.getElementById("headerTitle");
      if (!titleEl) return;
      // Only update when heart view is active
      const heartView = document.getElementById("view-heart");
      if (!heartView || !heartView.classList.contains("active")) return;

      // Keep header title empty in Heart (no glyph / label next to back)
      titleEl.textContent = "";
    }

    function hbShowLevel(level) {
      hbLevel = level;
      const cats = document.getElementById("hbLevelCats");
      const posts = document.getElementById("hbLevelPosts");
      const detail = document.getElementById("hbLevelDetail");
      if (cats) cats.classList.toggle("hidden", level !== "cats");
      if (posts) posts.classList.toggle("hidden", level !== "posts");
      if (detail) detail.classList.toggle("hidden", level !== "detail");
      syncHeartHeader();
      window.scrollTo(0, 0);
    }

    async function ensureHeartBrowser() {
      bindHeartBrowserHandlers();
      if (hbCatalog || hbLoading) {
        if (hbCatalog) renderHbCurrent();
        return;
      }
      hbLoading = true;
      const catList = document.getElementById("hbCatList");
      if (catList) {
        catList.innerHTML = `<div class="hb-empty">Loading collection…</div>`;
      }
      try {
        const r = await fetch("/api/heart/catalog");
        if (!r.ok) throw new Error("Failed to load catalog");
        hbCatalog = await r.json();
      } catch (e) {
        if (catList) {
          catList.innerHTML = `<div class="hb-empty">Could not load posts.<br/>${escapeHtml(String(e.message || e))}</div>`;
        }
        hbLoading = false;
        return;
      }
      hbLoading = false;
      renderHbCurrent();
    }

    function renderHbCurrent() {
      if (!hbCatalog) return;
      if (hbLevel === "detail" && hbPostId) {
        renderHbDetail(hbPostId);
        return;
      }
      if (hbLevel === "posts" && hbCategory) {
        renderHbPosts();
        return;
      }
      renderHbCategories();
    }

    function hbPostsMatchingSearch(posts, q) {
      const needle = (q || "").trim().toLowerCase();
      if (!needle) return posts;
      return posts.filter((p) => {
        const hay = [
          p.title,
          p.summary,
          p.category,
          p.content_type,
          ...(p.tags || []),
          ...(p.suggested_tags || []),
          ...(p.keywords || []),
          ...(p.locations || []),
          ...(p.primary_subjects || []),
          ...(p.people || []),
          ...(p.brands || []),
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return hay.includes(needle);
      });
    }

    function renderHbCategories() {
      hbShowLevel("cats");
      const posts = hbCatalog.posts || [];
      const filtered = hbPostsMatchingSearch(posts, hbSearch);
      const statsCount = document.getElementById("hbStatsCount");
      const statsLabel = document.getElementById("hbStatsLabel");
      if (statsCount) statsCount.textContent = String(filtered.length);
      if (statsLabel) {
        statsLabel.textContent = hbSearch.trim()
          ? "matches"
          : `analyzed · ${hbCatalog.analyzed || 0} of ${hbCatalog.total || 0}`;
      }

      // Build category counts from filtered posts
      const counts = {};
      filtered.forEach((p) => {
        const c = p.category || "other";
        counts[c] = (counts[c] || 0) + 1;
      });

      // Prefer catalog order, then any extras
      const order = (hbCatalog.categories || []).map((c) => c.id);
      Object.keys(counts).forEach((c) => {
        if (!order.includes(c)) order.push(c);
      });

      const list = document.getElementById("hbCatList");
      if (!list) return;

      if (!filtered.length) {
        list.innerHTML = `<div class="hb-empty">${hbSearch.trim() ? "No posts match that search." : "No analyzed posts yet."}</div>`;
        return;
      }

      const rows = order
        .filter((id) => counts[id])
        .map((id) => {
          const n = counts[id];
          const catInfo = (hbCatalog.categories || []).find((c) => c.id === id);
          const topTags = ((catInfo && catInfo.tags) || [])
            .slice(0, 3)
            .map((t) => t.id)
            .join(" · ");
          return (
            `<button type="button" class="hb-cat" data-cat="${escapeHtml(id)}" role="listitem">` +
            `<span class="hb-cat-icon" aria-hidden="true">${hbCatIcon(id)}</span>` +
            `<span class="hb-cat-body">` +
            `<span class="hb-cat-name">${escapeHtml(hbCatLabel(id))}</span>` +
            `<span class="hb-cat-sub">${escapeHtml(topTags || n + " post" + (n === 1 ? "" : "s"))}</span>` +
            `</span>` +
            `<span class="hb-cat-count">${n}</span>` +
            `<span class="hb-cat-chev" aria-hidden="true">›</span>` +
            `</button>`
          );
        });
      list.innerHTML = rows.join("");
    }

    function openHbCategory(catId) {
      hbCategory = catId;
      hbTag = null;
      hbPostId = null;
      renderHbPosts();
    }

    function renderHbPosts() {
      if (!hbCatalog || !hbCategory) {
        renderHbCategories();
        return;
      }
      hbShowLevel("posts");

      let posts = (hbCatalog.posts || []).filter(
        (p) => (p.category || "other") === hbCategory
      );
      posts = hbPostsMatchingSearch(posts, hbSearch);
      if (hbTag) {
        posts = posts.filter((p) => (p.tags || []).includes(hbTag));
      }

      // Tags for this category (from catalog, only those still present after search)
      const catInfo = (hbCatalog.categories || []).find((c) => c.id === hbCategory);
      const tagCounts = {};
      posts.forEach((p) => {
        (p.tags || []).forEach((t) => {
          tagCounts[t] = (tagCounts[t] || 0) + 1;
        });
      });
      // Prefer catalog tag order
      const orderedTags = [];
      if (catInfo && catInfo.tags) {
        catInfo.tags.forEach((t) => {
          if (tagCounts[t.id]) orderedTags.push(t.id);
        });
      }
      Object.keys(tagCounts)
        .sort((a, b) => tagCounts[b] - tagCounts[a] || a.localeCompare(b))
        .forEach((t) => {
          if (!orderedTags.includes(t)) orderedTags.push(t);
        });

      const tagsEl = document.getElementById("hbTags");
      if (tagsEl) {
        const chips = [
          `<button type="button" class="hb-tag${hbTag ? "" : " active"}" data-tag="">All</button>`,
        ];
        orderedTags.forEach((t) => {
          chips.push(
            `<button type="button" class="hb-tag${hbTag === t ? " active" : ""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)} <span style="opacity:.65">${tagCounts[t] || 0}</span></button>`
          );
        });
        tagsEl.innerHTML = chips.join("");
      }

      const meta = document.getElementById("hbFilterMeta");
      if (meta) {
        const parts = [`${posts.length} post${posts.length === 1 ? "" : "s"}`];
        if (hbTag) parts.push(`tag · ${hbTag}`);
        if (hbSearch.trim()) parts.push(`search · “${hbSearch.trim()}”`);
        meta.textContent = parts.join("  ·  ");
      }

      const grid = document.getElementById("hbPostGrid");
      if (!grid) return;
      if (!posts.length) {
        grid.innerHTML = `<div class="hb-empty" style="grid-column:1/-1">Nothing here yet.</div>`;
        return;
      }

      grid.innerHTML = posts
        .map((p) => {
          const mediaInner = p.thumb
            ? hbIsVideoFile({ name: p.thumb, type: "" }) && !p.has_image
              ? `<video src="${escapeHtml(hbMediaUrl(p.id, p.thumb))}" muted playsinline preload="metadata"></video>`
              : `<img src="${escapeHtml(hbMediaUrl(p.id, p.thumb))}" alt="" loading="lazy" decoding="async" />`
            : `<div class="hb-card-ph">♥</div>`;
          const badges = [];
          if (p.has_video) badges.push(`<span class="hb-badge">Video</span>`);
          if (p.file_count > 1) badges.push(`<span class="hb-badge">${p.file_count}</span>`);
          const sub = (p.tags || []).slice(0, 2).join(" · ") || p.content_type || "";
          return (
            `<button type="button" class="hb-card" data-post="${escapeHtml(p.id)}" role="listitem">` +
            `<div class="hb-card-media">${mediaInner}` +
            (badges.length
              ? `<div class="hb-card-badges">${badges.join("")}</div>`
              : "") +
            `</div>` +
            `<div class="hb-card-body">` +
            `<div class="hb-card-title">${escapeHtml(p.title || p.id)}</div>` +
            (sub ? `<div class="hb-card-sub">${escapeHtml(sub)}</div>` : "") +
            `</div></button>`
          );
        })
        .join("");
    }

    function hbFindPost(id) {
      if (!hbCatalog || !id) return null;
      return (hbCatalog.posts || []).find((p) => p.id === id) || null;
    }

    function openHbPost(postId) {
      hbPostId = postId;
      renderHbDetail(postId);
    }

    function renderHbDetail(postId) {
      const p = hbFindPost(postId);
      const root = document.getElementById("hbDetail");
      if (!root) return;
      if (!p) {
        root.innerHTML = `<div class="hb-empty">Post not found.</div>`;
        hbShowLevel("detail");
        return;
      }
      hbShowLevel("detail");

      const thumbFile = p.thumb
        ? (p.files || []).find((f) => f.name === p.thumb) || { name: p.thumb, type: "" }
        : (p.files || [])[0];
      let hero = `<div class="hb-card-ph" style="min-height:200px">♥</div>`;
      if (thumbFile) {
        const url = hbMediaUrl(p.id, thumbFile.name);
        if (hbIsVideoFile(thumbFile)) {
          hero = `<video src="${escapeHtml(url)}" muted playsinline preload="metadata" controls></video>`;
        } else {
          hero = `<img src="${escapeHtml(url)}" alt="" />`;
        }
      }

      const tags = (p.tags || [])
        .map((t) => `<span class="hb-chip">${escapeHtml(t)}</span>`)
        .join("");
      const suggested = (p.suggested_tags || [])
        .filter((t) => !(p.tags || []).includes(t))
        .slice(0, 8)
        .map((t) => `<span class="hb-chip muted">${escapeHtml(t)}</span>`)
        .join("");

      const metaRows = [];
      const addRow = (k, v) => {
        if (v == null || v === "" || (Array.isArray(v) && !v.length)) return;
        const text = Array.isArray(v) ? v.join(", ") : String(v);
        metaRows.push(
          `<div class="hb-meta-row"><div class="hb-meta-k">${escapeHtml(k)}</div>` +
            `<div class="hb-meta-v">${escapeHtml(text)}</div></div>`
        );
      };
      addRow("Type", p.content_type);
      addRow("Subjects", p.primary_subjects);
      addRow("Also", p.secondary_subjects);
      addRow("Places", p.locations);
      addRow("People", p.people);

    function closeHbMedia() {
      const viewer = document.getElementById("hbMediaViewer");
      if (viewer) viewer.classList.add("hidden");
      const stage = document.getElementById("hbMediaStage");

    function renderHbMediaSlide() {
      const p = hbFindPost(hbPostId);
      const stage = document.getElementById("hbMediaStage");
      const counter = document.getElementById("hbMediaCounter");
      const prev = document.getElementById("hbMediaPrev");
      const next = document.getElementById("hbMediaNext");
      if (!p || !stage) return;
      const files = p.files || [];
      if (!files.length) {
        stage.innerHTML = `<div class="hb-empty">No media</div>`;
        return;
      }
      hbMediaIndex = Math.max(0, Math.min(hbMediaIndex, files.length - 1));
      const f = files[hbMediaIndex];
      const url = hbMediaUrl(p.id, f.name);
      if (hbIsVideoFile(f)) {
        stage.innerHTML = `<video src="${escapeHtml(url)}" controls playsinline autoplay></video>`;
      } else {
        stage.innerHTML = `<img src="${escapeHtml(url)}" alt="" />`;
      }
      if (counter) counter.textContent = `${hbMediaIndex + 1} / ${files.length}`;
      if (prev) prev.disabled = hbMediaIndex <= 0;
      if (next) next.disabled = hbMediaIndex >= files.length - 1;
    }

    function hbMediaStep(delta) {
      const p = hbFindPost(hbPostId);
      if (!p) return;
      const n = (p.files || []).length;
      if (!n) return;
      hbMediaIndex = Math.max(0, Math.min(n - 1, hbMediaIndex + delta));
      renderHbMediaSlide();
    }

      if (closeBtn) closeBtn.addEventListener("click", closeHbMedia);
      if (prevBtn) prevBtn.addEventListener("click", () => hbMediaStep(-1));
      if (nextBtn) nextBtn.addEventListener("click", () => hbMediaStep(1));

      // Swipe on media stage (basic)
      const stage = document.getElementById("hbMediaStage");
      if (stage) {
        let touchX = null;
        stage.addEventListener(
          "touchstart",
          (e) => {
            if (e.changedTouches && e.changedTouches[0]) {
              touchX = e.changedTouches[0].clientX;
            }
          },
          { passive: true }
        );
        stage.addEventListener(
          "touchend",
          (e) => {
            if (touchX == null || !e.changedTouches || !e.changedTouches[0]) return;
            const dx = e.changedTouches[0].clientX - touchX;
            touchX = null;
            if (Math.abs(dx) < 48) return;
            if (dx < 0) hbMediaStep(1);
            else hbMediaStep(-1);
          },
          { passive: true }
        );
      }
    }

    async function startFinanceVoice() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setFvStatus("Mic not available.", "err");
        return;
      }
      if (!window.isSecureContext) {
        setFvStatus("Needs HTTPS for mic.", "err");
        return;
      }
      try {
        fvStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
          },
        });
      } catch (e) {
        setFvStatus("Mic denied: " + (e.message || e), "err");
        return;
      }
      const mime = typeof pickMimeType === "function" ? pickMimeType() : "";
      fvMime = mime || "audio/webm";
      fvChunks = [];
      fvBlob = null;
      const options = { audioBitsPerSecond: 128000 };
      if (mime) options.mimeType = mime;
      try {
        fvRecorder = new MediaRecorder(fvStream, options);
      } catch (_) {
        try {
          fvRecorder = new MediaRecorder(
            fvStream,
            mime ? { mimeType: mime } : {}
          );
        } catch (__) {
          fvRecorder = new MediaRecorder(fvStream);
        }
      }
      fvRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) fvChunks.push(ev.data);
      };
      fvRecorder.start(1000);
      fvState = "recording";
      fvStartedAt = Date.now();
      fvElapsed = 0;
      clearFvTimer();
      const timerEl = document.getElementById("fvTimer");
      fvTimerInterval = setInterval(() => {
        const live = fvState === "recording" ? Date.now() - fvStartedAt : 0;
        if (timerEl) {
          timerEl.textContent =
            typeof formatTime === "function"
              ? formatTime(fvElapsed + live)
              : "00:00";
        }
      }, 200);
      setFvStatus("Recording…");
      updateFvButtons();
    }

    function stopFinanceVoice() {
      return new Promise((resolve) => {
        clearFvTimer();
        if (!fvRecorder || fvRecorder.state === "inactive") {
          if (fvBlob && fvBlob.size > 0) fvState = "ready";
          else fvState = "idle";
          updateFvButtons();
          resolve(fvBlob);
          return;
        }
        if (fvState === "recording") {
          fvElapsed += Date.now() - fvStartedAt;
        }
        const mr = fvRecorder;
        const finish = () => {
          fvBlob = new Blob(fvChunks, { type: mr.mimeType || fvMime });
          fvMime = fvBlob.type || fvMime;
          stopFvTracks();
          fvRecorder = null;
          fvState = fvBlob && fvBlob.size > 0 ? "ready" : "idle";
          const timerEl = document.getElementById("fvTimer");
          if (timerEl && typeof formatTime === "function") {
            timerEl.textContent = formatTime(fvElapsed);
          }
          setFvStatus(fvState === "ready" ? "Ready to send" : "");
          updateFvButtons();
          resolve(fvBlob);
        };
        mr.addEventListener("stop", finish, { once: true });
        try {
          if (mr.state === "recording" || mr.state === "paused") {
            try {
              if (mr.state === "recording") mr.requestData();
            } catch (_) {}
            mr.stop();
          } else {
            finish();
          }
        } catch (_) {
          finish();
        }
      });
    }

    async function sendFinanceVoice() {
      if (fvState === "sending") return;
      if (fvState === "recording") {
        await stopFinanceVoice();
      }
      if (!fvBlob || !fvBlob.size) {
        setFvStatus("Nothing to send.", "err");
        return;
      }
      fvState = "sending";
      updateFvButtons();
      setFvStatus("Transcribing + ledger…", "warn");
      setFvProgress(true, 8);

      const settings =
        typeof getSettings === "function"
          ? getSettings()
          : { model: "medium", translate: false };
      const form = new FormData();
      const ext =
        typeof extForMime === "function" ? extForMime(fvMime) : "webm";
      form.append("audio", fvBlob, `finance-voice.${ext}`);
      form.append("title", "");
      form.append("model", settings.model || "medium");
      form.append("translate", settings.translate ? "true" : "false");
      form.append("update_ledger", "true");
      form.append(
        "client_id",
        localStorage.getItem("client_id") ||
          (localStorage.client_id = crypto.randomUUID())
      );

      try {
        const note = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/notes");
          xhr.responseType = "json";
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) {
              setFvProgress(
                true,
                Math.max(8, Math.round((ev.loaded / ev.total) * 70))
              );
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
            else {
              const detail =
                (xhr.response &&
                  (xhr.response.detail || xhr.response.message)) ||
                xhr.statusText;
              reject(
                new Error(
                  typeof detail === "string" ? detail : "Upload failed"
                )
              );
            }
          };
          xhr.onerror = () => reject(new Error("Network error"));
          xhr.send(form);
        });

        setFvProgress(true, 100);
        const fin = note && note.finance;
        if (fin && fin.ok && Array.isArray(fin.entries) && fin.entries.length) {
          const e0 = fin.entries[0];
          const sheetRow =
            e0.sheet && e0.sheet.ok ? Number(e0.sheet.row) : null;
          const msg =
            "AI · " +
            formatRupee(e0.amount) +
            " · " +
            (e0.category || "") +
            (sheetRow ? " · row " + sheetRow : "");
          const dashBody = document.getElementById("financeDashBody");
          if (dashBody) delete dashBody.dataset.loaded;
          setFinanceVoiceOpen(false);
          openThisMonthTransactions(sheetRow);
          setFinStatus(msg, "ok");
        } else {
          setFvStatus(
            "Ledger: " + ((fin && fin.error) || "no entry"),
            "err"
          );
          fvState = "ready";
          updateFvButtons();
          setFvProgress(false, 0);
        }
      } catch (e) {
        setFvStatus("Failed: " + (e.message || e), "err");
        fvState = "ready";
        updateFvButtons();
        setFvProgress(false, 0);
      }
    }

    function addFrFiles(fileList) {
      const files = Array.from(fileList || []).filter(
        (f) => f && f.type && f.type.startsWith("image/")
      );
      for (const file of files) {
        if (frImages.length >= FR_MAX_IMAGES) break;
        const id =
          (crypto.randomUUID && crypto.randomUUID()) ||
          String(Date.now()) + Math.random().toString(16).slice(2);
        frImages.push({
          id,
          file,
          url: URL.createObjectURL(file),
        });
      }
      renderFrGrid();
    }

    function removeFrImage(id) {
      const idx = frImages.findIndex((x) => x.id === id);
      if (idx < 0) return;
      try {
        URL.revokeObjectURL(frImages[idx].url);
      } catch (_) {}
      frImages.splice(idx, 1);
      renderFrGrid();
    }

    function stopFrRecording(keepBlob) {
      if (frMediaRecorder && frMediaRecorder.state !== "inactive") {
        try {
          frMediaRecorder.stop();
        } catch (_) {}
      }
      if (frMediaStream) {
        try {
          frMediaStream.getTracks().forEach((t) => t.stop());
        } catch (_) {}
      }
      frMediaRecorder = null;
      frMediaStream = null;
      frRecordChunks = [];
      frRecording = false;
      if (!keepBlob) {
        // leave existing frVoiceBlob unless explicitly clearing
      }
      updateFrVoiceDot();
    }

    async function toggleFrVoiceNote() {
      if (frRecording) {
        // stop → blob kept via onstop
        if (frMediaRecorder && frMediaRecorder.state !== "inactive") {
          frMediaRecorder.stop();
        }
        return;
      }
      // New recording replaces previous voice note
      frVoiceBlob = null;
      updateFrVoiceDot();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        frMediaStream = stream;
        frRecordChunks = [];
        let mime = "";
        if (window.MediaRecorder) {
          if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
            mime = "audio/webm;codecs=opus";
            frVoiceExt = "webm";
          } else if (MediaRecorder.isTypeSupported("audio/webm")) {
            mime = "audio/webm";
            frVoiceExt = "webm";
          } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
            mime = "audio/mp4";
            frVoiceExt = "m4a";
          }
        }
        const rec = mime
          ? new MediaRecorder(stream, { mimeType: mime })
          : new MediaRecorder(stream);
        frMediaRecorder = rec;
        rec.ondataavailable = (ev) => {
          if (ev.data && ev.data.size) frRecordChunks.push(ev.data);
        };
        rec.onstop = () => {
          const type = rec.mimeType || mime || "audio/webm";
          if (frRecordChunks.length) {
            frVoiceBlob = new Blob(frRecordChunks, { type });
          }
          if (frMediaStream) {
            try {
              frMediaStream.getTracks().forEach((t) => t.stop());
            } catch (_) {}
          }
          frMediaStream = null;
          frMediaRecorder = null;
          frRecordChunks = [];
          frRecording = false;
          updateFrVoiceDot();
          if (frVoiceBlob) setFrStatus("Voice note ready", "ok");
        };
        rec.start();
        frRecording = true;
        updateFrVoiceDot();
        setFrStatus("Listening…", "warn");
      } catch (e) {
        setFrStatus(e.message || "Mic blocked", "err");
        stopFrRecording(false);
      }
    }

    async function submitReceipt() {
      if (frRecording) {
        setFrStatus("Stop voice note first", "err");
        return;
      }
      if (!frImages.length) {
        setFrStatus("Add a photo", "err");
        return;
      }
      const note = (document.getElementById("frNote")?.value || "").trim();
      const btn = document.getElementById("frSend");
      if (btn) btn.disabled = true;
      setFrStatus("Updating…", "warn");

      const form = new FormData();
      for (const item of frImages) {
        form.append("images", item.file, item.file.name || "photo.jpg");
      }
      form.append("note", note);
      form.append("save", "true");
      if (frVoiceBlob) {
        form.append("audio", frVoiceBlob, `voice.${frVoiceExt}`);
        const settings = typeof getSettings === "function" ? getSettings() : null;
        if (settings) {
          form.append("model", settings.model || "medium");
          form.append("translate", settings.translate ? "true" : "false");
        }
      }

      try {
        const r = await fetch("/api/finance/receipt", {
          method: "POST",
          body: form,
        });
        let data = null;
        try {
          data = await r.json();
        } catch (_) {
          data = null;
        }
        if (!r.ok) {
          const detail =
            (data && (data.detail || data.error || data.message)) ||
            `HTTP ${r.status}`;
          throw new Error(
            typeof detail === "string" ? detail : JSON.stringify(detail)
          );
        }
        if (data && data.ok && Array.isArray(data.entries) && data.entries.length) {
          const e0 = data.entries[0];
          const sheetRow =
            e0.sheet && e0.sheet.ok ? Number(e0.sheet.row) : null;
          const msg =
            formatRupee(e0.amount) +
            " · " +
            (e0.category || "") +
            (e0.notes ? " · " + String(e0.notes).slice(0, 48) : "") +
            (sheetRow ? " · row " + sheetRow : "");
          resetReceiptPanel();
          setFinanceReceiptOpen(false);
          // Open this month's transactions so the new Ledger row is visible
          openThisMonthTransactions(sheetRow);
          setFinStatus(msg, "ok");
          setFrStatus("");
        } else {
          setFrStatus((data && data.error) || "No entry", "err");
        }
      } catch (e) {
        setFrStatus(e.message || "Failed", "err");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function shiftFinanceTxMonth(delta) {
      let y = financeTxYear;
      let m = financeTxMonth;
      if (y == null || m == null) {
        const now = new Date();
        y = now.getFullYear();
        m = now.getMonth() + 1;
      }
      m += delta;
      while (m < 1) {
        m += 12;
        y -= 1;
      }
      while (m > 12) {
        m -= 12;
        y += 1;
      }
      // Soft bounds
      if (y < 2000 || y > 2100) return;
      financeTxYear = y;
      financeTxMonth = m;
      loadFinanceTransactions();
    }

    function formatUsd(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const v = Number(n);
      if (v === 0) return "$0.00";
      // DeepSeek micro-costs are often $0.0000x–$0.00x; keep enough digits.
      if (v < 0.01) return `$${v.toFixed(6)}`;
      if (v < 1) return `$${v.toFixed(4)}`;
      return `$${v.toFixed(2)}`;
    }

    function formatTokens(n) {
      if (n == null || n === "") return "—";
      const v = Number(n);
      if (Number.isNaN(v)) return "—";
      if (v >= 1000) return `${(v / 1000).toFixed(v >= 10000 ? 0 : 1)}k`;
      return String(v);
    }

    function formatAiTime(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso).slice(0, 16);
        return d.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      } catch {
        return String(iso).slice(0, 16);
      }
    }

    function moduleActionLabel(call) {
      const mod = (call.module || "").trim();
      const act = (call.action || "").trim();
      if (mod && act) {
        // "finance" + "Ledger update" → "Finance · Ledger update"
        const m = mod.charAt(0).toUpperCase() + mod.slice(1);
        return `${m} · ${act}`;
      }
      return act || mod || "API call";
    }

    async function loadAiUsage() {
      const listEl = document.getElementById("aiCallList");
      const totalEl = document.getElementById("aiCostTotal");
      const metaEl = document.getElementById("aiCostMeta");
      if (listEl) listEl.innerHTML = `<div class="empty">…</div>`;
      try {
        const r = await fetch("/api/ai/usage?limit=100");
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const totals = data.totals || {};
        if (totalEl) totalEl.textContent = formatUsd(totals.cost_usd || 0);
        if (metaEl) {
          const n = totals.calls || 0;
          const tok =
            (totals.prompt_tokens || 0) + (totals.completion_tokens || 0);
          metaEl.textContent =
            n === 0
              ? "0 calls"
              : `${n} call${n === 1 ? "" : "s"} · ${formatTokens(tok)} tok`;
        }
        const calls = data.calls || [];
        if (!listEl) return;
        if (!calls.length) {
          listEl.innerHTML = `<div class="empty">No API calls yet</div>`;
          return;
        }
        listEl.innerHTML = calls
          .map((c) => {
            const fail = c.ok === false;
            const cost =
              c.cost_usd != null
                ? formatUsd(c.cost_usd)
                : fail
                  ? "fail"
                  : "—";
            const model = escapeHtml(c.model || "—");
            const title = escapeHtml(moduleActionLabel(c));
            const tok = `${formatTokens(c.prompt_tokens)} in · ${formatTokens(
              c.completion_tokens
            )} out`;
            const when = escapeHtml(formatAiTime(c.ts));
            return (
              `<div class="ai-row${fail ? " fail" : ""}">` +
              `<div class="ai-row-top">` +
              `<div class="ai-row-title">${title}</div>` +
              `<div class="ai-row-cost">${escapeHtml(cost)}</div>` +
              `</div>` +
              `<div class="ai-row-sub">` +
              `<span>${model} · ${escapeHtml(tok)}</span>` +
              `<span>${when}</span>` +
              `</div>` +
              `</div>`
            );
          })
          .join("");
      } catch (e) {
        if (totalEl) totalEl.textContent = "—";
        if (metaEl) metaEl.textContent = "error";
        if (listEl) {
          listEl.innerHTML = `<div class="empty">${escapeHtml(
            e.message || "Failed to load"
          )}</div>`;
        }
      }
    }

    /* ------------------------------------------------------------------ */
    /* ChatGPT queue alerts (sound + vibrate + Android heads-up)            */
    /* ------------------------------------------------------------------ */
    const QUEUE_NOTIFY_KEY = "queue_last_notified_id";
    const QUEUE_PUSH_KEY = "queue_push_ok";
    const queueKindLabel = {
      halt: "Upload / halt",
      rate_limit: "Rate limit",
      batch_finished: "Batch finished",
    };
    let queueAudioCtx = null;
    let queueToastTimer = 0;
    let queueSwReg = null;
    let queuePushReady = false;
    try { queuePushReady = localStorage.getItem(QUEUE_PUSH_KEY) === "1"; } catch (_) {}

    function queueUrlB64ToUint8(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }

    function unlockQueueAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!queueAudioCtx) queueAudioCtx = new AC();
      if (queueAudioCtx.state === "suspended") queueAudioCtx.resume();
    }

    function playQueueBeep() {
      unlockQueueAudio();
      if (!queueAudioCtx) return;
      const now = queueAudioCtx.currentTime;
      const tones = [880, 1174];
      tones.forEach((freq, i) => {
        const osc = queueAudioCtx.createOscillator();
        const gain = queueAudioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02 + i * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18 + i * 0.16);
        osc.connect(gain);
        gain.connect(queueAudioCtx.destination);
        osc.start(now + i * 0.16);
        osc.stop(now + 0.2 + i * 0.16);
      });
    }

    function vibrateQueue() {
      try {
        if (navigator.vibrate) navigator.vibrate([240, 120, 240, 120, 480]);
      } catch (_) {
        /* ignore */
      }
    }

    function showQueueToast(alert) {
      const toast = document.getElementById("queueToast");
      if (!toast || !alert) return;
      toast.hidden = false;
      toast.classList.add("show");
      toast.classList.remove("kind-halt", "kind-rate_limit", "kind-batch_finished");
      toast.classList.add("kind-" + (alert.kind || "halt"));
      const kicker = document.getElementById("queueToastKicker");
      const title = document.getElementById("queueToastTitle");
      const msg = document.getElementById("queueToastMsg");
      if (kicker) kicker.textContent = queueKindLabel[alert.kind] || "Queue";
      if (title) title.textContent = alert.title || "ChatGPT queue";
      if (msg) msg.textContent = alert.message || "";
      if (queueToastTimer) clearTimeout(queueToastTimer);
      queueToastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
        toast.hidden = true;
      }, 12000);
    }

    function markQueueNotified(id) {
      if (!id) return false;
      let last = "";
      try { last = localStorage.getItem(QUEUE_NOTIFY_KEY) || ""; } catch (_) {}
      if (last === id) return false;
      try { localStorage.setItem(QUEUE_NOTIFY_KEY, id); } catch (_) {}
      return true;
    }

    async function showQueueSystemNote(alert) {
      if (!alert) return;
      const payload = {
        type: "SHOW",
        title: alert.title || "ChatGPT queue",
        body: alert.message || "",
        message: alert.message || "",
        kind: alert.kind || "",
        id: alert.id || "",
      };
      if (queueSwReg && queueSwReg.active) {
        queueSwReg.active.postMessage(payload);
        return;
      }
      if (queueSwReg && queueSwReg.showNotification) {
        try {
          await queueSwReg.showNotification(payload.title, {
            body: payload.body,
            tag: "chatgpt-queue",
            renotify: true,
            silent: false,
            vibrate: [240, 120, 240, 120, 480],
            requireInteraction: true,
          });
        } catch (_) {
          /* Android needs the SW path above */
        }
      }
    }

    function punchQueueAlert(alert, { sensory } = { sensory: true }) {
      if (!alert) return;
      renderQueueBanner({ unread: [alert], batch: null });
      showQueueToast(alert);
      if (sensory && markQueueNotified(alert.id)) {
        vibrateQueue();
        playQueueBeep();
        showQueueSystemNote(alert);
      }
    }

    function syncQueueEnableChip() {
      const chip = document.getElementById("queueEnableAlerts");
      if (!chip) return;
      const granted =
        typeof Notification !== "undefined" && Notification.permission === "granted";
      if (granted && queuePushReady) {

        chip.classList.add("on");

    function renderQueueBanner(payload) {
      const banner = document.getElementById("queueBanner");
      if (!banner) return;
      const unread = payload && Array.isArray(payload.unread) ? payload.unread : [];
      const batch = payload && payload.batch ? payload.batch : null;
      let alert = unread[0] || null;
      if (!alert && batch && batch.halted) {
        alert = {
          id: "live-halt",
          kind: "halt",
          title: "ChatGPT queue — halted",
          message: batch.haltReason || "Upload / file limit",
        };
      }
      if (!alert) {
        banner.hidden = true;
        banner.classList.remove("show", "kind-halt", "kind-rate_limit", "kind-batch_finished");
        return;
      }
      banner.hidden = false;
      banner.classList.add("show");
      banner.classList.remove("kind-halt", "kind-rate_limit", "kind-batch_finished");
      banner.classList.add("kind-" + (alert.kind || "halt"));
      banner.dataset.id = alert.id || "";
      const kicker = document.getElementById("queueBannerKicker");
      const title = document.getElementById("queueBannerTitle");
      const msg = document.getElementById("queueBannerMsg");
      if (kicker) kicker.textContent = queueKindLabel[alert.kind] || "Queue";
      if (title) title.textContent = alert.title || "ChatGPT queue";
      if (msg) msg.textContent = alert.message || "";
    }

    async function refreshQueueAlerts({ announce } = { announce: false }) {
      try {
        const [alertsRes, statusRes] = await Promise.all([
          fetch("/api/queue/alerts?limit=10"),
          fetch("/api/queue/status"),
        ]);
        const alerts = alertsRes.ok ? await alertsRes.json() : { unread: [] };
        const status = statusRes.ok ? await statusRes.json() : {};
        const unread = alerts.unread || [];

    async function subscribeQueuePush() {
      const reg = await ensureQueueServiceWorker();
      if (!reg || !reg.pushManager) throw new Error("Push not available in this browser");
      const vapidRes = await fetch("/api/queue/vapid");
      const vapid = await vapidRes.json();
      if (!vapid.publicKey) throw new Error("No VAPID key");
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: queueUrlB64ToUint8(vapid.publicKey),
        });
      }
      const raw = sub.toJSON();
      await fetch("/api/queue/push-sub", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          endpoint: raw.endpoint,
          keys: raw.keys,
        }),

      queuePushReady = true;

    /* ------------------------------------------------------------------ */
    /* IndexedDB draft backup                                               */
    /* ------------------------------------------------------------------ */
    const DB_NAME = "audio-notes-drafts";
    const DB_STORE = "chunks";

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveDraftIdb(id, mimeType, blobs) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put({
          id,
          mimeType,
          blobs,
          updatedAt: Date.now(),
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function clearDraftIdb(id) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /* ------------------------------------------------------------------ */
    /* Recorder                                                             */
    /* ------------------------------------------------------------------ */
    const recBtn = document.getElementById("recBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const draftBtn = document.getElementById("draftBtn");
    const sendBtn = document.getElementById("sendBtn");
    const discardBtn = document.getElementById("discardBtn");
    const timerEl = document.getElementById("timer");
    const recStatus = document.getElementById("recStatus");
    const levelBar = document.getElementById("levelBar");
    const uploadProgress = document.getElementById("uploadProgress");
    const uploadProgressBar = document.getElementById("uploadProgressBar");
    const draftsPill = document.getElementById("draftsPill");
    const draftsCountEl = document.getElementById("draftsCount");
    const draftsPlural = document.getElementById("draftsPlural");

    let mediaStream = null;
    let mediaRecorder = null;
    let audioContext = null;
    let analyser = null;
    let rafId = 0;
    let chunks = [];
    let draftId = null;
    let recordedBlob = null;
    let recordedMime = "audio/webm";
    /** @type {'idle'|'recording'|'paused'|'ready'|'sending'} */
    let state = "idle";
    let startedAt = 0;
    let elapsedBeforePause = 0;
    let timerInterval = 0;
    /** Saved thought chunks (Blobs) waiting to be sent */
    let sessionDrafts = [];

    function setStatus(text, kind = "") {
      recStatus.textContent = text || "";
      recStatus.className = "status-line" + (kind ? " " + kind : "");
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
    }

    function updateBodyState() {
      document.body.classList.toggle("is-recording", state === "recording");
      document.body.classList.toggle("is-paused", state === "paused");
    }

    function updateDraftsPill() {
      const n = sessionDrafts.length + (recordedBlob && recordedBlob.size > 0 ? 1 : 0);
      const saved = sessionDrafts.length;
      if (saved > 0) {
        draftsPill.classList.add("visible");
        draftsCountEl.textContent = String(saved);
        draftsPlural.textContent = saved === 1 ? "" : "s";
      } else {
        draftsPill.classList.remove("visible");
      }
    }

    function updateActionButtons() {
      const hasLive = state === "recording" || state === "paused";
      const hasBlob = !!(recordedBlob && recordedBlob.size > 0);
      const hasDrafts = sessionDrafts.length > 0;
      const busy = state === "sending";

      recBtn.disabled = busy;
      pauseBtn.disabled = busy || !hasLive;
      pauseBtn.textContent = state === "paused" ? "Resume" : "Pause";

      // Save draft when actively recording/paused OR when a take is ready
      draftBtn.disabled = busy || !(hasLive || hasBlob);
      // Send if anything to send (live session, finished take, or saved drafts)
      sendBtn.disabled = busy || !(hasLive || hasBlob || hasDrafts);
      discardBtn.disabled = busy || !(hasLive || hasBlob || hasDrafts);

      if (state === "recording") {
        recBtn.classList.add("recording");
        recBtn.classList.remove("paused");
        recBtn.setAttribute("aria-label", "Stop take");
      } else if (state === "paused") {
        recBtn.classList.add("recording", "paused");
        recBtn.setAttribute("aria-label", "Stop take");
      } else {
        recBtn.classList.remove("recording", "paused");
        recBtn.setAttribute("aria-label", "Start recording");
      }

      updateBodyState();
      updateDraftsPill();
    }

    function pickMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/ogg;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg",
      ];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    function stopLevelMeter() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      levelBar.style.width = "0%";
    }

    function startLevelMeter(stream) {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          if (state !== "recording") {
            levelBar.style.width = "0%";
            rafId = requestAnimationFrame(tick);
            return;
          }
          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            const v = (data[i] - 128) / 128;
            sum += v * v;
          }
          const rms = Math.sqrt(sum / data.length);
          levelBar.style.width = Math.min(100, Math.round(rms * 280)) + "%";
          rafId = requestAnimationFrame(tick);
        };
        tick();
      } catch (_) { /* optional */ }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const live = state === "recording" ? Date.now() - startedAt : 0;
        timerEl.textContent = formatTime(elapsedBeforePause + live);
      }, 200);
    }

    function stopMicTracks() {
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
      }
      stopLevelMeter();
    }

    function finalizeRecorder() {
      return new Promise((resolve) => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
          resolve(recordedBlob);
          return;
        }
        const mr = mediaRecorder;
        const onStop = () => {
          recordedBlob = new Blob(chunks, { type: mr.mimeType || recordedMime });
          recordedMime = recordedBlob.type || recordedMime;
          resolve(recordedBlob);
        };
        mr.addEventListener("stop", onStop, { once: true });
        try {
          if (mr.state === "recording" || mr.state === "paused") {
            try { if (mr.state === "recording") mr.requestData(); } catch (_) {}
            mr.stop();
          } else {
            onStop();
          }
        } catch (_) {
          onStop();
        }
      });
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Mic not available.", "err");
        return;
      }
      if (!window.isSecureContext) {
        setStatus("Needs HTTPS for mic.", "err");
        return;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
            sampleRate: { ideal: 48000 },
          },
        });
      } catch (e) {
        setStatus("Mic denied: " + e.message, "err");
        return;
      }

      const mime = pickMimeType();
      recordedMime = mime || "audio/webm";
      chunks = [];
      draftId = "draft-" + Date.now();
      recordedBlob = null;

      const options = { audioBitsPerSecond: 128000 };
      if (mime) options.mimeType = mime;
      try {
        mediaRecorder = new MediaRecorder(mediaStream, options);
      } catch (_) {
        try {
          mediaRecorder = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : {});
        } catch (__) {
          mediaRecorder = new MediaRecorder(mediaStream);
        }
      }

      mediaRecorder.ondataavailable = async (ev) => {
        if (ev.data && ev.data.size > 0) {
          chunks.push(ev.data);
          try {
            await saveDraftIdb(draftId, recordedMime, chunks.slice());
          } catch (_) { /* best-effort */ }
        }
      };

      mediaRecorder.start(1000);
      state = "recording";
      startedAt = Date.now();
      // keep elapsedBeforePause if continuing after drafts? reset per take
      if (!sessionDrafts.length || elapsedBeforePause === 0) {
        /* first take or fresh */
      }
      // Timer for current take only (session total = drafts aren't timed together)
      if (sessionDrafts.length === 0 && !elapsedBeforePause) {
        elapsedBeforePause = 0;
      }
      startTimer();
      startLevelMeter(mediaStream);
      setStatus("");
      updateActionButtons();
    }

    async function stopTake({ keepState = false } = {}) {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return recordedBlob;
      clearInterval(timerInterval);
      if (state === "recording") {
        elapsedBeforePause += Date.now() - startedAt;
      }
      const blob = await finalizeRecorder();
      stopMicTracks();
      mediaRecorder = null;
      if (!keepState) {
        state = blob && blob.size > 0 ? "ready" : "idle";
        setStatus("");
        updateActionButtons();
      }
      timerEl.textContent = formatTime(elapsedBeforePause);
      return blob;
    }

    function pauseRecording() {
      if (!mediaRecorder || mediaRecorder.state !== "recording") return;
      try {
        mediaRecorder.pause();
      } catch (e) {
        setStatus("Pause not supported.", "err");
        return;
      }
      elapsedBeforePause += Date.now() - startedAt;
      state = "paused";
      setStatus("Paused");
      updateActionButtons();
    }

    function resumeRecording() {
      if (!mediaRecorder || mediaRecorder.state !== "paused") return;
      try {
        mediaRecorder.resume();
      } catch (e) {
        setStatus("Resume failed.", "err");
        return;
      }
      startedAt = Date.now();
      state = "recording";
      setStatus("");
      updateActionButtons();
    }

    recBtn.addEventListener("click", async () => {
      if (state === "sending") return;
      if (state === "recording" || state === "paused") {
        await stopTake();
      } else {
        // Starting a new take after a finished one without saving draft:
        // auto-stash previous blob as draft so nothing is lost
        if (recordedBlob && recordedBlob.size > 0) {
          sessionDrafts.push({ blob: recordedBlob, mime: recordedMime });
          recordedBlob = null;
        }
        elapsedBeforePause = 0;
        timerEl.textContent = "00:00";
        await startRecording();
      }
    });

    pauseBtn.addEventListener("click", () => {
      if (state === "recording") pauseRecording();
      else if (state === "paused") resumeRecording();
    });

    async function stashCurrentAsDraft() {
      if (state === "recording" || state === "paused") {
        await stopTake();
      }
      if (recordedBlob && recordedBlob.size > 0) {
        sessionDrafts.push({ blob: recordedBlob, mime: recordedMime });
        recordedBlob = null;
        chunks = [];
        if (draftId) {
          try { await clearDraftIdb(draftId); } catch (_) {}
          draftId = null;
        }
      }
      state = sessionDrafts.length ? "ready" : "idle";
      updateActionButtons();
      setStatus(sessionDrafts.length ? "Draft saved" : "", sessionDrafts.length ? "ok" : "");
    }

    draftBtn.addEventListener("click", async () => {
      draftBtn.disabled = true;
      await stashCurrentAsDraft();
      // ready for next thought — auto-start optional? User can tap record.
      // Don't auto-start so they control when next thought begins.
    });

    /* ---- Combine multiple takes into one WAV for upload ---- */
    function writeString(view, offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    function encodeWav(buffers, sampleRate) {
      let total = 0;
      for (const b of buffers) total += b.length;
      const pcm = new Float32Array(total);
      let off = 0;
      for (const b of buffers) {
        pcm.set(b, off);
        off += b.length;
      }
      const numChannels = 1;
      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const dataSize = pcm.length * bytesPerSample;
      const buf = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buf);
      writeString(view, 0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, "WAVE");
      writeString(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, "data");
      view.setUint32(40, dataSize, true);
      let idx = 44;
      for (let i = 0; i < pcm.length; i++) {
        const s = Math.max(-1, Math.min(1, pcm[i]));
        view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        idx += 2;
      }
      return new Blob([buf], { type: "audio/wav" });
    }

    function downsample(channelData, fromRate, toRate) {
      if (fromRate === toRate) return channelData;
      const ratio = fromRate / toRate;
      const newLen = Math.round(channelData.length / ratio);
      const result = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(channelData.length, Math.floor((i + 1) * ratio));
        let sum = 0;
        let count = 0;
        for (let j = start; j < end; j++) {
          sum += channelData[j];
          count++;
        }
        result[i] = count ? sum / count : 0;
      }
      return result;
    }

    async function mergeBlobsToWav(parts) {
      if (parts.length === 1) {
        return { blob: parts[0].blob, mime: parts[0].mime || parts[0].blob.type || "audio/webm", ext: null };
      }
      const actx = new (window.AudioContext || window.webkitAudioContext)();
      const targetRate = 16000;
      const monoBuffers = [];
      try {
        for (const part of parts) {
          const ab = await part.blob.arrayBuffer();
          const decoded = await actx.decodeAudioData(ab.slice(0));
          const ch0 = decoded.getChannelData(0);
          // average channels if stereo
          let mono;
          if (decoded.numberOfChannels > 1) {
            mono = new Float32Array(decoded.length);
            for (let c = 0; c < decoded.numberOfChannels; c++) {
              const data = decoded.getChannelData(c);
              for (let i = 0; i < data.length; i++) mono[i] += data[i] / decoded.numberOfChannels;
            }
          } else {
            mono = ch0;
          }
          monoBuffers.push(downsample(mono, decoded.sampleRate, targetRate));
        }
      } finally {
        await actx.close().catch(() => {});
      }
      return { blob: encodeWav(monoBuffers, targetRate), mime: "audio/wav", ext: "wav" };
    }

    function extForMime(mime) {
      if (!mime) return "webm";
      if (mime.includes("wav")) return "wav";
      if (mime.includes("ogg")) return "ogg";
      if (mime.includes("mp4") || mime.includes("m4a") || mime.includes("aac")) return "m4a";
      if (mime.includes("mpeg") || mime.includes("mp3")) return "mp3";
      return "webm";
    }

    async function collectAllParts() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        await stopTake({ keepState: true });
      }
      const parts = sessionDrafts.slice();
      if (recordedBlob && recordedBlob.size > 0) {
        parts.push({ blob: recordedBlob, mime: recordedMime });
      }
      return parts;
    }

    sendBtn.addEventListener("click", async () => {
      if (state === "sending") return;
      state = "sending";
      updateActionButtons();
      setStatus("Sending…", "warn");
      uploadProgress.classList.add("visible");
      uploadProgressBar.style.width = "5%";

      let parts;
      try {
        parts = await collectAllParts();
      } catch (e) {
        setStatus("Could not finish recording: " + e.message, "err");
        state = "ready";
        updateActionButtons();
        return;
      }

      if (!parts.length) {
        setStatus("Nothing to send.", "err");
        state = "idle";
        updateActionButtons();
        uploadProgress.classList.remove("visible");
        return;
      }

      let uploadBlob;
      let uploadMime;
      let ext;
      try {
        setStatus("Preparing…", "warn");
        const merged = await mergeBlobsToWav(parts);
        uploadBlob = merged.blob;
        uploadMime = merged.mime;
        ext = merged.ext || extForMime(uploadMime);
      } catch (e) {
        // Fallback: send first/last single blob if merge fails
        if (parts.length === 1) {
          uploadBlob = parts[0].blob;
          uploadMime = parts[0].mime || uploadBlob.type;
          ext = extForMime(uploadMime);
        } else {
          setStatus("Could not merge drafts: " + e.message, "err");
          state = "ready";
          updateActionButtons();
          uploadProgress.classList.remove("visible");
          return;
        }
      }

      const title = document.getElementById("noteTitle").value.trim();
      const settings = getSettings();
      const form = new FormData();
      form.append("audio", uploadBlob, `recording.${ext}`);
      form.append("title", title);
      form.append("model", settings.model);
      form.append("translate", settings.translate ? "true" : "false");
      form.append("update_ledger", "false");
      form.append(
        "client_id",
        localStorage.getItem("client_id") || (localStorage.client_id = crypto.randomUUID())
      );

      try {
        setStatus("Sending…", "warn");
        const note = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/notes");
          xhr.responseType = "json";
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) {
              uploadProgressBar.style.width =
                Math.max(5, Math.round((ev.loaded / ev.total) * 70)) + "%";
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
            else {
              const detail =
                (xhr.response && (xhr.response.detail || xhr.response.message)) ||
                xhr.statusText;
              reject(new Error(typeof detail === "string" ? detail : "Upload failed"));
            }
          };
          xhr.onerror = () => reject(new Error("Network error"));
          xhr.send(form);
        });

        uploadProgressBar.style.width = "100%";

        if (draftId) {
          try { await clearDraftIdb(draftId); } catch (_) {}
        }
        document.getElementById("noteTitle").value = "";

        setStatus("Saved", "ok");
        resetRecorderUi();
        showNoteDetail(note);
      } catch (e) {
        setStatus("Failed: " + e.message, "err");
        state = "ready";
        updateActionButtons();
        uploadProgressBar.style.width = "0%";
      }
    });

    async function deleteNoteById(noteId, { confirmMsg = "Delete this note?" } = {}) {
      if (!noteId) return false;
      if (!confirm(confirmMsg)) return false;
      const r = await fetch("/api/notes/" + encodeURIComponent(noteId), {
        method: "DELETE",
      });
      if (!r.ok) throw new Error("delete failed");
      return true;
    }

    async function loadNotes() {
      const box = document.getElementById("notesList");
      box.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
      try {
        const r = await fetch("/api/notes");
        if (!r.ok) throw new Error("failed");
        const j = await r.json();
        const notes = j.notes || [];
        if (!notes.length) {
          box.innerHTML = '<div class="empty">No notes yet.</div>';
          return;
        }
        box.innerHTML = "";
        for (const n of notes) {
          const row = document.createElement("div");
          row.className = "note-row";
          row.dataset.id = n.id;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "note-item";
          const when = (n.created_at || "").replace("T", " ").replace("+00:00", " UTC").slice(0, 16);
          const preview = (n.transcript || n.error || "(empty)").trim();
          btn.innerHTML =
            `<div class="meta"><span>${escapeHtml(n.title || n.id)}</span><span>${escapeHtml(when)}</span></div>` +
            `<div class="preview">${escapeHtml(preview)}</div>`;
          btn.addEventListener("click", () => showNoteDetail(n));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "note-del";
          del.title = "Delete note";
          del.setAttribute("aria-label", "Delete note");
          del.textContent = "🗑";
          del.addEventListener("click", async (ev) => {
            ev.stopPropagation();
            del.disabled = true;
            try {
              const ok = await deleteNoteById(n.id);
              if (ok) {
                if (currentNoteId === n.id) currentNoteId = null;
                row.remove();
                if (!box.querySelector(".note-row")) {
                  box.innerHTML = '<div class="empty">No notes yet.</div>';
                }
              }
            } catch (e) {
              alert("Delete failed: " + e.message);
              del.disabled = false;
            }
          });

          row.appendChild(btn);
          row.appendChild(del);
          box.appendChild(row);
        }
      } catch (_) {
        box.innerHTML = '<div class="empty">Could not load notes.</div>';
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function saveNoteTitle() {
      if (!currentNoteId) return;
      const input = document.getElementById("detailTitleInput");
      const btn = document.getElementById("saveTitleBtn");
      const title = input.value.trim();
      if (!title) {
        setTitleSaveStatus("Title cannot be empty", "err");
        input.focus();
        return;
      }
      btn.disabled = true;
      setTitleSaveStatus("Saving…");
      try {
        const r = await fetch("/api/notes/" + encodeURIComponent(currentNoteId), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) {
          const detail = body.detail || body.message || "failed";
          throw new Error(typeof detail === "string" ? detail : "failed");
        }
        input.value = body.title || title;
        setTitleSaveStatus("Title saved", "ok");
      } catch (e) {
        setTitleSaveStatus("Save failed: " + e.message, "err");
      } finally {
        btn.disabled = false;
      }
    }

      const ok = window.confirm(
        "Delete this ledger row? This cannot be undone from the phone."

      const formSend = document.getElementById("finSend");
      const cardBtns = document.querySelectorAll(

      cardBtns.forEach((b) => {
        b.disabled = true;

      try {
        const res = await fetch("/api/finance/transactions/" + r, {
          method: "DELETE",
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = body.detail || body.error || "Delete failed";
          throw new Error(
            typeof detail === "string" ? detail : JSON.stringify(detail)
          );

        const opts = financeOpts || FIN_DEFAULTS;
        if (financeFormOpen) {
          resetFinanceForm(opts);
